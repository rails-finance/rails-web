L5:
  supply:
    title: |-
      How Supplying Works
    intro: |-
      Supplying deposits an asset into the Pool, which mints aTokens for it. The deposit earns the variable supply rate and, while on as collateral, backs borrowing.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Supplied balance
        text: |-
          the aToken balance grows at the supply rate, which follows how much of the reserve is on loan.
      - bold: |-
          Collateral on or off
        text: |-
          on a first supply of an asset that can back borrowing, the Pool switches it on; the owner can switch it off.
      - bold: |-
          Collateral off
        text: |-
          an asset off as collateral earns interest but backs no debt and cannot be seized in a liquidation.
      - bold: |-
          Assets that stay off
        text: |-
          an asset with a 0% loan-to-value cannot be switched on, and an isolated asset stays off while other collateral is on.
      - bold: |-
          Supplying for someone else
        text: |-
          anyone can supply on behalf of any account; the deposit belongs to that account.
    links:
      - label: |-
          Supplying tokens
        doc: SUPPLY_HELP
      - label: |-
          Collateral status
        doc: TOGGLE_COLLATERAL
      - label: |-
          Isolation mode
        doc: ISOLATION
      - label: |-
          Reserve parameters
        doc: RESERVE

  withdraw:
    title: |-
      How Withdrawing Works
    intro: |-
      Withdrawing returns supplied assets from the Pool to a wallet, burning the matching aTokens. It can go only as far as the collateral left keeps any debt covered.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Interest comes with it
        text: |-
          the supplied balance includes the supply interest earned, so more can come out than went in.
      - bold: |-
          Health factor
        text: |-
          the Pool allows a withdrawal only while the health factor stays at or above 1.
      - bold: |-
          Available liquidity
        text: |-
          the asset has to be in the Pool to leave it, so a withdrawal can wait while most of a reserve is on loan.
      - bold: |-
          WETH gateway
        text: |-
          the route for ETH: it takes the supplied WETH, withdraws it from the Pool, unwraps it and sends ETH on.
      - bold: |-
          Only the owner
        text: |-
          a withdrawal takes the sender's supply, so no other account can withdraw from this position.
    links:
      - label: |-
          Withdrawing tokens
        doc: WITHDRAW_HELP
      - label: |-
          Withdrawing collateral
        doc: WITHDRAW_COLLATERAL
      - label: |-
          The WETH gateway
        doc: GATEWAY

  borrow:
    title: |-
      How Borrowing Works
    intro: |-
      Borrowing draws an asset from the Pool against the account's collateral, minting debt tokens that accrue variable interest until repaid.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Borrowing power
        text: |-
          the collateral's value times its maximum LTV, each asset's setting averaged by value; the liquidation threshold sits a little higher.
      - bold: |-
          One shared health factor
        text: |-
          one health factor covers all the account's collateral and debt; borrowing lowers it, and below 1 the account can be liquidated.
      - bold: |-
          Variable borrow interest
        text: |-
          the rate follows how much of the reserve is on loan, so it moves with every supply, borrow and repayment.
      - bold: |-
          Borrowing for someone else
        text: |-
          credit delegation: the owner approves another account for an amount, and that account borrows against the owner's collateral.
    links:
      - label: |-
          Borrowing tokens
        doc: BORROW_HELP
      - label: |-
          Health factor
        doc: HF
      - label: |-
          Interest rates
        doc: INTEREST_RATES
      - label: |-
          Credit delegation
        doc: CREDIT_DELEGATION

  repay:
    title: |-
      How Repaying Works
    intro: |-
      Repaying returns borrowed tokens to the Pool, burning the matching debt tokens. The debt falls, the health factor rises, and collateral is freed.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Partial or full
        text: |-
          any amount can be repaid at any time; repaying the whole balance clears that asset's debt, interest included.
      - bold: |-
          Interest
        text: |-
          debt grows at the variable borrow rate, so more is owed at repayment than was borrowed.
      - bold: |-
          Repaying with aTokens
        text: |-
          a debt can be repaid with supplied tokens of the same asset, burning those aTokens.
      - bold: |-
          Repaying for someone else
        text: |-
          anyone can repay any account's debt without the owner's approval.
    links:
      - label: |-
          Repaying tokens
        doc: REPAY_HELP
      - label: |-
          Ways to repay
        doc: POOL_REPAY

  liquidation:
    title: |-
      How Liquidations Work
    intro: |-
      An account can be liquidated once its health factor falls below 1, when its collateral, counted up to each threshold, no longer covers its debt. Automated bots usually do it.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Liquidation bonus
        text: |-
          the liquidator repays part of one debt asset and takes collateral worth that plus the asset's bonus, set by governance.
      - bold: |-
          Protocol fee
        text: |-
          a share of the bonus goes to the treasury as aTokens in the same transaction, on a separate row.
        text_seamless: |-
          Seamless can keep a share of the bonus; it is 0 on most reserves, so the liquidator keeps all of it.
      - bold: |-
          How much one call takes
        text: |-
          up to half the debt, or all of the debt asset at a health factor of 0.95 or below or under $2,000.
        text_seamless: |-
          up to half of the debt asset repaid, or all of it at a health factor of 0.95 or below.
      - bold: |-
          After it
        text: |-
          collateral counts only up to its threshold, so taking it lowers the cover less than clearing the debt raises it.
      - bold: |-
          Still open
        text: |-
          the account stays open, and it can be liquidated again while its health factor is below 1.
    links:
      - label: |-
          Health factor and liquidations
        doc: LIQ_PROCESS
      - label: |-
          Liquidation penalty
        doc: FAQ_PENALTY

  bad_debt:
    title: |-
      How Bad Debt Is Written Off
    intro: |-
      A liquidation can take the last of an account's collateral while some debt remains. The Pool then burns that debt and records it as a deficit on the reserve.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Not a repayment
        text: |-
          no one paid the written-off amount; the borrower's debt is cleared and the reserve carries the shortfall.
      - bold: |-
          Who absorbs it
        text: |-
          Aave's Umbrella stakers and the DAO cover the deficit, with no charge to other borrowers.
      - bold: |-
          Why it happens
        text: |-
          a fast price move or a thin collateral can carry a position past full cover before liquidators reach it.
      - bold: |-
          A separate row
        text: |-
          the write-off is a separate row on the timeline, beside the liquidation that caused it.
    links:
      - label: |-
          Umbrella
        doc: UMBRELLA
      - label: |-
          Deficit cover
        doc: UMBRELLA_DEFICIT

  transfer:
    title: |-
      How Position Transfers Work
    intro: |-
      Supplied balances are aTokens, which move between accounts like any token. A transfer hands supply to another account without leaving the Pool.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Not a deposit or withdrawal
        text: |-
          custody changes hands and no new value enters the Pool, so the lifetime flows give it a separate row.
      - bold: |-
          Two accounts, one move
        text: |-
          one transfer is an out-leg on the sender and an in-leg on the recipient.
      - bold: |-
          Health still enforced
        text: |-
          the Pool refuses a transfer that would leave the sender's health factor below 1.
      - bold: |-
          Interest rides along
        text: |-
          the transferred supply keeps earning the supply rate in the new account, and backs its borrowing once on as collateral.
      - bold: |-
          Who receives it
        text: |-
          the chain does not say whether the receiving account has the same owner.
    links:
      - label: |-
          aTokens
        doc: ATOKEN
      - label: |-
          Supplying
        doc: OVERVIEW_SUPPLY

  repay_with_collateral:
    title: |-
      How Repaying with Collateral Works
    intro: |-
      Repaying with collateral pays a debt with the account's supply instead of tokens from the wallet. In one transaction, collateral is withdrawn, swapped for the debt asset and repaid.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One transaction
        text: |-
          Aave's repay adapter takes the approved supply, swaps it through ParaSwap and repays, using a flash loan where needed.
      - bold: |-
          Flash loan
        text: |-
          a loan taken and returned inside one transaction, which lets the debt be repaid before the collateral moves.
      - bold: |-
          Leftover supplied back
        text: |-
          the swap is sized with room for price movement, and what it did not use is supplied back.
      - bold: |-
          Health factor
        text: |-
          debt and collateral both fall; when the debt falls more against the thresholds, the health factor rises.
      - bold: |-
          Cost
        text: |-
          the swap's price and slippage, and any flash-loan fee, come out of the collateral sold.
    links:
      - label: |-
          Repay with collateral
        doc: SWAP_REPAY
      - label: |-
          Flash loans
        doc: FAQ_FLASH_LOAN
      - label: |-
          Health factor
        doc: HF

  collateral_swap:
    title: |-
      How a Collateral Swap Works
    intro: |-
      A collateral swap trades one supplied asset for another without either leaving the position. Part of a supply is withdrawn, swapped, and supplied back in one transaction.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One transaction
        text: |-
          Aave's liquidity swap adapter takes the approved supply, sells it through ParaSwap and supplies what it bought.
      - bold: |-
          Slippage
        text: |-
          the owner sets the least the swap must deliver, and it reverts below that.
      - bold: |-
          Health factor
        text: |-
          the debt does not move, so the health factor moves little, unless the two assets have different thresholds.
      - bold: |-
          Why do it
        text: |-
          to change which asset backs the debt without repaying it, for a better rate, a higher LTV or other exposure.
    links:
      - label: |-
          Collateral swap
        doc: SWAP_COLLATERAL
      - label: |-
          Flash loans
        doc: FAQ_FLASH_LOAN

  collateral_swap_cow:
    title: |-
      How a Collateral Swap Works
    intro: |-
      A collateral swap trades one supplied asset for another without either leaving the position. The owner signs a CoW Protocol order, and the settlement makes the trade.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          The order
        text: |-
          the settlement takes the owner's aTokens, sells them, and the asset bought is supplied back to the account.
      - bold: |-
          Slippage
        text: |-
          the order names the least the owner accepts, and it settles at that or better, or not at all.
      - bold: |-
          Health factor
        text: |-
          the debt does not move, so the health factor moves little, unless the two assets have different thresholds.
      - bold: |-
          Why do it
        text: |-
          to change which asset backs the debt without repaying it, for a better rate, a higher LTV or other exposure.
    links:
      - label: |-
          Swap features
        doc: SWAP_TOKENS

  debt_swap:
    title: |-
      How a Debt Swap Works
    intro: |-
      A debt swap changes which asset the position owes. In one transaction a new debt is opened, swapped for the old debt's asset and used to repay it.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One transaction
        text: |-
          Aave's debt swap adapter borrows the new asset under the owner's delegation, buys the old asset through ParaSwap and repays.
      - bold: |-
          Borrowed to fund it, returned unused
        text: |-
          the adapter borrows a little more than the trade needs, and what it did not use repays part of the new debt.
      - bold: |-
          Health factor
        text: |-
          the new debt is worth about the old plus the trade's cost, so the health factor moves little at the time.
      - bold: |-
          What it changes
        text: |-
          the debt's dollar value and its rate now follow the new asset.
      - bold: |-
          Why do it
        text: |-
          to move to a lower rate, to owe an asset the owner expects to fall, or to match the collateral.
    links:
      - label: |-
          Debt swap
        doc: SWAP_DEBT
      - label: |-
          Credit delegation
        doc: CREDIT_DELEGATION

  debt_swap_cow:
    title: |-
      How a Debt Swap Works
    intro: |-
      A debt swap changes which asset the position owes. The owner signs a CoW Protocol order, and one transaction borrows the new asset, sells it and repays the old debt.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          The order
        text: |-
          a one-order contract the Aave app creates borrows the new asset for the owner and sells it in the settlement.
      - bold: |-
          Slippage
        text: |-
          the order names the most of the new asset the owner will sell, and no more is borrowed.
      - bold: |-
          Health factor
        text: |-
          the new debt is worth about the old plus the trade's cost, so the health factor moves little at the time.
      - bold: |-
          What it changes
        text: |-
          the debt's dollar value and its rate now follow the new asset.
    links:
      - label: |-
          Swap features
        doc: SWAP_TOKENS
      - label: |-
          Credit delegation
        doc: CREDIT_DELEGATION

  withdraw_and_swap:
    title: |-
      How Withdraw and Swap Works
    intro: |-
      Withdraw and swap takes supplied tokens out of the Pool and swaps them for another token in one transaction. The swapped tokens go to the wallet, outside the position.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One transaction
        text: |-
          Aave's withdraw swap adapter takes the approved supply, withdraws it, swaps it through ParaSwap and sends the result on.
      - bold: |-
          A withdrawal first
        text: |-
          the supply falls, and the Pool refuses it if the health factor would end below 1.
      - bold: |-
          Cost
        text: |-
          the swap's price and slippage decide how much of the new token arrives.
    links:
      - label: |-
          Withdraw and swap
        doc: SWAP_WITHDRAW
      - label: |-
          Withdrawing and switching
        doc: WITHDRAW_SWITCH

  fallback:
    title: |-
      How Positions Work
    intro: |-
      Aave V3 lets a wallet borrow against supplied collateral in one account, under a single health factor.
    intro_seamless: |-
      Seamless, an Aave V3 fork, lets a wallet borrow against supplied collateral in one account, under a single health factor.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Supply and collateral
        text: |-
          supplied assets earn interest and, while on as collateral, back the account's borrowing.
      - bold: |-
          Borrowing and health factor
        text: |-
          borrowing draws against the pooled collateral, and the health factor measures how well the debt is covered.
      - bold: |-
          One pooled account
        text: |-
          a wallet's supply and debt in one market share one account and one health factor.
    links:
      - label: |-
          Supplying
        doc: OVERVIEW_SUPPLY
      - label: |-
          Borrowing
        doc: OVERVIEW_BORROW
      - label: |-
          Health factor
        doc: HF

  position_open:
    title: |-
      About This Position
    intro: |-
      This panel reads the account from the Pool at the current block: what it supplies, what it borrows and how well its debt is covered.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Health factor
        text: |-
          the collateral, each asset counted up to its liquidation threshold, divided by the debt; below 1 the account can be liquidated.
      - bold: |-
          Maximum LTV and threshold
        text: |-
          each collateral asset's governance settings averaged by value, so they move with the mix of collateral and with votes.
      - bold: |-
          Liquidation price
        text: |-
          with one collateral asset, the price at which the health factor reaches 1; with several, the fall in their combined value.
        text_no_debt: |-
          with no debt, the collateral could carry debt up to its value at the liquidation threshold before becoming liquidatable.
      - bold: |-
          One asset on both sides
        text: |-
          when the collateral and the debt are one asset, its price moves both sides alike, so only interest moves the health factor.
      - bold: |-
          The market
        text: |-
          Core, Prime and EtherFi are separate Pools on Ethereum, each a separate account with a separate health factor.
        text_base: |-
          Aave V3 on Base keeps reserves, settings and an oracle apart from Aave V3 on Ethereum.
        text_seamless: |-
          every Seamless reserve has been frozen since April 2025: repayment, withdrawal and liquidation work, and nothing new can be supplied or borrowed.
    links:
      - label: |-
          Health factor
        doc: HF
      - label: |-
          Reserve parameters
        doc: RESERVE_GOVERNANCE
      - label: |-
          Liquidation price
        doc: FAQ_LIQ_PRICE
      - label: |-
          Credit delegation
        doc: CREDIT_DELEGATION

  position_closed:
    title: |-
      About This Position
    intro: |-
      This account repaid its debt and withdrew its collateral. The panel shows each reserve's highest recorded balance over its life.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Highest recorded
        text: |-
          each reserve's highest balance at the event that reached it, interest included; the peaks need not have stood together.
      - bold: |-
          One account
        text: |-
          every reserve on as collateral backed all of the account's borrowing, under one health factor.
      - bold: |-
          Reopening
        text: |-
          a new supply or borrow by the same wallet in the same market reopens this account and its timeline.
        text_seamless: |-
          a new supply or borrow by the same wallet would reopen this account, and the freeze rules both out.
      - bold: |-
          The market
        text: |-
          Core, Prime and EtherFi are separate Pools on Ethereum, each a separate account with a separate health factor.
        text_base: |-
          Aave V3 on Base keeps reserves, settings and an oracle apart from Aave V3 on Ethereum.
        text_seamless: |-
          every Seamless reserve has been frozen since April 2025; repayment, withdrawal and liquidation still work.
    links:
      - label: |-
          Supplying
        doc: OVERVIEW_SUPPLY
      - label: |-
          Health factor
        doc: HF

  position_liquidated:
    title: |-
      About This Position
    intro: |-
      Liquidation took collateral from this account after its health factor fell below 1. The panel shows each reserve's highest recorded balance over its life.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Health factor
        text: |-
          the account's one safety number across every reserve; below 1 a liquidator can step in.
      - bold: |-
          Liquidation by parts
        text: |-
          a liquidator repays part of one debt asset and takes one collateral asset plus its bonus, so one call need not empty the account.
      - bold: |-
          Liquidated
        text: |-
          the outcome marks an account whose record holds a seizure, even where the owner closed it afterwards.
      - bold: |-
          Reopening
        text: |-
          a new supply or borrow by the same wallet in the same market reopens this account and its timeline.
        text_seamless: |-
          a new supply or borrow by the same wallet would reopen this account, and the freeze rules both out.
      - bold: |-
          The market
        text: |-
          Core, Prime and EtherFi are separate Pools on Ethereum, each a separate account with a separate health factor.
        text_base: |-
          Aave V3 on Base keeps reserves, settings and an oracle apart from Aave V3 on Ethereum.
        text_seamless: |-
          every Seamless reserve has been frozen since April 2025; repayment, withdrawal and liquidation still work.
    links:
      - label: |-
          Health factor and liquidations
        doc: LIQ_PROCESS
      - label: |-
          Liquidation penalty
        doc: FAQ_PENALTY

  market:
    title: |-
      How the market overview works
    intro: |-
      Aave V3 Core is one Pool holding every reserve, where a wallet's supply backs its borrowing under one health factor. This page reads each reserve's size, rates and settings from that Pool.
    intro_base: |-
      Aave V3 on Base is one Pool holding every reserve, apart from Aave V3 on Ethereum. This page reads each reserve's size, rates and settings from that Pool.
    intro_seamless: |-
      Seamless is an Aave V3 fork on Base: one Pool holding every reserve, all frozen since April 2025. This page reads each reserve's size, rates and settings from that Pool.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Utilisation and rates
        text: |-
          borrowed divided by supplied; the rate climbs steeply past the kink, the tick on the blue utilisation bar.
      - bold: |-
          Loan-to-value (LTV)
        text: |-
          the most a wallet can borrow against a reserve, as a share of its value; at 0 the reserve backs no new borrowing.
      - bold: |-
          Liquidation threshold (LT)
        text: |-
          the share of a reserve's value that counts toward covering debt; a reserve with none cannot be collateral.
      - bold: |-
          Liquidation bonus
        text: |-
          the extra collateral a liquidator receives, as a share of the debt repaid.
      - bold: |-
          Caps and closed reserves
        text: |-
          a cap of one token closes that side, and a frozen or paused reserve takes no new supply or borrowing.
        text_seamless: |-
          a frozen reserve takes no new supply or borrowing, and still accrues interest and can be liquidated.
    links:
      - label: |-
          Reserve parameters
        doc: RESERVE
      - label: |-
          Interest rates
        doc: INTEREST_RATES
      - label: |-
          E-mode
        doc: EMODE_HELP
      - label: |-
          Supply limits
        doc: FAQ_SUPPLY_LIMITS
