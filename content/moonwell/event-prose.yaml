# Moonwell prose: every string an event's explanation, the position card's
# explanation and the "?" modals print on a Moonwell account, on Ethereum and on
# Base. The page reads this file and nothing else; the code chooses which
# strings to say and fills their figures (lib/moonwell/event-prose.ts for an
# event, components/protocol/moonwell/moonwell-position-explanation.tsx for the
# position card).
#
# How to edit
#   Each string sits on the line below its `|-`, indented. Write it as it should
#   read: colons, apostrophes, quotes, percent signs and dashes need no escaping.
#   Keep each string on one line, keep its indentation, and leave the ids (the
#   words before a colon) as they are.
#
# Placeholders
#   {name} is a figure the code fills in, printed at the rounding the
#   `placeholders` section gives it; {name|rounding} prints it at another
#   rounding for that string alone. Keep the braces and the name; move a
#   placeholder anywhere in its string.
#
# Limits
#   Every string here is held to rails-ops standards/prose-limits-and-zones.md:
#   `pnpm check:prose-limits` fails a bullet over 20 words or 2 figures, a modal
#   over 200 words, and the rest of the standard's section 2. `pnpm check:prose`
#   confirms the file parses, every id the code reads is here, and every
#   placeholder is one the code supplies.

# ── Roundings: how a placeholder's figure is printed ──
roundings:
  number: |-
    a token amount as the site prints it (113.438, 44,912.562)
  usd: |-
    whole dollars ($4,490)
  pct_plain: |-
    a fraction as a percent, up to two places (0.078 → 7.8%)
  count: |-
    a whole number, grouped (1,204)
  date: |-
    a UTC day (1 Sep 2025)
  address: |-
    an address, shortened and linked to the explorer
  text: |-
    a word or name as given

# ── Placeholders: each name, its default rounding and what it stands for ──
placeholders:
  amount:
    rounding: number
    means: |-
      the underlying tokens the event moved, as the header prints it
  symbol:
    rounding: text
    means: |-
      the market's underlying symbol
  mtokens:
    rounding: number
    means: |-
      the mTokens the event minted, burned or moved
  msymbol:
    rounding: text
    means: |-
      the market's mToken label
  repaid:
    rounding: number
    means: |-
      the debt the liquidator repaid
  seized:
    rounding: number
    means: |-
      the collateral mTokens the liquidator seized
  coll_msymbol:
    rounding: text
    means: |-
      the seized market's mToken label
  sender:
    rounding: address
    means: |-
      the wallet that sent a liquidation's transaction
  liquidator:
    rounding: address
    means: |-
      the account that called the liquidation
  event_type:
    rounding: text
    means: |-
      the event's type as the index names it
  # The position card's figures, drawn by the card with their receipts.
  credit:
    rounding: pct_plain
    means: |-
      the account's credit remaining now, as a share of its credit limit
  supplied_usd:
    rounding: usd
    means: |-
      the supplied markets at the Comptroller's oracle prices now
  borrowed_usd:
    rounding: usd
    means: |-
      the borrowed markets at the Comptroller's oracle prices now
  syms:
    rounding: text
    means: |-
      the markets, named
  count:
    rounding: count
    means: |-
      how many markets there are
  shortfall_usd:
    rounding: usd
    means: |-
      the debt the collateral no longer covers
  liquidity_usd:
    rounding: usd
    means: |-
      the account's credit remaining in dollars, the room left to borrow
  rate:
    rounding: pct_plain
    means: |-
      the variable borrow APY, compounded every second
  liq_count:
    rounding: count
    means: |-
      the liquidations over the account's life
  time_word:
    rounding: text
    means: |-
      time or times
  lead:
    rounding: text
    means: |-
      the words that open the operator bullet, naming the events it counts
  external:
    rounding: count
    means: |-
      the events another address executed
  were:
    rounding: text
    means: |-
      was or were
  peak_supply:
    rounding: number
    means: |-
      the most each market supplied over the account's life, as the card prints it
  peak_debt:
    rounding: number
    means: |-
      the most each market owed over the account's life, as the card prints it
  closed_on:
    rounding: date
    means: |-
      the day the account's record closed
  tx_count:
    rounding: count
    means: |-
      the account's transactions
  tx_word:
    rounding: text
    means: |-
      transaction or transactions

# ── The event explanation's group headings, in the order the pane shows them ──
group_words:
  happened: |-
    What happened
  adds_up: |-
    How it adds up
  leaves: |-
    Where it leaves the position

# ── Words the code puts into a sentence ──
words:
  the_asset: |-
    the asset
  and: |-
    and
  was: |-
    was
  were: |-
    were
  tx_one: |-
    transaction
  tx_many: |-
    transactions
  time_one: |-
    time
  time_many: |-
    times
  more_one: |-
    more market
  more_many: |-
    more markets
  operator_where: |-
    on this account's timeline
  # T2's balance sheet (ui-jobs 330): the Risk and Limits rows, the parameter
  # rows and the words for a figure the page does not hold.
  sheet_fall: |-
    Collateral can fall
  sheet_limit: |-
    Credit limit
  sheet_borrowable: |-
    Credit remaining
  sheet_collateral_factor: |-
    {symbol} collateral factor
  sheet_unread: |-
    Not read on this page
  sheet_no_price: |-
    A market here has no price
  # The sheet's read-more, one per row: what the figure is and where it is read.
  tip_coll_last: |-
    The collateral's total in dollars once the previous transaction on this timeline had run, from the market rows the page replays.
  tip_coll_interest: |-
    The interest every supplied market earned between the previous event and this one, at Moonwell's latest oracle prices by this event.
  tip_coll_interest_asset: |-
    The {symbol} the supply earned since the previous event: its balance just before this transaction less its balance after the previous one.
  tip_coll_market: |-
    The change Moonwell's oracle prices made to the dollar value of the collateral held between the previous event and this one.
  tip_coll_before: |-
    The collateral's total in dollars just before this transaction, each market's supply at Moonwell's latest oracle price by this event.
  tip_coll_event: |-
    The {symbol} this transaction moved on the supplied side, its supply after less before, at Moonwell's latest {symbol} oracle price by this event.
  tip_coll_total: |-
    The collateral's total in dollars after this transaction: each market's supply, its mTokens times the exchange rate, at Moonwell's latest oracle price by this event. Where the side holds one market, its amount stands beside the dollars.
  tip_debt_last: |-
    The debt's total in dollars once the previous transaction on this timeline had run, from the market rows the page replays.
  tip_debt_interest: |-
    The interest every borrowed market accrued between the previous event and this one, at Moonwell's latest oracle prices by this event.
  tip_debt_interest_asset: |-
    The {symbol} the borrow accrued since the previous event: the debt just before this transaction less the debt after the previous one.
  tip_debt_market: |-
    The change Moonwell's oracle prices made to the dollar value of the debt owed between the previous event and this one.
  tip_debt_before: |-
    The debt's total in dollars just before this transaction, each market's accountBorrows at Moonwell's latest oracle price by this event.
  tip_debt_event: |-
    The {symbol} this transaction moved on the borrowed side, the market's accountBorrows after less before, at Moonwell's latest {symbol} oracle price by this event.
  tip_debt_asset: |-
    The {symbol} owed after this transaction, the market's accountBorrows, at Moonwell's latest {symbol} oracle price by this event.
  tip_debt_repaid: |-
    The assets this account once borrowed and owes none of after this event.
  tip_debt_total: |-
    The debt's total in dollars after this transaction: each market's accountBorrows at Moonwell's latest oracle price by this event. Where the side holds one market, its amount stands beside the dollars.
  tip_fall: |-
    How far the collateral's total value can fall, the debt's value held, before credit remaining reaches zero: the credit remaining as a share of the credit limit.
  tip_limit: |-
    The most the account could borrow after this event: each entered market's collateral in dollars times its collateral factor, added up.
  tip_borrowable: |-
    What the account could still borrow in dollars after this event: the credit limit less the debt, as the Comptroller's getAccountLiquidity states it. At zero the account can be liquidated.
  tip_collateral_factor: |-
    The share of the {symbol} supplied that counts toward the borrowing limit, set by governance in the Comptroller's markets() for the market.
  # The timeline head (rails-ops decision 0045, TO-DO-ui-jobs 367): the kind
  # as a past participle, then at most one clause for what the spine cannot
  # show, after the middle dot. Read through MOONWELL_HEAD_WORDS
  # (lib/moonwell/event-templates.ts). The spine carries the figures.
  t1_sep: |-
    ·
  t1_supplied: |-
    Supplied
  t1_withdrew: |-
    Withdrew
  t1_borrowed: |-
    Borrowed
  t1_repaid: |-
    Repaid
  t1_liquidated: |-
    Liquidated
  t1_transferred: |-
    Transferred
  t1_to: |-
    to
  t1_from: |-
    from
  t1_by: |-
    by
  t1_leg_sent: |-
    transferred out
  t1_leg_received: |-
    transferred in
  t1_leg_seized: |-
    seized
  t1_leg_repaid: |-
    repaid

# ── The position card's explanation (zone Z1): an unheaded lead, then bullets
# under Holdings, Risk, Rate and History when two of them hold two or more
# bullets. Risk holds the shortfall or the credit remaining in dollars; the
# credit remaining share stands in the lead (ui-jobs 632). A closed
# account carries the lead and History.
# Read by positionWords / positionNodes (lib/moonwell/event-templates.ts). ──
position_words:
  heading_holdings: |-
    Holdings
  heading_risk: |-
    Risk
  heading_rate: |-
    Rate
  heading_history: |-
    History
  # ── An open account ──
  lead_shortfall: |-
    The Comptroller reports a shortfall, so the account can be liquidated now:
  lead_debt: |-
    The account borrows against its supplied collateral, with {credit} of its credit limit remaining:
  lead_debt_unread: |-
    The account borrows against its supplied collateral:
  lead_supply: |-
    The account supplies collateral to Moonwell and owes nothing:
  lead_earn: |-
    The account supplies to Moonwell to earn, with nothing entered as collateral:
  totals_both: |-
    The supplied markets are worth {supplied_usd} and the borrowed markets {borrowed_usd}.
  totals_supplied: |-
    The supplied markets are worth {supplied_usd}.
  totals_borrowed: |-
    The borrowed markets are worth {borrowed_usd}.
  unentered: |-
    The {syms} supply is not entered as collateral, so it backs no borrowing.
  unentered_many: |-
    The supply in {count} markets is not entered as collateral, so it backs no borrowing.
  shortfall: |-
    The shortfall is {shortfall_usd}, the debt the collateral no longer covers.
  capacity: |-
    Credit remaining is {liquidity_usd}, what the account can still borrow.
  rate: |-
    The debt accrues at a {rate} borrow APY.
  rate_avg: |-
    The debts accrue at a {rate} average borrow APY.
  liquidated: |-
    It has been liquidated {liq_count} {time_word} and remains open.
  operators: |-
    {lead}{external} {were} executed by an address other than the owner's.
  # ── A closed account ──
  closed_lead: |-
    This account ran its course and closed, with nothing left supplied or borrowed:
  peaks_both: |-
    At its height it held {peak_supply} supplied and owed {peak_debt}.
  peaks_supply: |-
    At its height it held {peak_supply} supplied.
  peaks_debt: |-
    At its height it owed {peak_debt} and held no lasting supply.
  liquidated_closed: |-
    It was liquidated {liq_count} {time_word}.
  closure: |-
    Its record closed on {closed_on}, after {tx_count} {tx_word}.

# ── Sentences more than one template says ──
shared_sentences:
  stake.empty:
    when: |-
      the event left no mTokens in the market
    text: |-
      That empties the position's stake in this market.

# ── Templates: one per kind of event ──
#   id          the template's id
#   title       the event's label in the template list
#   when        the event and state that select it
#   L5          the modal it opens (see L5 below)
#   variants    each variant's id and when it applies
#   sentences   its sentences, each with `when` and `text`
#   order       the order the explanation says them in, shared sentences included
#   groups      which group (group_words) each sentence of order sits in
#   alternates  lists of sentences the code says at most one of
# A figure the card's cells, notes or price row show stays out of a sentence
# unless the sentence says what it means (rails-ops
# standards/prose-limits-and-zones.md).
templates:
  - id: moonwell.mint
    title: |-
      Supply
    when: |-
      mint
    L5: supply
    variants:
      default: |-
        always
    sentences:
      mint.what:
        when: |-
          always
        text: |-
          Supplied {amount} {symbol} to Moonwell's {symbol} market, minting {mtokens} {msymbol} in return.
      mint.router:
        when: |-
          the deposit went through the WETH Router
        text: |-
          The deposit came in as native ETH through Moonwell's WETH Router, which wraps it to WETH.
    order:
      - mint.what
      - mint.router
    groups:
      happened: [mint.what, mint.router]

  - id: moonwell.redeem
    title: |-
      Withdraw
    when: |-
      redeem
    L5: withdraw
    variants:
      partial: |-
        the position still holds mTokens in the market
      empty: |-
        the withdrawal emptied the market
    sentences:
      redeem.what:
        when: |-
          always
        text: |-
          Withdrew {amount} {symbol} from the {symbol} market, burning {mtokens} {msymbol}.
    order:
      - redeem.what
      - stake.empty
    groups:
      happened: [redeem.what]
      leaves: [stake.empty]

  - id: moonwell.borrow
    title: |-
      Borrow
    when: |-
      borrow
    L5: borrow
    variants:
      first: |-
        the position's first debt in this market
      more: |-
        the market already held debt
    sentences:
      borrow.what_first:
        when: |-
          first
        text: |-
          Borrowed {amount} {symbol} against the account's supplied collateral, the position's first debt in this market.
      borrow.what:
        when: |-
          more
        text: |-
          Borrowed {amount} {symbol} against the account's supplied collateral.
    order:
      - borrow.what_first
      - borrow.what
    groups:
      happened: [borrow.what_first, borrow.what]
    alternates:
      - [borrow.what_first, borrow.what]

  - id: moonwell.repay
    title: |-
      Repay
    when: |-
      repay
    L5: repay
    variants:
      partial: |-
        some of the market's debt remains
      full: |-
        the repayment cleared the market's debt
    sentences:
      repay.what:
        when: |-
          always
        text: |-
          Repaid {amount} {symbol} of the {symbol} debt.
      repay.external:
        when: |-
          another address paid
        text: |-
          Another address paid this repayment for the owner.
      repay.cleared:
        when: |-
          full
        text: |-
          That clears the {symbol} debt in full.
    order:
      - repay.what
      - repay.external
      - repay.cleared
    groups:
      happened: [repay.what, repay.external]
      leaves: [repay.cleared]

  - id: moonwell.liquidation
    title: |-
      Liquidation
    when: |-
      liquidation
    L5: liquidation
    variants:
      default: |-
        always
    sentences:
      liq.what:
        when: |-
          the row carries the seized mTokens
        text: |-
          A liquidator repaid {repaid} {symbol} of the account's debt and seized {seized} {coll_msymbol} of collateral.
      liq.what_debt:
        when: |-
          the row does not carry the seized mTokens
        text: |-
          A liquidator repaid {repaid} {symbol} of the account's debt.
      liq.why:
        when: |-
          always
        text: |-
          The account's debt had outgrown what its collateral covers, so anyone could liquidate it.
      liq.sender:
        when: |-
          the wallet that sent the transaction is not the liquidator
        text: |-
          The wallet {sender} sent the transaction through the contract {liquidator}, which is the liquidator.
      liq.bot:
        when: |-
          the liquidator signed the transaction
        text: |-
          The liquidator {liquidator} is a third party, typically an automated bot.
    order:
      - liq.what
      - liq.what_debt
      - liq.why
      - liq.sender
      - liq.bot
    groups:
      happened: [liq.what, liq.what_debt, liq.why, liq.sender, liq.bot]
    alternates:
      - [liq.what, liq.what_debt]
      - [liq.sender, liq.bot]

  - id: moonwell.transfer_in
    title: |-
      Transfer in
    when: |-
      transfer_in
    L5: transfer_in
    variants:
      default: |-
        always
    sentences:
      transfer_in.what:
        when: |-
          always
        text: |-
          Received {mtokens} {msymbol}, the market's receipt token, from another wallet.
    order:
      - transfer_in.what
    groups:
      happened: [transfer_in.what]

  - id: moonwell.transfer_out
    title: |-
      Transfer out
    when: |-
      transfer_out to another wallet
    L5: transfer_out
    variants:
      partial: |-
        the position still holds mTokens in the market
      empty: |-
        the transfer emptied the market
    sentences:
      transfer_out.what:
        when: |-
          always
        text: |-
          Sent {mtokens} {msymbol}, the market's receipt token, to another wallet.
    order:
      - transfer_out.what
      - stake.empty
    groups:
      happened: [transfer_out.what]
      leaves: [stake.empty]

  - id: moonwell.protocol_share
    title: |-
      Liquidation share
    when: |-
      transfer_out to the market's contract
    L5: liquidation
    variants:
      default: |-
        always
    sentences:
      share.what:
        when: |-
          always
        text: |-
          The market took {mtokens} {msymbol}, the protocol's share of a liquidation's seized collateral.
    order:
      - share.what
      - stake.empty
    groups:
      happened: [share.what]
      leaves: [stake.empty]

  - id: moonwell.fallback
    title: |-
      Event
    when: |-
      an event type the generator does not know
    L5: fallback
    variants:
      default: |-
        always
    sentences:
      fallback.what:
        when: |-
          always
        text: |-
          The account recorded a {event_type} event.
    order:
      - fallback.what
    groups:
      happened: [fallback.what]

