# ── The "?" modals (zone Z4): the event modals and the position card's. Each
# stops at the mechanism and hands it to a Quick Link; no figure of one account
# appears here. ──
L5:
  supply:
    title: |-
      How supplying works
    intro: |-
      Supplying deposits an asset into a Moonwell market and mints mTokens, a transferable receipt, in exchange. The deposit earns the market's supply rate.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          mTokens
        text: |-
          each market's mToken is a receipt whose exchange rate with the underlying grows as interest accrues, so the same balance redeems for more.
      - bold: |-
          Entering a market
        text: |-
          a supply backs borrowing only once its market is entered as collateral; the owner can enter or leave a market.
      - bold: |-
          Transferable positions
        text: |-
          mTokens are ERC-20s, so sending them moves the deposit and its collateral role with no mint or redeem.
    links:
      - label: |-
          Supply
        doc: SUPPLY
      - label: |-
          mTokens
        doc: MTOKENS
      - label: |-
          Market membership
        doc: COMPTROLLER

  withdraw:
    title: |-
      How withdrawing works
    intro: |-
      Withdrawing burns mTokens and returns the underlying asset to the wallet, as far as the market has liquidity and the remaining collateral covers any debt.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Liquidity
        text: |-
          a withdrawal needs that much of the asset unborrowed in the market; when utilization is high it waits for repayments or new supply.
      - bold: |-
          Effect on credit
        text: |-
          withdrawing collateral lowers the credit limit, and the Comptroller blocks a withdrawal that would leave debt uncovered.
    links:
      - label: |-
          Checking available liquidity
        doc: WITHDRAW_LIQUIDITY
      - label: |-
          Credit limit
        doc: CREDIT_LIMIT

  borrow:
    title: |-
      How borrowing works
    intro: |-
      Borrowing draws an asset against the account's supplied collateral. The debt accrues interest continuously, so it grows between events.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Credit limit
        text: |-
          the sum of each entered market's supply in dollars times its collateral factor; the account can borrow up to it.
      - bold: |-
          Credit remaining
        text: |-
          the credit limit less the debt; at zero the account becomes liquidatable.
      - bold: |-
          Interest rates
        text: |-
          borrow rates follow market demand along a curve that governance sets, so they change in real time.
      - bold: |-
          The emitted debt figure
        text: |-
          each borrow and repay event carries the borrower's total debt after it, interest included to that moment.
    links:
      - label: |-
          How to borrow
        doc: BORROW_HOW
      - label: |-
          Credit remaining
        doc: CREDIT_REMAINING
      - label: |-
          Are interest rates stable?
        doc: BORROW_RATES

  repay:
    title: |-
      How repaying works
    intro: |-
      Repaying returns the borrowed asset to the market, clearing debt and restoring the account's borrowing headroom.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          No fixed term
        text: |-
          a loan has no maturity date; it stays open while the credit remaining stays above zero.
      - bold: |-
          Accrued interest
        text: |-
          interest keeps accruing between events, so a gap between the debt after one event and before the next is accrued interest.
      - bold: |-
          Anyone may repay
        text: |-
          any address can repay an account's debt, the one thing a third party can do for an account unasked.
    links:
      - label: |-
          Loan structure
        doc: REPAY_STRUCTURE
      - label: |-
          Accrued interest
        doc: REPAY_INTEREST

  liquidation:
    title: |-
      How liquidations work
    intro: |-
      A Moonwell account becomes liquidatable when its credit remaining reaches zero: the debt is no longer covered by the collateral-factor-weighted supply. Anyone, in practice automated bots, can then liquidate it.
    extraParagraphs:
      - |-
        A liquidator repays part of one debt, at most the close factor of 50%. It seizes mTokens worth 1.10× the repaid debt, 10% extra: the liquidation incentive. The market keeps a share of the seized mTokens for its reserves, and the liquidator receives the rest.
      - |-
        A liquidation is partial and repeatable: each one repays at most half of one debt, nudging the account back toward solvency.
    links:
      - label: |-
          Avoiding liquidation
        doc: AVOID_LIQUIDATION
      - label: |-
          Close factor
        doc: CLOSE_FACTOR
      - label: |-
          Liquidation incentive
        doc: LIQUIDATION_INCENTIVE

  transfer_in:
    title: |-
      How receiving mTokens works
    intro: |-
      mTokens are ordinary ERC-20 tokens, so a Moonwell deposit can change hands without touching the market. Receiving them hands the underlying claim, and its collateral role, to the recipient.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          The claim moves with the token
        text: |-
          the recipient's mToken balance times the exchange rate becomes their underlying claim; no mint or redeem event fires.
      - bold: |-
          Positions can start here
        text: |-
          a wallet that never supplied can still hold a position, because received mTokens are a deposit like any other.
    links:
      - label: |-
          mTokens
        doc: MTOKENS

  transfer_out:
    title: |-
      How sending mTokens works
    intro: |-
      mTokens are ordinary ERC-20 tokens, so a Moonwell deposit can change hands without touching the market. Sending them hands the underlying claim, and its collateral role, to the recipient.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          The claim moves with the token
        text: |-
          the sender gives up the underlying claim its mToken balance represents; no mint or redeem event fires.
      - bold: |-
          Debt stays covered
        text: |-
          the Comptroller blocks a transfer that would leave the sender's debt uncovered, so collateral cannot walk away from a borrow.
    links:
      - label: |-
          mTokens
        doc: MTOKENS
      - label: |-
          Market membership
        doc: COMPTROLLER

  fallback:
    title: |-
      How Moonwell positions work
    intro: |-
      Moonwell is a Compound-V2-compatible lending protocol: a wallet supplies assets into mToken markets and borrows against them, and the Comptroller pools everything into one account.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          mTokens
        text: |-
          each market's receipt token, whose exchange rate with the underlying grows as interest accrues.
      - bold: |-
          Borrowing and credit
        text: |-
          borrowing draws against the collateral-factor-weighted supply; credit remaining measures the headroom, and zero means liquidatable.
    links:
      - label: |-
          Moonwell Core
        doc: CORE
      - label: |-
          Credit limit
        doc: CREDIT_LIMIT

  position_open:
    title: |-
      About this position
    intro: |-
      A Moonwell position is one wallet's account under a Comptroller: what it supplied, what it borrowed against that, and how safely the debt is covered.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One account per wallet
        text: |-
          the Comptroller pools every entered market, so supply in one market backs borrowing in another.
      - bold: |-
          Account liquidity
        text: |-
          the credit limit, each entered market's supply times its collateral factor, less the debt; a negative figure is a shortfall, and anyone can liquidate.
      - bold: |-
          Credit remaining
        text: |-
          the credit limit less the debt, in dollars and as a share of the limit; at zero the shortfall begins.
      - bold: |-
          Entering a market
        text: |-
          a supply backs borrowing only once its market is entered; a supply that is not entered still earns.
      - bold: |-
          Other addresses
        text: |-
          a third party can repay an account's debt or send it mTokens unasked; supplying, borrowing and redeeming act only for the caller.
    links:
      - label: |-
          Credit and liquidations
        doc: AVOID_LIQUIDATION
      - label: |-
          Collateral factor
        doc: COLLATERAL_FACTOR
      - label: |-
          Comptroller
        doc: COMPTROLLER

  position_supply:
    title: |-
      About this position
    intro: |-
      A Moonwell position is one wallet's account under a Comptroller. This one supplies assets and owes nothing, so there is nothing to liquidate.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Entering a market
        text: |-
          a supply backs borrowing only once its market is entered; a supply that is not entered still earns.
      - bold: |-
          mTokens
        text: |-
          each market's receipt token, whose exchange rate with the underlying grows as interest accrues.
      - bold: |-
          Credit limit
        text: |-
          the sum of each entered market's supply times its collateral factor, the most the account could borrow.
    links:
      - label: |-
          Supply
        doc: SUPPLY
      - label: |-
          Credit limit
        doc: CREDIT_LIMIT

  position_closed:
    title: |-
      About this position
    intro: |-
      This account has repaid all its debt and withdrawn its supply. The panel above shows the highest supply and debt each market reached.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Highest recorded
        text: |-
          each market's peak is the maximum of its running balance, replayed from the account's events.
      - bold: |-
          mTokens
        text: |-
          each market's receipt token, whose exchange rate with the underlying grows as interest accrues.
    links:
      - label: |-
          Moonwell Core
        doc: CORE
      - label: |-
          mTokens
        doc: MTOKENS

  position_liquidated:
    title: |-
      About this position
    intro: |-
      This account was liquidated at least once and has since closed, with nothing left supplied or borrowed. The panel above shows the highest supply and debt each market reached.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Highest recorded
        text: |-
          each market's peak is the maximum of its running balance, replayed from the account's events.
      - bold: |-
          Partial and repeatable
        text: |-
          each liquidation repays at most half of one debt, so an account often survives one and closes later.
      - bold: |-
          Account liquidity
        text: |-
          the credit limit less the debt; a negative figure is a shortfall and anyone can liquidate the account.
    links:
      - label: |-
          Avoiding liquidation
        doc: AVOID_LIQUIDATION
      - label: |-
          Close factor
        doc: CLOSE_FACTOR

# ── The /info page's glossary: each term the page uses, defined once, with the
# documentation pages it rests on (rails-ops standards/info-page-template.md). ──
glossary:
  - bold: |-
      Market
    text: |-
      A market is the shared pool of one asset, such as USDC, that suppliers lend into and borrowers draw from. Each market has its own interest rates, which move with how much of the pool is borrowed.
    sources: [{ label: "Moonwell Core", doc: CORE }, { label: "Are interest rates stable?", doc: BORROW_RATES }]
  - bold: |-
      mToken
    text: |-
      An mToken is the receipt a market gives a supplier in exchange for the asset. It can be transferred like any token, and it redeems for a growing amount of the asset as borrowers pay interest.
    sources: [{ label: "mTokens", doc: MTOKENS }]
  - bold: |-
      Comptroller
    text: |-
      The Comptroller is the contract that checks every supply, borrow, repayment and liquidation. It also works out how much each wallet may borrow against what it supplied.
    sources: [{ label: "Comptroller", doc: COMPTROLLER }]
  - bold: |-
      Collateral
    text: |-
      Collateral is the supplied assets a wallet has switched on to back its borrowing. A supply that is not switched on still earns interest but backs no borrowing. The collateral factor is the share of an asset's value that counts toward borrowing.
    sources: [{ label: "How to borrow", doc: BORROW_HOW }, { label: "Collateral factor", doc: COLLATERAL_FACTOR }]
  - bold: |-
      Credit remaining
    text: |-
      Credit remaining is how much more an account may borrow: its credit limit, each entered supply times its collateral factor, less what it owes, in dollars or as a share of the limit. At zero the account can be liquidated.
    sources: [{ label: "Credit remaining", doc: CREDIT_REMAINING }]
  - bold: |-
      Liquidation
    text: |-
      A liquidation happens when an account's credit remaining falls below zero. A liquidator repays part of the debt and receives some of the account's collateral as a bonus, which the borrower bears.
    sources:
      [
        { label: "Avoiding liquidation", doc: AVOID_LIQUIDATION },
        { label: "Liquidation incentive", doc: LIQUIDATION_INCENTIVE },
      ]
  - bold: |-
      Oracle
    text: |-
      An oracle is a contract that reports asset prices. The Comptroller reads the oracle's prices to value collateral and debt, and to decide when to liquidate.
    sources: [{ label: "Comptroller", doc: COMPTROLLER }]
