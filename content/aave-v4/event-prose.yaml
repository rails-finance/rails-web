# Aave V4 event prose: every string the Aave V4 family prints in an event's
# explanation (Z2), the position card's explanation (Z1) and the "?" modals
# (Z4): the event modals, the position card's spoke modal and the two hub
# pages, on Aave V4 Ethereum and Aave V4 Base. Read by
# lib/aave-v4/event-templates.ts (the loader) and lib/aave-v4/event-prose.ts
# (the generator). Every string is one line; `{name}` is a value the code
# supplies, `{name|rounding}` the same value at another rounding. A modal's
# `intro_<spoke>` / `text_<spoke>` is its wording on that spoke (the spoke's
# slug, `-` written `_`). Limits: rails-ops standards/prose-limits-and-zones.md.

roundings:
  spoke_amount: |-
    A token amount as an Aave V4 event's header prints it: whole from 1,000, four places from 0.0001.
  hf: |-
    A health factor as the card prints it: four places below 1.1, two above.
  ratio_frac: |-
    A fraction as a percentage with two places.
  pct_plain: |-
    A fraction as a percentage to two places, trailing zeros dropped.
  pct_whole: |-
    A fraction as a whole percentage.
  usd: |-
    Whole dollars.
  count: |-
    A whole number with thousands separators.
  text: |-
    A name or a word, printed as given.
  address: |-
    An address, shortened and linked to the explorer.

placeholders:
  # ── Z2: the event ──
  amount:
    rounding: spoke_amount
    means: |-
      The amount the event moved, as its header prints it.
  symbol:
    rounding: text
    means: |-
      The event's reserve symbol.
  where:
    rounding: text
    means: |-
      The spoke the event ran on, named where the row names it.
  hub:
    rounding: text
    means: |-
      The hub a borrow came from or a repayment went back to.
  manager:
    rounding: address
    means: |-
      The position manager or gateway that called the spoke for the owner.
  manager_name:
    rounding: text
    means: |-
      That manager's name where Aave's address book lists it, else words for any position manager.
  sibling_acts:
    rounding: text
    means: |-
      What the transaction's other events did, by verb and asset.
  hf_after:
    rounding: hf
    means: |-
      The health factor at the end of the event's block.
  rate_then:
    rounding: ratio_frac
    means: |-
      The asset's borrow rate the previous event recorded, a year.
  rate_now:
    rounding: ratio_frac
    means: |-
      The asset's borrow rate at this event, a year.
  life_interest:
    rounding: spoke_amount
    means: |-
      The interest a cleared debt accrued over its life.
  other_debt:
    rounding: text
    means: |-
      The debt assets left after this event, or after the whole transaction where it borrows again.
  cleared:
    rounding: spoke_amount
    means: |-
      The debt a liquidator repaid.
  seized:
    rounding: spoke_amount
    means: |-
      The collateral a liquidator took.
  debt_symbol:
    rounding: text
    means: |-
      The debt asset a liquidation repaid.
  coll_symbol:
    rounding: text
    means: |-
      The collateral asset a liquidation took, or the one collateral of a position.
  seized_usd:
    rounding: usd
    means: |-
      The collateral taken, at its price at the block.
  cleared_usd:
    rounding: usd
    means: |-
      The debt repaid, at its price at the block.
  bonus:
    rounding: pct_plain
    means: |-
      How much more the collateral taken was worth than the debt repaid.
  liquidator:
    rounding: address
    means: |-
      The account that sent the liquidation.
  event_type:
    rounding: text
    means: |-
      The kind the row records, for an event with no template.
  # ── Z1: the position card (drawn as nodes; the rounding marks a figure) ──
  spoke:
    rounding: text
    means: |-
      The spoke's name.
  supply_usd:
    rounding: usd
    means: |-
      What the supply is worth now.
  coll_usd:
    rounding: usd
    means: |-
      What the collateral is worth now.
  debt_usd:
    rounding: usd
    means: |-
      What the debt is worth now.
  supply_assets:
    rounding: text
    means: |-
      The supplied assets.
  coll_assets:
    rounding: text
    means: |-
      The supplied assets.
  debt_assets:
    rounding: text
    means: |-
      The borrowed assets.
  earned_usd:
    rounding: usd
    means: |-
      The supply interest earned, at today's prices.
  paid_usd:
    rounding: usd
    means: |-
      The borrow interest accrued, at today's prices.
  hf:
    rounding: hf
    means: |-
      The health factor now.
  liq_symbol:
    rounding: text
    means: |-
      The one collateral asset.
  against_symbol:
    rounding: text
    means: |-
      The one debt asset, when it moves with the collateral.
  drop:
    rounding: pct_whole
    means: |-
      The fall that takes the health factor to 1.
  liq_price:
    rounding: usd
    means: |-
      The collateral's price at which the health factor reaches 1.
  liq_ratio:
    rounding: count
    means: |-
      The collateral's price in the debt asset at which the health factor reaches 1.
  capacity:
    rounding: usd
    means: |-
      The debt that could be added before the health factor reaches 1.
  rate:
    rounding: pct_plain
    means: |-
      The latest borrow rate recorded on the spoke.
  rate_symbol:
    rounding: text
    means: |-
      The asset the latest borrow rate is for.
  yearly:
    rounding: spoke_amount
    means: |-
      A year's interest on the debt at that rate, with its symbol.
  gone_assets:
    rounding: text
    means: |-
      The debt assets owed earlier and owed no more.
  peak_supply:
    rounding: usd
    means: |-
      The highest supply the record holds.
  peak_debt:
    rounding: usd
    means: |-
      The highest debt the record holds.
  tx_count:
    rounding: count
    means: |-
      The position's transactions, liquidations left out.
  liq_count:
    rounding: count
    means: |-
      The liquidations in the record.
  external:
    rounding: count
    means: |-
      The events a position manager sent.
  total:
    rounding: count
    means: |-
      The events recorded on this spoke.
  actor:
    rounding: text
    means: |-
      The one position manager, by name or address.
  cf:
    rounding: pct_whole
    means: |-
      The one collateral's collateral factor.
  cf_list:
    rounding: text
    means: |-
      Each collateral with its collateral factor.
  # ── Z2: a position swap (lib/aave-v4/swaps.ts) ──
  given:
    rounding: spoke_amount
    means: |-
      What the swap's given leg moved: the supply withdrawn, the debt repaid, or the borrow on a leverage.
  g_symbol:
    rounding: text
    means: |-
      The given leg's reserve symbol.
  received:
    rounding: spoke_amount
    means: |-
      What the swap's received leg moved: the supply added, the debt borrowed or repaid.
  r_symbol:
    rounding: text
    means: |-
      The received leg's reserve symbol.
  sold_symbol:
    rounding: text
    means: |-
      The symbol of what the Trade sold.
  bought_symbol:
    rounding: text
    means: |-
      The symbol of what the Trade bought.
  price:
    rounding: spoke_amount
    means: |-
      The Trade's effective price, what it bought over what it sold, stated per unit of the smaller.
  price_base:
    rounding: text
    means: |-
      The asset the price is per unit of.
  price_quote:
    rounding: text
    means: |-
      The asset the price is stated in.
  bought:
    rounding: spoke_amount
    means: |-
      What the CoW order's Trade bought.
  topup:
    rounding: spoke_amount
    means: |-
      What the supply took beyond what the Trade bought: tokens from the owner's wallet.
  left:
    rounding: spoke_amount
    means: |-
      What the position withdrew or borrowed beyond what the Trade sold: the flash-loan fee and the refund to the wallet together.
  left_symbol:
    rounding: text
    means: |-
      The symbol of what the position withdrew or borrowed.
  supplies:
    rounding: text
    means: |-
      The assets supplied after the transaction.

group_words:
  happened: |-
    What happened
  adds_up: |-
    How it adds up
  leaves: |-
    Where it leaves the position

# Words the generator puts into a sentence.
words:
  and: |-
    and
  spoke_named: |-
    the {spoke} spoke
  spoke_unnamed: |-
    this spoke
  act_supply: |-
    supplied {symbol}
  act_withdraw: |-
    withdrew {symbol}
  act_borrow: |-
    borrowed {symbol}
  act_repay: |-
    repaid {symbol}
  # The position managers and gateways Aave's address book lists
  # (lib/aave-v4/position-managers.ts), and the words for any other.
  manager_giver: |-
    Aave's Giver position manager
  manager_taker: |-
    Aave's Taker position manager
  manager_config: |-
    Aave's Config position manager
  manager_native_gateway: |-
    Aave's native-token gateway
  manager_signature_gateway: |-
    Aave's signature gateway
  manager_unnamed: |-
    a position manager
  # The timeline head (rails-ops decision 0045, TO-DO-ui-jobs 367): the kind
  # as a past participle, the legs in order where a supply also turned the
  # reserve on as collateral, each after the middle dot. Read through
  # AAVE_V4_HEAD_WORDS (lib/aave-v4/event-templates.ts). The spine carries the
  # figures.
  t1_sep: |-
    ·
  t1_supplied: |-
    Supplied
  t1_withdrew: |-
    Withdrew
  t1_borrowed: |-
    Borrowed
  t1_repaid: |-
    Repaid
  t1_liquidated: |-
    Liquidated
  t1_enabled: |-
    Enabled as collateral
  t1_disabled: |-
    Disabled as collateral
  # A position swap's head, by kind; a leverage is not called a swap.
  t1_collateral_swap: |-
    Swapped collateral
  t1_debt_swap: |-
    Swapped debt
  t1_repay_with_collateral: |-
    Repaid with collateral
  t1_leverage: |-
    Borrowed and supplied
  t1_leg_seized: |-
    seized
  t1_leg_repaid: |-
    repaid

position_words:
  heading_holdings: |-
    Holdings
  heading_risk: |-
    Risk
  heading_rate: |-
    Rate
  heading_history: |-
    History
  # ── An open position ──
  lead_supply: |-
    This position supplies {supply_usd} across {supply_assets} with no debt drawn.
  lead_supply_bare: |-
    This position supplies {supply_usd} with no debt drawn.
  lead: |-
    This position holds {coll_usd} of collateral in {coll_assets} against {debt_usd} of debt in {debt_assets}.
  lead_bare: |-
    This position holds {coll_usd} of collateral against {debt_usd} of debt.
  interest_both: |-
    Interest so far: {earned_usd} earned on the supply and {paid_usd} paid on the debt.
  interest_paid: |-
    Interest so far: {paid_usd} on the debt, already part of it.
  interest_earned: |-
    Interest so far: {earned_usd} earned, already part of the supply.
  interest_both_part: |-
    Leaving out the part opened through a swap aggregator, interest so far is {earned_usd} earned and {paid_usd} paid.
  interest_paid_part: |-
    Leaving out the part opened through a swap aggregator, the debt has accrued {paid_usd} of interest.
  interest_earned_part: |-
    Leaving out the part opened through a swap aggregator, the supply has earned {earned_usd} of interest.
  interest_unknown: |-
    The position was opened through a swap aggregator, so its interest cannot be worked out.
  no_debt: |-
    With nothing borrowed, the position cannot be liquidated.
  capacity_no_debt: |-
    This collateral could carry up to {capacity} of debt before the health factor reaches 1.
  hf_only: |-
    Health factor {hf}: below 1 the position can be liquidated.
  at_line: |-
    At the liquidation line: a small fall in {liq_symbol}'s price or added interest takes it below 1.
  at_line_against: |-
    At the liquidation line: a small fall in {liq_symbol} against {against_symbol} or added interest takes it below 1.
  at_line_basket: |-
    At the liquidation line: a small fall in the collateral's value or added interest takes it below 1.
  liq_single: |-
    If {liq_symbol} falls about {drop} to {liq_price}, the position can be liquidated.
  liq_against: |-
    If {liq_symbol} falls about {drop} against {against_symbol}, to {liq_ratio}, the position can be liquidated.
  liq_basket: |-
    The collateral can fall about {drop} in value before liquidation.
  capacity: |-
    About {capacity} more could be borrowed before the health factor reaches 1.
  rate: |-
    The latest borrow rate recorded here is {rate}, about {yearly} a year on the debt as it stands.
  rate_plain: |-
    The latest borrow rate recorded here is {rate}.
  rate_sym: |-
    The latest {rate_symbol} borrow rate recorded here is {rate}.
  rate_sym_yearly: |-
    The latest {rate_symbol} borrow rate recorded here is {rate}, about {yearly} a year on the debt.
  peaks_both: |-
    At their highest, the supply reached {peak_supply} and the debt {peak_debt}.
  peaks_supply: |-
    At its highest, the supply reached {peak_supply}.
  peaks_debt: |-
    At its highest, the debt reached {peak_debt}.
  record: |-
    The position has recorded {tx_count} transactions.
  record_one: |-
    The position has recorded one transaction.
  record_liq: |-
    Its record holds {tx_count} transactions and {liq_count} liquidations.
  record_liq_one: |-
    Its record holds {tx_count} transactions and one liquidation.
  debt_mix: |-
    Its earlier {gone_assets} debt was cleared; the {debt_assets} debt is what remains.
  operators: |-
    Of the {total} events here, {external} came from an address other than the owner's, all through position managers.
  operators_one: |-
    Of the {total} events here, {external} came from an address other than the owner's, position manager {actor}.
  # ── A closed position ──
  closed_lead_seized: |-
    Liquidation ended this position on the {spoke} spoke, and no balances remain.
  closed_lead_after_liq: |-
    This position on the {spoke} spoke closed after liquidations, its last balances withdrawn.
  closed_lead_owner: |-
    The owner closed this position on the {spoke} spoke, repaying the debt and withdrawing the collateral.
  closed_lead_owner_supply: |-
    The owner closed this supply-only position on the {spoke} spoke.
  seizures: |-
    Liquidators seized its collateral {liq_count} times.
  seizure_one: |-
    Liquidators seized its collateral once.
  cf_then: |-
    While it was open, {coll_symbol} counted at {cf} of its value here.
  cf_then_many: |-
    While it was open, its collateral counted at these shares of its value: {cf_list}.
  cf_now: |-
    Today {coll_symbol} counts at {cf} of its value here; the share while it was open could not be read.
  cf_item: |-
    {symbol} at {cf}
  cf_now_many: |-
    Today its collateral counts at these shares of its value: {cf_list}; the shares then could not be read.

# Sentences more than one template says.
shared_sentences:
  by_manager:
    when: |-
      the owner signed the transaction and a position manager called the spoke
    text: |-
      The owner sent it through {manager_name} ({manager}).
  by_manager_alone:
    when: |-
      a position manager called the spoke and the owner did not sign
    text: |-
      Another account sent the transaction; {manager_name} ({manager}) acted for the owner.
  by_manager_tx:
    when: |-
      as by_manager, and the transaction holds other supplies, withdrawals, borrows or repayments for the owner
    text: |-
      The owner sent it through {manager_name} ({manager}), in a transaction that also {sibling_acts}.
  by_manager_alone_tx:
    when: |-
      as by_manager_alone, and the transaction holds other supplies, withdrawals, borrows or repayments for the owner
    text: |-
      Another account sent the transaction, which also {sibling_acts}; {manager_name} ({manager}) acted for the owner.
  signed.owner:
    when: |-
      the first sentence named the position manager, and the owner sent the transaction
    text: |-
      The owner sent the transaction.
  signed.other:
    when: |-
      the first sentence named the position manager, and another account sent the transaction
    text: |-
      Another account sent the transaction, with the owner's approval of the manager.
  signed.owner_tx:
    when: |-
      as signed.owner, and the transaction holds other supplies, withdrawals, borrows or repayments for the owner
    text: |-
      The owner sent the transaction, which also {sibling_acts}.
  signed.other_tx:
    when: |-
      as signed.other, and the transaction holds other supplies, withdrawals, borrows or repayments for the owner
    text: |-
      Another account sent the transaction, which also {sibling_acts}; the owner had approved the manager.
  sibling:
    when: |-
      the transaction holds other supplies, withdrawals, borrows or repayments for the owner, and the owner called the spoke
    text: |-
      The same transaction also {sibling_acts}.
  hf.at_line:
    when: |-
      the health factor after is from 1 to 1.01
    text: |-
      At {hf_after} the position is at the liquidation line: any fall below 1 lets it be liquidated.
  hf.close:
    when: |-
      the health factor after is from 1.01 to 1.05
    text: |-
      At {hf_after} the position is close to the liquidation line at 1.
  hf.cleared:
    when: |-
      the event left no debt where there was some, supply remains, and nothing is borrowed later in the transaction
    text: |-
      With no debt left, the position cannot be liquidated.
  closed:
    when: |-
      the event left nothing supplied and nothing owed on the spoke
    text: |-
      Nothing is supplied or owed on this spoke now: the position is closed.
  rate.moved:
    when: |-
      the asset's borrow rate moved by half or more since the previous event
    text: |-
      The {symbol} borrow rate moved from {rate_then} at the previous event to {rate_now}.

templates:
  - id: aave4.supply
    title: |-
      Supply
    when: |-
      supply
    L5: supply
    variants:
      default: |-
        a supply to the spoke
      enabled: |-
        a supply that also enabled the asset as collateral
    sentences:
      supply.what:
        when: |-
          default
        text: |-
          Supplied {amount} {symbol} to {where}.
      supply.enabled:
        when: |-
          enabled
        text: |-
          Supplied {amount} {symbol} to {where} and enabled it as collateral.
      coll.on:
        when: |-
          the asset counts as collateral after the event and did not before
        text: |-
          {symbol} now backs the position's borrows, so it can be seized in a liquidation.
      coll.was_on:
        when: |-
          the asset counted as collateral before the event
        text: |-
          {symbol} was already collateral, so the new {symbol} backs the borrows at once.
      coll.off:
        when: |-
          the asset is not collateral after the event
        text: |-
          {symbol} is not collateral: it earns interest and backs no borrow.
    order:
      [
        supply.what,
        supply.enabled,
        by_manager,
        by_manager_alone,
        by_manager_tx,
        by_manager_alone_tx,
        sibling,
        coll.on,
        coll.was_on,
        coll.off,
        hf.at_line,
        hf.close,
      ]
    groups:
      happened: [supply.what, supply.enabled, by_manager, by_manager_alone, by_manager_tx, by_manager_alone_tx, sibling]
      leaves: [coll.on, coll.was_on, coll.off, hf.at_line, hf.close]
    alternates:
      - [supply.what, supply.enabled]
      - [by_manager, by_manager_alone, by_manager_tx, by_manager_alone_tx, sibling]
      - [coll.on, coll.was_on, coll.off]
      - [hf.at_line, hf.close]

  - id: aave4.withdraw
    title: |-
      Withdraw
    when: |-
      withdraw
    L5: withdraw
    variants:
      default: |-
        a withdrawal from the spoke
    sentences:
      withdraw.what:
        when: |-
          the owner called the spoke
        text: |-
          Withdrew {amount} {symbol} to the wallet.
      withdraw.via:
        when: |-
          a position manager or gateway called the spoke, so the tokens went to it
        text: |-
          Withdrew {amount} {symbol} through {manager_name} ({manager}).
      withdraw.all:
        when: |-
          the withdrawal took the whole supply of the asset and the position stays open
        text: |-
          That was the whole {symbol} supply on this spoke.
    order:
      [
        withdraw.what,
        withdraw.via,
        signed.owner,
        signed.other,
        signed.owner_tx,
        signed.other_tx,
        sibling,
        withdraw.all,
        closed,
        hf.at_line,
        hf.close,
      ]
    groups:
      happened:
        [
          withdraw.what,
          withdraw.via,
          signed.owner,
          signed.other,
          signed.owner_tx,
          signed.other_tx,
          sibling,
          withdraw.all,
        ]
      leaves: [closed, hf.at_line, hf.close]
    alternates:
      - [withdraw.what, withdraw.via]
      - [signed.owner, signed.other, signed.owner_tx, signed.other_tx, sibling]
      - [closed, hf.at_line, hf.close]

  - id: aave4.borrow
    title: |-
      Borrow
    when: |-
      borrow
    L5: borrow
    variants:
      default: |-
        a borrow from the spoke
      first: |-
        the position's first debt in the asset
    sentences:
      borrow.what:
        when: |-
          default, the hub not named
        text: |-
          Borrowed {amount} {symbol}.
      borrow.what_hub:
        when: |-
          default, on a spoke that borrows from more than one hub
        text: |-
          Borrowed {amount} {symbol} from the {hub} hub.
      borrow.first:
        when: |-
          first, the hub not named
        text: |-
          Borrowed {amount} {symbol}, the position's first {symbol} debt here.
      borrow.first_hub:
        when: |-
          first, on a spoke that borrows from more than one hub
        text: |-
          Borrowed {amount} {symbol} from the {hub} hub, the position's first {symbol} debt here.
    order:
      [
        borrow.what,
        borrow.what_hub,
        borrow.first,
        borrow.first_hub,
        by_manager,
        by_manager_alone,
        by_manager_tx,
        by_manager_alone_tx,
        sibling,
        hf.at_line,
        hf.close,
        rate.moved,
      ]
    groups:
      happened:
        [
          borrow.what,
          borrow.what_hub,
          borrow.first,
          borrow.first_hub,
          by_manager,
          by_manager_alone,
          by_manager_tx,
          by_manager_alone_tx,
          sibling,
        ]
      leaves: [hf.at_line, hf.close, rate.moved]
    alternates:
      - [borrow.what, borrow.what_hub, borrow.first, borrow.first_hub]
      - [by_manager, by_manager_alone, by_manager_tx, by_manager_alone_tx, sibling]
      - [hf.at_line, hf.close]

  - id: aave4.repay
    title: |-
      Repay
    when: |-
      repay
    L5: repay
    variants:
      default: |-
        a repayment that leaves some of the asset's debt
      cleared: |-
        a repayment that cleared the asset's debt
      dust: |-
        a repayment too small to move the debt
    sentences:
      repay.what:
        when: |-
          default or dust, the hub not named
        text: |-
          Repaid {amount} {symbol}.
      repay.what_hub:
        when: |-
          default or dust, on a spoke that borrows from more than one hub
        text: |-
          Repaid {amount} {symbol} to the {hub} hub.
      repay.all:
        when: |-
          cleared, the hub not named
        text: |-
          Repaid {amount} {symbol}, clearing the {symbol} debt in full.
      repay.all_hub:
        when: |-
          cleared, on a spoke that borrows from more than one hub
        text: |-
          Repaid {amount} {symbol} to the {hub} hub, clearing the {symbol} debt in full.
      repay.dust:
        when: |-
          dust
        text: |-
          The amount is dust and leaves the debt where it was.
      repay.life:
        when: |-
          cleared, the debt's lifetime interest read
        text: |-
          Over its life this {symbol} debt accrued {life_interest} {symbol} of interest.
      repay.other:
        when: |-
          cleared, other debt remains, and nothing is borrowed later in the transaction
        text: |-
          The {other_debt} debt remains.
      repay.after_tx:
        when: |-
          cleared, and the same transaction borrows for the owner after it
        text: |-
          After the transaction the position owes {other_debt}.
    order:
      [
        repay.what,
        repay.what_hub,
        repay.all,
        repay.all_hub,
        by_manager,
        by_manager_alone,
        by_manager_tx,
        by_manager_alone_tx,
        sibling,
        repay.dust,
        repay.life,
        repay.other,
        repay.after_tx,
        closed,
        hf.cleared,
        hf.at_line,
        hf.close,
        rate.moved,
      ]
    groups:
      happened:
        [
          repay.what,
          repay.what_hub,
          repay.all,
          repay.all_hub,
          by_manager,
          by_manager_alone,
          by_manager_tx,
          by_manager_alone_tx,
          sibling,
          repay.dust,
        ]
      adds_up: [repay.life]
      leaves: [repay.other, repay.after_tx, closed, hf.cleared, hf.at_line, hf.close, rate.moved]
    alternates:
      - [repay.what, repay.what_hub, repay.all, repay.all_hub]
      - [by_manager, by_manager_alone, by_manager_tx, by_manager_alone_tx, sibling]
      - [repay.dust, repay.life, rate.moved]
      - [repay.other, repay.after_tx]
      - [closed, hf.cleared, hf.at_line, hf.close]

  - id: aave4.liquidation
    title: |-
      Liquidation
    when: |-
      liquidation
    L5: liquidation
    variants:
      default: |-
        a liquidation on the spoke
    sentences:
      liq.what:
        when: |-
          both legs read
        text: |-
          A liquidator repaid {cleared} {debt_symbol} of the debt and took {seized} {coll_symbol} of collateral.
      liq.what_cleared:
        when: |-
          only the debt leg read
        text: |-
          A liquidator repaid {cleared} {debt_symbol} of the debt.
      liq.what_seized:
        when: |-
          only the collateral leg read
        text: |-
          A liquidator took {seized} {coll_symbol} of collateral.
      liq.by:
        when: |-
          the row names the liquidator
        text: |-
          Liquidator {liquidator} sent the transaction.
      liq.value:
        when: |-
          both legs priced at the block
        text: |-
          The collateral taken was worth {seized_usd}, against {cleared_usd} of debt repaid.
      liq.bonus:
        when: |-
          both legs priced, the collateral worth more
        text: |-
          The difference, {bonus}, is the liquidator's bonus.
      liq.cleared_only:
        when: |-
          the liquidation cleared the debt asset, and no other debt remains
        text: |-
          This cleared the {debt_symbol} debt, the position's only debt.
      liq.cleared_one:
        when: |-
          the liquidation cleared the debt asset, and other debt remains
        text: |-
          This cleared the {debt_symbol} debt; the {other_debt} debt remains.
      liq.again:
        when: |-
          some of the debt asset remains
        text: |-
          Debt remains, so the position can be liquidated again while its health factor is below 1.
    order:
      [
        liq.what,
        liq.what_cleared,
        liq.what_seized,
        liq.by,
        liq.value,
        liq.bonus,
        liq.cleared_only,
        liq.cleared_one,
        liq.again,
      ]
    groups:
      happened: [liq.what, liq.what_cleared, liq.what_seized, liq.by]
      adds_up: [liq.value, liq.bonus]
      leaves: [liq.cleared_only, liq.cleared_one, liq.again]
    alternates:
      - [liq.what, liq.what_cleared, liq.what_seized]
      - [liq.cleared_only, liq.cleared_one, liq.again]

  - id: aave4.toggle
    title: |-
      Collateral
    when: |-
      collateral_toggle
    L5: collateral_toggle
    variants:
      enabled: |-
        the asset enabled as collateral
      disabled: |-
        the asset disabled as collateral
    sentences:
      toggle.on:
        when: |-
          enabled
        text: |-
          Enabled {symbol} as collateral on {where}.
      toggle.off:
        when: |-
          disabled
        text: |-
          Disabled {symbol} as collateral on {where}.
      toggle.backs:
        when: |-
          enabled
        text: |-
          {symbol} now backs the borrows and adds to the room to borrow, so it can be seized in a liquidation.
      toggle.freed:
        when: |-
          disabled
        text: |-
          {symbol} no longer backs the borrows: it cannot be seized, and the room to borrow falls.
    order: [toggle.on, toggle.off, by_manager, by_manager_alone, toggle.backs, toggle.freed]
    groups:
      happened: [toggle.on, toggle.off, by_manager, by_manager_alone]
      leaves: [toggle.backs, toggle.freed]
    alternates:
      - [toggle.on, toggle.off]
      - [by_manager, by_manager_alone]
      - [toggle.backs, toggle.freed]

  - id: aave4.swap
    title: |-
      Swap
    when: |-
      a position swap through a CoW order, served as one event
    L5: swap_supply
    variants:
      collateral_swap: |-
        a collateral swap
      debt_swap: |-
        a debt swap
      repay_with_collateral: |-
        a repay with collateral
      leverage: |-
        a borrow whose proceeds were supplied
    sentences:
      swap.collateral:
        when: |-
          collateral_swap
        text: |-
          Swapped {given} {g_symbol} for {received} {r_symbol}.
      swap.collateral_topped:
        when: |-
          collateral_swap, the supply larger than what the order bought
        text: |-
          Withdrew {given} {g_symbol} and supplied {received} {r_symbol}.
      swap.debt:
        when: |-
          debt_swap
        text: |-
          Moved the debt from {given} {g_symbol} to {received} {r_symbol}.
      swap.repay:
        when: |-
          repay_with_collateral
        text: |-
          Repaid {received} {r_symbol} of debt with {given} {g_symbol} of collateral.
      swap.leverage:
        when: |-
          leverage
        text: |-
          Borrowed {given} {g_symbol} and supplied the {received} {r_symbol} it bought.
      swap.leverage_topped:
        when: |-
          leverage, the supply larger than what the order bought
        text: |-
          Borrowed {given} {g_symbol} and supplied {received} {r_symbol}.
      swap.route:
        when: |-
          every swap
        text: |-
          A CoW Protocol settlement sold the {sold_symbol} for {bought_symbol} at {price} {price_quote} per {price_base}.
      swap.route_topped:
        when: |-
          collateral_swap or leverage, the supply larger than what the order bought
        text: |-
          A CoW Protocol settlement sold the {sold_symbol} for {bought} {bought_symbol}; the other {topup} {bought_symbol} came from the owner's wallet.
      swap.gap:
        when: |-
          the position withdrew or borrowed more than the order sold, by over 0.1%
        text: |-
          Of the {left} {left_symbol} the order left unsold, Aave V3 took a flash-loan fee and the wallet got the rest.
      swap.supplies:
        when: |-
          collateral_swap
        text: |-
          After the transaction the position supplies {supplies}.
      swap.owes:
        when: |-
          debt_swap, repay_with_collateral or leverage, with debt after the transaction
        text: |-
          After the transaction the position owes {other_debt}.
    order:
      [
        swap.collateral,
        swap.debt,
        swap.repay,
        swap.leverage,
        swap.collateral_topped,
        swap.leverage_topped,
        swap.route,
        swap.route_topped,
        swap.gap,
        swap.supplies,
        swap.owes,
        hf.cleared,
        hf.at_line,
        hf.close,
      ]
    groups:
      happened: [swap.collateral, swap.debt, swap.repay, swap.leverage, swap.collateral_topped, swap.leverage_topped]
      adds_up: [swap.route, swap.route_topped, swap.gap]
      leaves: [swap.supplies, swap.owes, hf.cleared, hf.at_line, hf.close]
    alternates:
      - [swap.collateral, swap.debt, swap.repay, swap.leverage, swap.collateral_topped, swap.leverage_topped]
      - [swap.route, swap.route_topped]
      - [swap.supplies, swap.owes, hf.cleared]
      - [hf.at_line, hf.close]

  - id: aave4.fallback
    title: |-
      Event
    when: |-
      any other row
    L5: fallback
    variants:
      default: |-
        an event with no template
    sentences:
      fallback.what:
        when: |-
          every event with no template
        text: |-
          The spoke recorded this {event_type} event for the position.
    order: [fallback.what]
    groups:
      happened: [fallback.what]

