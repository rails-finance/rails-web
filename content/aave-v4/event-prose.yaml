L5:
  supply:
    title: |-
      How supplying works
    intro: |-
      Supplying deposits an asset into a spoke's reserve, where it earns interest. Enabled as collateral, it backs borrowing on that spoke.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Supplied balance
        text: |-
          the deposit is held as reserve shares that grow with interest, and it can be withdrawn at any time.
      - bold: |-
          Collateral on or off
        text: |-
          each supply is enabled or disabled as collateral; only an enabled supply backs borrows and can be seized in a liquidation.
      - bold: |-
          Risk premium
        text: |-
          the collateral enabled sets the position's risk premium, so riskier collateral raises the rate its debt pays.
      - bold: |-
          Position managers
        text: |-
          contracts governance registers and the owner approves to act for the position; one that supplies for the owner pays with its funds.
    links:
      - label: |-
          Supplying on Aave V4
        doc: SUPPLY
      - label: |-
          Collateral status
        doc: COLLATERAL
      - label: |-
          Position managers
        doc: MANAGERS

  withdraw:
    title: |-
      How withdrawing works
    intro: |-
      Withdrawing takes supplied assets, with the interest they have earned, out of a spoke and back to the wallet.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Health factor
        text: |-
          with a borrow open, the spoke allows a withdrawal only while the health factor stays at or above 1.
      - bold: |-
          Supply with no debt against it
        text: |-
          a supply that is not collateral, or backs no borrow, can be withdrawn in full.
      - bold: |-
          Risk premium
        text: |-
          withdrawing collateral with a borrow open updates the position's risk premium and the collateral factors it holds.
      - bold: |-
          Paused reserves
        text: |-
          a reserve that governance has paused cannot be withdrawn from until it is unpaused.
      - bold: |-
          Position managers
        text: |-
          an approved manager can withdraw for the owner; the tokens go to it, so it also needs the owner's allowance for that asset.
    links:
      - label: |-
          Withdrawing on Aave V4
        doc: WITHDRAW
      - label: |-
          Collateral and paused reserves
        doc: WITHDRAW_POSITION
      - label: |-
          Health factor
        doc: HF
      - label: |-
          Allowances for managers
        doc: DELEGATION_MANAGERS

  borrow:
    title: |-
      How borrowing works
    intro: |-
      Borrowing draws an asset from a spoke against the collateral supplied to that spoke. The debt accrues interest until it is repaid.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Collateral factor
        text: |-
          each collateral counts at a share of its value; that one figure is both the borrowing limit and the liquidation line.
      - bold: |-
          Health factor
        text: |-
          the collateral counted that way divided by the debt; borrowing lowers it, and below 1 the position can be liquidated.
      - bold: |-
          Borrow rate
        text: |-
          the lending hub sets one rate for the whole debt from the share of the asset borrowed, so every borrow or repayment moves it.
      - bold: |-
          Risk premium
        text: |-
          a per-position addition to the hub's rate, set by the collateral's risk and recalculated on each borrow and withdrawal.
      - bold: |-
          Position managers
        text: |-
          an approved manager can borrow for the owner; the tokens go to it, so it also needs the owner's allowance for that asset.
    links:
      - label: |-
          Borrowing on Aave V4
        doc: BORROW
      - label: |-
          Health factor
        doc: HF
      - label: |-
          Risk premium
        doc: RISK_PREMIUM
      - label: |-
          Interest rate model
        doc: RATE_MODEL

  repay:
    title: |-
      How repaying works
    intro: |-
      Repaying returns borrowed tokens to the spoke. The debt falls, the health factor rises, and collateral is freed for withdrawal or more borrowing.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Partial or full
        text: |-
          any amount can be repaid at any time; repaying the whole balance clears that asset's debt, interest included.
      - bold: |-
          Interest
        text: |-
          debt grows with interest every block, so more is owed at repayment than was borrowed.
      - bold: |-
          Repaying for someone else
        text: |-
          an approved position manager can repay the owner's debt with its tokens and needs no allowance.
      - bold: |-
          Token approval
        text: |-
          the repaying account first approves the spoke to take the tokens, in a separate transaction or with a signed permit.
    links:
      - label: |-
          Repaying on Aave V4
        doc: REPAY
      - label: |-
          Position managers
        doc: DELEGATION_MANAGERS

  collateral_toggle:
    title: |-
      How collateral works
    intro: |-
      Each supplied asset can be enabled or disabled as collateral. Only enabled assets back borrows and count toward the health factor.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Enabling
        text: |-
          the asset backs borrows and raises the room to borrow, and it can be seized in a liquidation.
      - bold: |-
          Disabling
        text: |-
          the asset backs nothing and cannot be seized; the spoke refuses it while the health factor would fall below 1.
      - bold: |-
          One spoke
        text: |-
          collateral backs only borrows on the same spoke; positions on other spokes do not touch its health factor.
      - bold: |-
          Collateral factors
        text: |-
          disabling collateral updates the collateral factors the position holds, and enabling updates that asset's.
    links:
      - label: |-
          Collateral status
        doc: COLLATERAL
      - label: |-
          Spoke isolation
        doc: SPOKE_ISOLATION
      - label: |-
          Collateral factors held
        doc: DYNAMIC_CONFIG

  liquidation:
    title: |-
      How liquidations work
    intro: |-
      A position can be liquidated once its health factor falls below 1. Anyone can do it, and automated bots usually do.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Liquidation bonus
        text: |-
          the liquidator repays debt and takes collateral worth more; the lower the health factor, the higher the bonus, up to the spoke's maximum.
      - bold: |-
          How much one call takes
        text: |-
          enough debt to bring the health factor back to the spoke's target, or all of it when under $1,000 would remain.
      - bold: |-
          One pair
        text: |-
          each liquidation repays one debt reserve and takes one collateral reserve, only from supplies enabled as collateral.
      - bold: |-
          After it
        text: |-
          collateral counts only up to its collateral factor, so taking it lowers the cover less than clearing the debt raises it.
      - bold: |-
          One spoke
        text: |-
          a liquidation touches only this spoke's collateral and debt; positions on other spokes are unaffected.
    links:
      - label: |-
          Liquidations in Aave V4
        doc: LIQUIDATIONS
      - label: |-
          The $1,000 rule
        doc: LIQ_DEBT
      - label: |-
          Collateral and bonus
        doc: LIQ_COLLATERAL
      - label: |-
          Health factor
        doc: HF

  fallback:
    title: |-
      How Aave V4 positions work
    intro: |-
      Aave V4 lets a wallet supply assets and borrow against them inside a spoke, where one health factor covers the whole position.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Supply and collateral
        text: |-
          supplied assets earn interest and, when enabled as collateral, back borrowing.
      - bold: |-
          Health factor
        text: |-
          the collateral counted at its collateral factors divided by the debt; below 1 the position can be liquidated.
      - bold: |-
          Hub and spoke
        text: |-
          hubs hold the pooled tokens; each spoke is a separate market with a separate health factor.
    links:
      - label: |-
          Aave V4 positions
        doc: POSITIONS
      - label: |-
          Health factor
        doc: HF
      - label: |-
          Liquidity model
        doc: LIQUIDITY_MODEL

  # The position card's "?": the spoke's modal. The loader passes the spoke's
  # form (its slug), and `liquidated` for a position liquidators touched.
  position:
    title: |-
      How Aave V4 spokes work
    intro: |-
      Aave V4 splits lending in two: a hub holds the pooled tokens and sets their rates, and a spoke is where a position lives.
    intro_main: |-
      Main is Aave V4's general-purpose spoke on the Core hub: its collateral and the tokens it lends both sit in Core.
    intro_bluechip: |-
      Bluechip keeps its collateral, WETH, wstETH, WBTC and cbBTC, in the Prime hub. It borrows from Prime, and from the Core hub over a credit line.
    intro_forex: |-
      Forex takes USDC, USDT or EURC as collateral and lends the Core hub's stablecoins. Currencies that move together let collateral back more debt than on Main.
    intro_gold: |-
      Gold takes XAUt, Tether Gold, as collateral against the Core hub's stablecoins. Its settings are the most conservative of the launch spokes.
    intro_ethena_correlated: |-
      Ethena Correlated takes USDe, sUSDe and their Pendle principal tokens as collateral and lends only USDe, all on the Plus hub.
    intro_ethena_ecosystem: |-
      Ethena Ecosystem takes the same Ethena collateral and borrows USDe, USDC, USDT and GHO from the Plus hub. It borrows stablecoins from the Core hub too, over a capped credit line.
    intro_etherfi: |-
      EtherFi takes weETH as collateral and lends only WETH, on the Core hub: one collateral and one borrowable asset.
    intro_kelp: |-
      Kelp takes rsETH as collateral against WETH on the Core hub. Governance has frozen both reserves, so it takes no new supply or borrowing.
    intro_lido: |-
      Lido takes wstETH as collateral and lends only WETH, on the Core hub.
    intro_lombard: |-
      Lombard BTC takes LBTC, Lombard's staked BTC, as collateral and lends WBTC and cbBTC from the Core hub.
    intro_stablecoin_correlated: |-
      Stablecoin Correlated sits on the Global Dollar hub. It takes a Pendle principal token on USDG as collateral, borrows stablecoins there, and borrows USDG from Core.
    intro_mag7: |-
      Mag7 is Aave V4's one market on Base. Seven Coinbase tokenized stocks are its collateral, and USDC from the Equities hub is the one asset it lends.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Hub and spoke
        text: |-
          a hub holds pooled tokens and sets rates; a spoke has a separate collateral list, risk settings and health factor, drawing from hubs within limits.
      - bold: |-
          Collateral factor
        text: |-
          each collateral counts at a share of its value set by the spoke; the event cards' collateral ratio times this factor is the health factor.
      - bold: |-
          Health factor
        text: |-
          the counted collateral divided by the debt; a borrow or withdrawal must leave it at or above 1, and below 1 liquidation starts.
        text_liquidated: |-
          below 1 a liquidator repays one debt reserve and takes one collateral reserve, only from supplies enabled as collateral.
      - bold: |-
          Risk premium
        text: |-
          the borrow rate is the hub's base rate plus a premium set per position from its collateral's risk.
        text_bluechip: |-
          every Bluechip collateral carries a collateral risk of 0%, so its borrowers pay the hub's base rate.
        text_lido: |-
          Lido's collateral carries a collateral risk of 0%, so its borrowers pay the hub's base rate with no premium.
      - bold: |-
          This spoke
        text: |-
          each spoke sets its collateral list, factors and limits, so the same assets can count differently on another spoke.
        text_main: |-
          a broad collateral list borrowing from the hub it sits on, with rates that follow how much of Core is lent.
        text_bluechip: |-
          its collateral factors run higher than Main's for the same assets, so the same collateral and debt give a higher health factor here.
        text_forex: |-
          EURC is its non-dollar leg, and its liquidation settings are tuned to the narrow moves between the currencies.
        text_gold: |-
          gold is not a crypto asset, so after a liquidation the spoke restores the health factor further than a crypto spoke does.
        text_ethena_correlated: |-
          lending only USDe against USDe-based collateral earns its tight settings; it has no credit line to Core.
        text_ethena_ecosystem: |-
          the cap on Core's credit line limits how much Core liquidity Ethena strategies can draw, and each hub's solvency stays separate.
        text_etherfi: |-
          one collateral and one borrowable asset keep its factor, bonus, oracle and caps adjustable without touching the wider hub.
        text_kelp: |-
          rsETH counts at 0% for a position on the current terms; positions that took their terms before the change keep 95%.
        text_lido: |-
          a venue for borrowing WETH against staked ETH, kept apart from the rest of the Core hub.
        text_lombard: |-
          the spoke keeps Babylon staking exposure inside its limits, apart from the hub's wider collateral.
        text_stablecoin_correlated: |-
          the principal token is priced by a discount-rate oracle that rises to par at maturity; later maturities join the same spoke.
        text_mag7: |-
          stock prices are Chainlink feeds that publish from Sunday 20:00 to Friday 20:00 ET and hold their last value otherwise.
    links:
      - label: |-
          Hubs and spokes
        doc: LIQUIDITY_MODEL
      - label: |-
          Health factor
        doc: HF
      - label: |-
          Risk premium
        doc: RISK_PREMIUM
      - label: |-
          Collateral factors held
        doc: DYNAMIC_CONFIG

  # The Ethereum hubs page's "?".
  hubs:
    title: |-
      How hubs and spokes work
    intro: |-
      Aave V4 splits lending into hubs, the shared pools that hold supplied assets and set rates, and spokes, the markets people use. A spoke draws from a hub over a credit line.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Liquidity hub
        text: |-
          the pool that holds supplied assets and backs borrowing; Core, Plus, Prime and Global Dollar keep their liquidity apart.
      - bold: |-
          Spoke
        text: |-
          a market drawing from one hub or more; Bluechip keeps its collateral in Prime and borrows from Prime and Core.
      - bold: |-
          Credit line and utilisation
        text: |-
          the cap a hub grants a spoke to draw an asset; utilisation is how much of that line is drawn.
      - bold: |-
          Liquidation threshold (LT)
        text: |-
          the share of an asset's value that counts as collateral on a spoke, shown as a range where spokes set it differently.
    links:
      - label: |-
          Liquidity model
        doc: LIQUIDITY_MODEL
      - label: |-
          Liquidity hubs
        doc: HUBS
      - label: |-
          Spokes
        doc: SPOKES
      - label: |-
          Caps per hub and spoke
        doc: HUB_SPOKE_CONFIGS

  # The Base hub page's "?".
  base_hub:
    title: |-
      How the Equities hub works
    intro: |-
      Aave V4 on Base has one hub, Equities, holding one USDC reserve, and one spoke, Mag7. Seven Coinbase tokenized stocks back USDC borrowing there and cannot be borrowed.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Collateral factor
        text: |-
          the share of a stock's value that counts toward the health factor; below a health factor of 1 the position can be liquidated.
      - bold: |-
          Supply cap and credit line
        text: |-
          the hub caps how much of each asset the spoke may add, and how much USDC it may draw, in whole tokens.
      - bold: |-
          Stock prices
        text: |-
          Chainlink feeds publish from Sunday 20:00 to Friday 20:00 ET and hold their last value otherwise, so a weekend price can be days old.
      - bold: |-
          Paused reserve
        text: |-
          a split or similar corporate action pauses the stock's reserve until the token's multiplier is updated; dividends are reinvested into the token.
      - bold: |-
          Registry pause
        text: |-
          Coinbase can pause a stock at its token registry, holding its price; the spoke does not read that flag and stays open.
    links:
      - label: |-
          Caps and credit lines
        doc: HUB_SPOKE_CONFIGS
      - label: |-
          Health factor
        doc: HF
      - label: |-
          Reserve settings and pauses
        doc: RESERVE_DATA
