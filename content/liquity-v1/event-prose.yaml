# ── The "?" modals (zone Z4): the event modals, the position card's and the
# Lifetime flows panel's. Each stops at the mechanism and hands it to a Quick
# Link; no figure of one Trove appears here. ──
L5:
  open:
    title: |-
      How Opening a Trove Works
    intro: |-
      A Liquity V1 Trove holds ETH as collateral and mints LUSD, a dollar stablecoin, against it. The loan charges no interest.
    stepsHeading: |-
      Opening a Trove:
    steps:
      - |-
        The owner deposits ETH and chooses how much LUSD to receive.
      - |-
        The debt is the LUSD received, a one-time borrowing fee and the 200 LUSD liquidation reserve.
      - |-
        The debt must be at least 2,000 LUSD, and the collateral ratio at least 110%.
      - |-
        In Recovery Mode a new Trove needs a collateral ratio of 150% or more.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Borrowing fee
        text: |-
          a one-time charge on each draw, from 0.5% to 5% of the LUSD drawn, and zero in Recovery Mode.
      - bold: |-
          Liquidation reserve
        text: |-
          200 LUSD added to the debt to pay a liquidator's gas; the owner does not repay it on closing.
      - bold: |-
          Collateral ratio
        text: |-
          the dollar value of the ETH divided by the LUSD debt.
    links:
      - label: |-
          How can I borrow with Liquity?
        doc: BORROW_HOW
      - label: |-
          Do I have to pay fees as a borrower?
        doc: FEES
      - label: |-
          What is the Liquidation Reserve?
        doc: RESERVE
      - label: |-
          What is Recovery Mode?
        doc: RECOVERY_MODE

  adjust:
    title: |-
      How Adjusting a Trove Works
    intro: |-
      An adjustment adds or withdraws ETH, borrows more LUSD or repays some of the debt, without closing the Trove.
    stepsHeading: |-
      Limits:
    steps:
      - |-
        Adding ETH or repaying raises the collateral ratio and is allowed at any time.
      - |-
        Withdrawing or borrowing lowers the ratio, which must stay at 110% or more.
      - |-
        A repayment must leave at least 2,000 LUSD of debt; to go lower, the owner closes the Trove.
      - |-
        In Recovery Mode no ETH can be withdrawn, and new debt needs a ratio of 150% or more.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Borrowing fee
        text: |-
          a one-time charge on each draw, from 0.5% to 5% of the LUSD drawn, and zero in Recovery Mode.
      - bold: |-
          Recovery Mode
        text: |-
          the state the system enters when the total collateral ratio of all Troves falls below 150%.
    links:
      - label: |-
          What is the collateral ratio?
        doc: COLLATERAL_RATIO
      - label: |-
          How is the borrowing fee calculated?
        doc: FEE_CALC
      - label: |-
          What is Recovery Mode?
        doc: RECOVERY_MODE

  close:
    title: |-
      How Closing a Trove Works
    intro: |-
      Closing repays the Trove's debt and returns all its ETH to the owner in one transaction.
    stepsHeading: |-
      Limits:
    steps:
      - |-
        The owner repays the debt less the 200 LUSD liquidation reserve.
      - |-
        A Trove cannot close while the system is in Recovery Mode.
      - |-
        The same address can then open a new Trove.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Liquidation reserve
        text: |-
          200 LUSD added to the debt to pay a liquidator's gas; the owner does not repay it on closing.
      - bold: |-
          Recovery Mode
        text: |-
          the state the system enters when the total collateral ratio of all Troves falls below 150%.
    links:
      - label: |-
          What is a Trove?
        doc: TROVE
      - label: |-
          What is the Liquidation Reserve?
        doc: RESERVE
      - label: |-
          What is Recovery Mode?
        doc: RECOVERY_MODE

  redemption:
    title: |-
      How Redemptions Work
    intro: |-
      Anyone holding LUSD can swap it for ETH at $1 per LUSD, at the protocol's ETH price. This holds LUSD near a dollar.
    stepsHeading: |-
      What happens to a redeemed Trove:
    steps:
      - |-
        Redemptions start with the Troves at the lowest collateral ratios, whatever their level.
      - |-
        The LUSD cancels debt, and ETH worth the same amount leaves the Trove to the redeemer.
      - |-
        The collateral ratio rises, because both sides fall by the same dollar amount.
      - |-
        A redemption that clears the whole debt closes the Trove, and the owner claims the ETH left.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Redemption fee
        text: |-
          paid by the redeemer out of the ETH received: 0.5% plus a base rate that rises with recent redemptions.
      - bold: |-
          Net outcome
        text: |-
          at the redemption price the owner neither gains nor loses, and gives up exposure to the ETH taken.
    links:
      - label: |-
          What are redemptions?
        doc: REDEMPTIONS
      - label: |-
          What happens if my Trove is redeemed against?
        doc: REDEEMED_AGAINST
      - label: |-
          Do I lose money if I'm redeemed against?
        doc: REDEMPTION_LOSS
      - label: |-
          How can I avoid being redeemed against?
        doc: REDEMPTION_AVOID

  liquidation:
    title: |-
      How Liquidation Works
    intro: |-
      Anyone can liquidate a Trove whose collateral ratio is below 110%. The whole Trove closes, and the owner keeps the LUSD borrowed but loses the ETH.
    stepsHeading: |-
      Where the debt and the ETH go:
    steps:
      - |-
        The Stability Pool's LUSD pays off the debt, and its depositors receive the ETH.
      - |-
        If the pool holds too little LUSD, the rest passes to the other Troves by their collateral.
      - |-
        The liquidator receives the 200 LUSD reserve and 0.5% of the Trove's ETH.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Stability Pool
        text: |-
          a pool of LUSD deposited by anyone, which pays off liquidated debt in exchange for the ETH.
      - bold: |-
          Recovery Mode
        text: |-
          while the total collateral ratio of all Troves is below 150%, a Trove below that total can also be liquidated.
      - bold: |-
          Capped loss
        text: |-
          in Recovery Mode the loss stops at ETH worth 110% of the debt, and the owner can claim the rest.
    links:
      - label: |-
          What are liquidations?
        doc: LIQUIDATIONS
      - label: |-
          Who can liquidate Troves?
        doc: LIQUIDATOR
      - label: |-
          What if the Stability Pool is empty?
        doc: SP_EMPTY
      - label: |-
          How do liquidations work in Recovery Mode?
        doc: RECOVERY_LIQUIDATIONS

  fallback:
    title: |-
      How Liquity V1 Troves Work
    intro: |-
      Liquity V1 lends LUSD against ETH with no interest. Each address holds one Trove at a time.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Collateral ratio
        text: |-
          the ETH's dollar value divided by the LUSD debt; below 110% the Trove can be liquidated.
      - bold: |-
          Redemptions
        text: |-
          LUSD holders swap LUSD for ETH at $1, starting with the lowest-ratio Troves.
      - bold: |-
          Liquidation reserve
        text: |-
          200 LUSD added to the debt to pay a liquidator's gas; the owner does not repay it on closing.
      - bold: |-
          Recovery Mode
        text: |-
          the state the system enters when the total collateral ratio of all Troves falls below 150%.
    links:
      - label: |-
          What is Liquity?
        doc: WHAT_IS_LIQUITY
      - label: |-
          What is a Trove?
        doc: TROVE
      - label: |-
          What are redemptions?
        doc: REDEMPTIONS
      - label: |-
          What are liquidations?
        doc: LIQUIDATIONS

  position_open:
    title: |-
      About This Position
    intro: |-
      The card states what backs the LUSD debt now, and how close the Trove is to redemption and to liquidation.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Collateral ratio
        text: |-
          the ETH's dollar value at the protocol's price divided by the LUSD debt, which must stay at 110% or more.
      - bold: |-
          No interest
        text: |-
          the debt changes only when the owner borrows or repays, or a redemption or liquidation reaches the Trove.
      - bold: |-
          Redemption queue
        text: |-
          LUSD holders redeem against the lowest-ratio Troves first, so the debt ahead of a Trove goes before it.
      - bold: |-
          Redistribution
        text: |-
          when the Stability Pool runs short, a liquidated Trove's debt and ETH pass to the other Troves by their collateral.
      - bold: |-
          Recovery Mode
        text: |-
          while the total collateral ratio of all Troves is below 150%, a Trove below that total can be liquidated above 110%.
    links:
      - label: |-
          What is the collateral ratio?
        doc: COLLATERAL_RATIO
      - label: |-
          How can I avoid being redeemed against?
        doc: REDEMPTION_AVOID
      - label: |-
          Why did my Trove's collateral and debt increase?
        doc: REDISTRIBUTION
      - label: |-
          What is Recovery Mode?
        doc: RECOVERY_MODE

  position_closed:
    title: |-
      About This Position
    intro: |-
      The owner closed this Trove: they repaid its debt and took back all its ETH. The card shows the most ETH and debt it held.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Closing
        text: |-
          the owner repays the debt less the 200 LUSD liquidation reserve and receives all the ETH.
      - bold: |-
          Full redemption
        text: |-
          when redemptions clear the whole debt, the Trove closes and the owner claims the ETH left.
      - bold: |-
          Liquidation reserve
        text: |-
          200 LUSD added to the debt to pay a liquidator's gas; the owner does not repay it on closing.
    links:
      - label: |-
          What is a Trove?
        doc: TROVE
      - label: |-
          What is the Liquidation Reserve?
        doc: RESERVE
      - label: |-
          What happens if my Trove is redeemed against?
        doc: REDEEMED_AGAINST

  position_redeemed:
    title: |-
      About This Position
    intro: |-
      Redemptions cleared the whole of this Trove's debt, which closed it. The card shows the ETH left for the owner while it is unclaimed.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Full redemption
        text: |-
          when redemptions clear the whole debt, the Trove closes and the owner claims the ETH left.
      - bold: |-
          Surplus pool
        text: |-
          where the ETH a full redemption leaves waits until the owner's wallet claims it.
      - bold: |-
          Liquidation reserve
        text: |-
          200 LUSD added to the debt to pay a liquidator's gas; the owner does not repay it on closing.
    links:
      - label: |-
          What happens if my Trove is redeemed against?
        doc: REDEEMED_AGAINST
      - label: |-
          Do I lose money if I'm redeemed against?
        doc: REDEMPTION_LOSS
      - label: |-
          What is the Liquidation Reserve?
        doc: RESERVE

  position_liquidated:
    title: |-
      About This Position
    intro: |-
      This Trove was liquidated. The card shows the most ETH and LUSD debt it held.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Liquidation
        text: |-
          below 110%, or below the system's total ratio in Recovery Mode, anyone can liquidate the whole Trove.
      - bold: |-
          Stability Pool
        text: |-
          a pool of LUSD deposited by anyone, which pays off liquidated debt in exchange for the ETH.
      - bold: |-
          Redistribution
        text: |-
          when the Stability Pool runs short, a liquidated Trove's debt and ETH pass to the other Troves by their collateral.
      - bold: |-
          Capped loss
        text: |-
          in Recovery Mode the loss stops at ETH worth 110% of the debt, and the owner can claim the rest.
    links:
      - label: |-
          What are liquidations?
        doc: LIQUIDATIONS
      - label: |-
          What if the Stability Pool is empty?
        doc: SP_EMPTY
      - label: |-
          How much collateral can a Recovery Mode liquidation take?
        doc: RECOVERY_CAP

  flows:
    title: |-
      About lifetime flows
    intro: |-
      This panel adds up what moved in and out of the Trove over its life, from each of its events.
    stepsHeading: |-
      How to read it:
    steps:
      - |-
        The collateral bar counts ETH in and out; the solid part is still deposited.
      - |-
        The debt bar counts LUSD borrowed, fees, the reserve and redistributed debt against what left.
      - |-
        Each flow is valued at Liquity's ETH price at its block, and LUSD at $1.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          No interest
        text: |-
          the debt changes only when the owner borrows or repays, or a redemption or liquidation reaches the Trove.
      - bold: |-
          Debt taken on
        text: |-
          each draw adds the LUSD received plus a one-time fee, and opening adds the 200 LUSD reserve.
    links:
      - label: |-
          How is the borrowing fee calculated?
        doc: FEE_CALC
      - label: |-
          What are redemptions?
        doc: REDEMPTIONS
      - label: |-
          What are liquidations?
        doc: LIQUIDATIONS

