# Liquity V1 prose: every string an event's explanation, the position card's
# explanation and the "?" modals print on a Liquity V1 Trove. The page reads
# this file and nothing else; the code chooses which strings to say and fills
# their figures (lib/liquity-v1/event-prose.ts for an event,
# components/protocol/liquity-v1/liquity-v1-position-explanation.tsx for the
# position card).
#
# How to edit
#   Each string sits on the line below its `|-`, indented. Write it as it should
#   read: colons, apostrophes, quotes, percent signs and dashes need no escaping.
#   Keep each string on one line, keep its indentation, and leave the ids (the
#   words before a colon) as they are.
#
# Placeholders
#   {name} is a figure the code fills in, printed at the rounding the
#   `placeholders` section gives it; {name|rounding} prints it at another
#   rounding for that string alone. Keep the braces and the name; move a
#   placeholder anywhere in its string.
#
# Limits
#   Every string here is held to rails-ops standards/prose-limits-and-zones.md:
#   `pnpm check:prose-limits` fails a bullet over 20 words or 2 figures, a modal
#   over 200 words, and the rest of the standard's section 2. `pnpm check:prose`
#   confirms the file parses, every id the code reads is here, and every
#   placeholder is one the code supplies.

# ── Roundings: how a placeholder's figure is printed ──
roundings:
  units4: |-
    up to four places at the card ledger's decimals (2.5, 10.1234)
  units2: |-
    two places, grouped (1,800.00)
  ratio_frac: |-
    a ratio given as a fraction, as a percent at two places (1.4852 → 148.52%)
  pct_whole: |-
    whole percent of a fraction (0.32 → 32%), unsigned
  usd: |-
    whole dollars ($4,490)
  date: |-
    a UTC day (1 Sep 2025)
  span: |-
    a duration as the page writes it (3 months)
  count: |-
    a whole number, grouped (1,204)
  text: |-
    a word or name as given

# ── Placeholders: each name, its default rounding and what it stands for ──
placeholders:
  coll_change:
    rounding: units4
    means: |-
      the ETH the event moved, as the header prints it
  debt_change:
    rounding: units2
    means: |-
      the LUSD debt the event moved, as the header prints it
  received:
    rounding: units2
    means: |-
      the LUSD the owner received on an open or a draw, as the header prints it
  repaid:
    rounding: units2
    means: |-
      the LUSD the owner paid to close the Trove: the debt less the 200 LUSD reserve
  liq_distance_before:
    rounding: pct_whole
    means: |-
      how far ETH could fall before the event, at this block's price, until the Trove reached 110%
  liq_distance_after:
    rounding: pct_whole
    means: |-
      the same after the event
  act:
    rounding: text
    means: |-
      the owner's last act before a liquidation (withdrawal, borrow)
  act_date:
    rounding: date
    means: |-
      the day of that act
  near_ratio:
    rounding: ratio_frac
    means: |-
      the collateral ratio that act left
  event_type:
    rounding: text
    means: |-
      the event's type as the index names it
  # The position card's figures, drawn by the card with their receipts.
  coll:
    rounding: units4
    means: |-
      the ETH the Trove holds now
  debt:
    rounding: units2
    means: |-
      the LUSD the Trove owes now
  coll_usd:
    rounding: usd
    means: |-
      that ETH at Liquity's price feed now
  pending_eth:
    rounding: units4
    means: |-
      ETH passed to the Trove by liquidations and not yet recorded on it
  pending_lusd:
    rounding: units2
    means: |-
      LUSD debt passed to the Trove the same way
  icr:
    rounding: ratio_frac
    means: |-
      the Trove's collateral ratio now
  drop:
    rounding: pct_whole
    means: |-
      how far ETH can fall before the Trove reaches 110%
  capacity:
    rounding: count
    means: |-
      the LUSD the Trove could still borrow before its ratio reaches the limit
  limit:
    rounding: pct_whole
    means: |-
      the borrowing limit: 110%, or 150% in Recovery Mode
  debt_in_front:
    rounding: count
    means: |-
      the LUSD debt redemptions would clear before this Trove
  queue_share:
    rounding: pct_whole
    means: |-
      that debt as a share of all the debt in the queue
  tcr:
    rounding: ratio_frac
    means: |-
      the system's total collateral ratio now
  ccr:
    rounding: pct_whole
    means: |-
      the total ratio below which Recovery Mode starts (150%)
  ended:
    rounding: date
    means: |-
      the day the Trove life ended
  eth_taken:
    rounding: units4
    means: |-
      the ETH redemptions took over the life
  eth_back:
    rounding: units4
    means: |-
      the ETH the owner took back on closing
  surplus:
    rounding: units4
    means: |-
      the ETH a full redemption or a capped liquidation left for the owner
  claimed:
    rounding: date
    means: |-
      the day the owner claimed it
  net_then:
    rounding: usd
    means: |-
      the redemptions' net for the owner at each redemption's price
  net_now:
    rounding: usd
    means: |-
      the same at the latest block's price
  liq_ratio:
    rounding: ratio_frac
    means: |-
      the collateral ratio at the liquidation's price
  kept:
    rounding: units2
    means: |-
      the LUSD received over the life less the LUSD repaid
  eth_lost:
    rounding: units4
    means: |-
      the ETH the liquidation took
  usd_lost:
    rounding: usd
    means: |-
      that ETH at the liquidation's price
  eth_withdrawn:
    rounding: units4
    means: |-
      the ETH the owner withdrew over the life
  eth_redeemed:
    rounding: units4
    means: |-
      the ETH redemptions took over the life
  peak_coll:
    rounding: units4
    means: |-
      the most ETH the life held
  peak_debt:
    rounding: units2
    means: |-
      the most LUSD debt the life owed
  duration:
    rounding: span
    means: |-
      how long the life was active
  opened:
    rounding: date
    means: |-
      the day of the life's first event
  tx_count:
    rounding: count
    means: |-
      the owner's transactions over the life
  tx_word:
    rounding: text
    means: |-
      transaction or transactions
  redemption_count:
    rounding: count
    means: |-
      the redemptions over the life
  redemption_word:
    rounding: text
    means: |-
      redemption or redemptions

# ── The event explanation's group headings, in the order the pane shows them ──
group_words:
  happened: |-
    What happened
  adds_up: |-
    How it adds up
  leaves: |-
    Where it leaves the position

# ── Words the code puts into a sentence ──
words:
  act_withdraw: |-
    withdrawal
  act_borrow: |-
    borrow
  act_both: |-
    withdrawal and borrow
  tx_one: |-
    transaction
  tx_many: |-
    transactions
  redemption_one: |-
    redemption
  redemption_many: |-
    redemptions

# ── The position card's explanation (zone Z1): an unheaded lead, then bullets
# under Holdings, Risk and History when two of them hold two or more bullets
# (Liquity V1 has no rate). Risk holds at most four: the ratio and its runway,
# the room to borrow, the redemption queue, Recovery Mode while it is on.
# Read by positionWords / positionNodes (lib/liquity-v1/event-templates.ts). ──
position_words:
  heading_holdings: |-
    Holdings
  heading_risk: |-
    Risk
  heading_history: |-
    History
  # ── An open Trove ──
  lead_debt: |-
    The Trove holds {coll} ETH of collateral against {debt} LUSD of debt:
  lead_no_debt: |-
    The Trove holds {coll} ETH of collateral and owes nothing:
  coll_worth: |-
    That collateral is worth {coll_usd} at Liquity's price feed now.
  debt_parts: |-
    The debt includes the 200 LUSD liquidation reserve and the one-time borrowing fees.
  pending: |-
    Liquidations have passed this Trove {pending_eth} ETH and {pending_lusd} LUSD, added at its next transaction.
  no_debt: |-
    With no debt, the Trove cannot be liquidated or redeemed against.
  coll_ratio: |-
    The collateral ratio is {icr}, against the 110% minimum.
  ratio_drop: |-
    At a collateral ratio of {icr}, ETH can fall about {drop} before the Trove can be liquidated.
  capacity: |-
    About {capacity} LUSD more could be borrowed before the ratio falls to {limit}.
  queue: |-
    {debt_in_front} LUSD of debt would be redeemed before this Trove, {queue_share} of all the debt.
  queue_no_share: |-
    {debt_in_front} LUSD of debt would be redeemed before this Trove.
  recovery_on: |-
    The system is in Recovery Mode: its total collateral ratio is {tcr}, below {ccr}.
  # ── A life the index still has open and the chain has closed ──
  superseded_owner: |-
    The chain shows this Trove closed by its owner:
  superseded_redeemed: |-
    The chain shows this Trove fully redeemed:
  superseded_liquidated: |-
    The chain shows this Trove liquidated:
  superseded_none: |-
    The chain has no record of this Trove at the current head:
  superseded_lag: |-
    The history here ends before that event, so the figures show the Trove as last recorded.
  superseded_joins: |-
    The closing event joins the timeline once it is recorded.
  # ── A closed or liquidated life ──
  closed_lead_liquidated: |-
    This Trove life ended in liquidation on {ended}:
  closed_lead_liquidated_undated: |-
    This Trove life ended in liquidation:
  closed_lead_redeemed: |-
    This Trove life ended fully redeemed on {ended}:
  closed_lead_redeemed_undated: |-
    This Trove life ended fully redeemed:
  closed_lead_owner: |-
    The owner closed this Trove life on {ended}:
  closed_lead_owner_undated: |-
    The owner closed this Trove life:
  redemptions_took: |-
    Redemptions took {eth_taken} ETH over this life.
  redemption_took: |-
    A redemption took {eth_taken} ETH.
  owner_took_back: |-
    The owner took back {eth_back} ETH.
  owner_took_back_rest: |-
    The owner took back the remaining {eth_back} ETH.
  surplus_waiting: |-
    {surplus} ETH went to the surplus pool, where it waits for the owner to claim it.
  surplus_claimed_on: |-
    {surplus} ETH went to the surplus pool, and the owner claimed it on {claimed}.
  surplus_claimed: |-
    {surplus} ETH went to the surplus pool, and the owner claimed it.
  surplus_left: |-
    {surplus} ETH went to the surplus pool for the owner.
  net_both: |-
    The redemptions netted the owner {net_then} at their prices, and {net_now} against holding the ETH.
  net_both_one: |-
    The redemption netted the owner {net_then} at its price, and {net_now} against holding the ETH.
  net_then: |-
    The redemptions netted the owner {net_then} at their prices.
  net_then_one: |-
    The redemption netted the owner {net_then} at its price.
  liq_ratio_below: |-
    Its collateral ratio was {liq_ratio} at liquidation, below the 110% minimum.
  liq_ratio_recovery: |-
    Its collateral ratio was {liq_ratio} at liquidation; only Recovery Mode allowed it.
  kept_net: |-
    The owner kept {kept} LUSD: what it received less what it repaid.
  kept_all: |-
    The owner kept the {kept} LUSD received over the Trove's life.
  kept_none: |-
    The owner received and repaid {kept} LUSD over the Trove's life.
  lost: |-
    The liquidation took {eth_lost} ETH, worth {usd_lost} at the liquidation price.
  withdrew_redeemed: |-
    Over the life the owner withdrew {eth_withdrawn} ETH and redemptions took {eth_redeemed} ETH.
  withdrew: |-
    Over the life the owner withdrew {eth_withdrawn} ETH.
  peaks: |-
    At its height it held {peak_coll} ETH against {peak_debt} LUSD of debt.
  active: |-
    It was active for {duration} from {opened}.
  counts_both: |-
    It recorded {tx_count} owner {tx_word} and {redemption_count} {redemption_word}.
  counts_owner: |-
    It recorded {tx_count} owner {tx_word}.
  counts_redeemed: |-
    It recorded {redemption_count} {redemption_word} and no owner transactions.

# ── Sentences more than one template says ──
shared_sentences:
  draw.no_fee:
    when: |-
      the draw's borrowing fee was zero, which happens only in Recovery Mode
    text: |-
      No borrowing fee was charged because the system was in Recovery Mode.
  liq.after:
    when: |-
      the Trove has debt and a price at this block, and ETH can fall before it reaches 110%
    text: |-
      ETH would need to fall {liq_distance_after} from this block's price for the Trove to reach liquidation.
  liq.safer:
    when: |-
      the event raised the room above 110%
    text: |-
      The Trove is safer: ETH would now need to fall {liq_distance_after} to reach liquidation, against {liq_distance_before} before.
  liq.less_safe:
    when: |-
      the event lowered the room above 110%
    text: |-
      The Trove is less safe: ETH would now need to fall {liq_distance_after} to reach liquidation, against {liq_distance_before} before.

# ── Templates: one per kind of event ──
#   id          the template's id
#   title       the event's label in the template list
#   when        the event and state that select it
#   L5          the modal it opens (see L5 below)
#   variants    each variant's id and when it applies
#   sentences   its sentences, each with `when` and `text`
#   order       the order the explanation says them in, shared sentences included
#   groups      which group (group_words) each sentence of order sits in
#   alternates  lists of sentences the code says at most one of
# A figure the card's cells, notes or price row show stays out of a sentence
# unless the sentence says what it means (rails-ops
# standards/prose-limits-and-zones.md).
templates:
  - id: liquity1.open
    title: |-
      Open
    when: |-
      openTrove
    L5: open
    variants:
      default: |-
        always
    sentences:
      open.what:
        when: |-
          the row does not carry the LUSD the owner received
        text: |-
          The owner opened the Trove with {coll_change} ETH of collateral and {debt_change} LUSD of debt.
      open.what_received:
        when: |-
          the row carries the LUSD the owner received
        text: |-
          The owner opened the Trove with {coll_change} ETH of collateral and received {received} LUSD.
    order:
      - open.what
      - open.what_received
      - draw.no_fee
      - liq.after
    groups:
      happened: [open.what, open.what_received]
      adds_up: [draw.no_fee]
      leaves: [liq.after]
    alternates:
      - [open.what, open.what_received]

  - id: liquity1.adjust
    title: |-
      Adjust
    when: |-
      adjustTrove: the owner added or withdrew ETH, borrowed or repaid, or both
    L5: adjust
    variants:
      add: |-
        added ETH only
      withdraw: |-
        withdrew ETH only
      borrow: |-
        borrowed only
      repay: |-
        repaid only
      add_borrow: |-
        added ETH and borrowed
      add_repay: |-
        added ETH and repaid
      withdraw_borrow: |-
        withdrew ETH and borrowed
      withdraw_repay: |-
        withdrew ETH and repaid
    sentences:
      add.what:
        when: |-
          add, add_borrow, add_repay
        text: |-
          The owner added {coll_change} ETH of collateral.
      withdraw.what:
        when: |-
          withdraw, withdraw_borrow, withdraw_repay
        text: |-
          The owner withdrew {coll_change} ETH of collateral.
      borrow.what:
        when: |-
          borrow, add_borrow, withdraw_borrow, where the row does not carry the LUSD received
        text: |-
          The owner borrowed more, raising the debt by {debt_change} LUSD.
      borrow.what_received:
        when: |-
          borrow, add_borrow, withdraw_borrow, where the row carries the LUSD received
        text: |-
          The owner borrowed {received} LUSD more.
      repay.what:
        when: |-
          repay, add_repay, withdraw_repay
        text: |-
          The owner repaid {debt_change} LUSD of debt.
    order:
      - add.what
      - withdraw.what
      - borrow.what
      - borrow.what_received
      - repay.what
      - draw.no_fee
      - liq.safer
      - liq.less_safe
    groups:
      happened: [add.what, withdraw.what, borrow.what, borrow.what_received, repay.what]
      adds_up: [draw.no_fee]
      leaves: [liq.safer, liq.less_safe]
    alternates:
      - [add.what, withdraw.what]
      - [borrow.what, borrow.what_received, repay.what]
      - [liq.safer, liq.less_safe]

  - id: liquity1.close
    title: |-
      Close
    when: |-
      closeTrove
    L5: close
    variants:
      default: |-
        always
    sentences:
      close.what:
        when: |-
          always
        text: |-
          The owner closed the Trove, repaying {repaid} LUSD and taking back {coll_change} ETH.
    order:
      - close.what
    groups:
      happened: [close.what]

  - id: liquity1.redemption
    title: |-
      Redemption
    when: |-
      redemption
    L5: redemption
    variants:
      partial: |-
        the Trove kept some debt
      full: |-
        the redemption cleared the whole debt and closed the Trove
    sentences:
      redeem.what:
        when: |-
          partial
        text: |-
          An LUSD holder redeemed {debt_change} LUSD against this Trove for {coll_change} ETH.
      redeem.what_full:
        when: |-
          full
        text: |-
          An LUSD holder's redemption cleared the Trove's whole {debt_change} LUSD debt and closed it.
      redeem.why:
        when: |-
          always
        text: |-
          This Trove's collateral ratio was among the lowest at the time, so the redemption reached it.
    order:
      - redeem.what
      - redeem.what_full
      - redeem.why
      - liq.safer
    groups:
      happened: [redeem.what, redeem.what_full, redeem.why]
      leaves: [liq.safer]
    alternates:
      - [redeem.what, redeem.what_full]

  - id: liquity1.liquidation
    title: |-
      Liquidation
    when: |-
      liquidation
    L5: liquidation
    variants:
      below_min: |-
        the ratio at the liquidation's price was below 110%
      recovery: |-
        the ratio was 110% or more, so Recovery Mode allowed it
      unpriced: |-
        the row carries no price yet
    sentences:
      liq.what:
        when: |-
          always
        text: |-
          The Trove was liquidated, losing {coll_change} ETH of collateral and clearing {debt_change} LUSD of debt.
      liq.why_below:
        when: |-
          below_min
        text: |-
          Its collateral ratio was below the 110% minimum, so anyone could liquidate it.
      liq.why_recovery:
        when: |-
          recovery
        text: |-
          Its collateral ratio was above 110%, so only Recovery Mode made the liquidation possible.
      liq.near_line:
        when: |-
          the owner's last withdrawal or borrow took the ratio near the line
        text: |-
          The owner's {act} on {act_date} had left the collateral ratio at {near_ratio}.
    order:
      - liq.what
      - liq.why_below
      - liq.why_recovery
      - liq.near_line
    groups:
      happened: [liq.what, liq.why_below, liq.why_recovery, liq.near_line]
    alternates:
      - [liq.why_below, liq.why_recovery]

  - id: liquity1.fallback
    title: |-
      Event
    when: |-
      an event type the generator does not know
    L5: fallback
    variants:
      default: |-
        always
    sentences:
      fallback.what:
        when: |-
          always
        text: |-
          The Trove recorded a {event_type} event.
    order:
      - fallback.what
    groups:
      happened: [fallback.what]

