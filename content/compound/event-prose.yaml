# ── The "?" modals (zone Z4): the event modals and the position card's. Each
# stops at the mechanism and hands it to a Quick Link; no figure of one
# position appears here. ──
L5:
  supply:
    title: |-
      How Supplying the Base Asset Works
    intro: |-
      Each Compound V3 market lends and borrows one base asset. Supplying base repays any debt first, then lends the rest to earn the supply rate.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One signed balance
        text: |-
          positive base is lending and negative base is borrowing, so supply and repay are one operation, as are withdraw and borrow.
      - bold: |-
          Interest accrues in place
        text: |-
          the balance grows or deepens every second at the market's rate, which moves with how much of the pool is borrowed.
      - bold: |-
          Earning vs collateral
        text: |-
          lent base earns interest but does not back borrowing; only the separate collateral stack does.
      - bold: |-
          Who may act
        text: |-
          anyone may supply to any account, but taking value out needs the owner to name a manager, with no amount limit.
    links:
      - label: |-
          Supply
        doc: SUPPLY
      - label: |-
          Interest rates
        doc: INTEREST_RATES
      - label: |-
          Account management
        doc: ALLOW

  withdraw:
    title: |-
      How Withdrawing and Borrowing Work
    intro: |-
      Withdrawing base spends the account's lent balance first, and anything past zero is a borrow. Compound V3 has no separate borrow call.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One signed balance
        text: |-
          positive base is lending and negative base is borrowing, so withdraw and borrow are one operation, as are supply and repay.
      - bold: |-
          Backed by collateral
        text: |-
          a borrow must stay under the account's borrow capacity, where each collateral asset counts up to its borrow factor.
      - bold: |-
          Interest accrues in place
        text: |-
          the debt deepens every second at the market's borrow rate, which moves with how much of the pool is borrowed.
      - bold: |-
          Who may act
        text: |-
          only the owner or a named manager can withdraw or borrow; a manager can act on every asset with no amount limit.
    links:
      - label: |-
          Withdraw or borrow
        doc: BORROW
      - label: |-
          Borrow collateralization
        doc: BORROW_COLLATERALIZATION
      - label: |-
          Interest rates
        doc: INTEREST_RATES

  collateral_in:
    title: |-
      How Collateral Works
    intro: |-
      Compound V3 collateral is a separate stack from the base balance. It earns nothing and backs the account's base borrowing.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Borrow factor
        text: |-
          the share of a collateral asset's value that can be borrowed against.
      - bold: |-
          Liquidate factor
        text: |-
          a higher share that counts toward the liquidation line; the gap to the borrow factor is the safety margin.
      - bold: |-
          Liquidation factor
        text: |-
          the share of its value the account is credited at if it is absorbed; the protocol keeps the rest.
      - bold: |-
          Non-earning
        text: |-
          collateral earns no interest, so its amount changes only when the account moves it or an absorb takes it.
      - bold: |-
          Who may act
        text: |-
          anyone may add collateral to any account, but withdrawing it needs the owner or a named manager.
    links:
      - label: |-
          Collateral and borrowing
        doc: COLLATERAL_BORROWING
      - label: |-
          Liquidation
        doc: LIQUIDATION
      - label: |-
          Liquidation factor
        doc: LIQUIDATION_FACTOR

  collateral_out:
    title: |-
      How Withdrawing Collateral Works
    intro: |-
      Withdrawing collateral shrinks the stack backing the account's borrowing. The market blocks a withdrawal that would leave debt over the account's borrow capacity.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Borrow factor
        text: |-
          the share of a collateral asset's value that can be borrowed against.
      - bold: |-
          Liquidate factor
        text: |-
          a higher share that counts toward the liquidation line; the gap to the borrow factor is the safety margin.
      - bold: |-
          Deprecated assets
        text: |-
          governance retires an asset by setting its borrow factor to 0: it still counts toward the liquidation line but backs no new borrowing.
      - bold: |-
          Who may act
        text: |-
          only the owner or a named manager can withdraw collateral; a manager can act on every asset with no amount limit.
    links:
      - label: |-
          Withdraw or borrow
        doc: BORROW
      - label: |-
          Collateral and borrowing
        doc: COLLATERAL_BORROWING
      - label: |-
          Account management
        doc: ALLOW

  absorb:
    title: |-
      How Absorb (Liquidation) Works
    intro: |-
      Compound V3 calls its liquidation an absorb. Once an account's debt passes its liquidation line, anyone may trigger it and the protocol takes over the whole account.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Liquidation line
        text: |-
          each collateral asset's value times its liquidate factor, added up; debt above it makes the account absorbable.
      - bold: |-
          One step
        text: |-
          the protocol takes all the account's collateral and clears its whole debt; nobody repays part of it.
      - bold: |-
          Credit
        text: |-
          each asset is credited at its liquidation factor, a share of its value; the credit clears the debt and any excess stays lent.
      - bold: |-
          The protocol's share
        text: |-
          the uncredited value stays with the protocol, which sells the seized collateral at a discount while its reserves are below target.
      - bold: |-
          Factors at the block
        text: |-
          the factors shown are those in force just before the absorb; governance can change them later.
    links:
      - label: |-
          Absorb
        doc: ABSORB
      - label: |-
          Liquidatable accounts
        doc: LIQUIDATABLE
      - label: |-
          Buy collateral
        doc: BUY_COLLATERAL
      - label: |-
          Reserves
        doc: RESERVES

  transfer_base:
    title: |-
      How Position Transfers Work
    intro: |-
      A Compound V3 base position is an ERC-20 balance, so it can move to another account directly. The signed balance changes hands without a supply or a withdraw.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Not a deposit or withdrawal
        text: |-
          a transfer changes custody, so this explorer counts it apart from deposited and withdrawn.
      - bold: |-
          Two accounts, one move
        text: |-
          the same transfer shows as an out-leg on the sender and an in-leg on the recipient.
      - bold: |-
          Base is fungible
        text: |-
          positive base is a lending position; transferring it hands the lent balance, and the interest it earns, to the recipient.
    links:
      - label: |-
          Transfer
        doc: TRANSFER
      - label: |-
          Account management
        doc: ACCOUNT_MANAGEMENT

  transfer_collateral:
    title: |-
      How Collateral Transfers Work
    intro: |-
      Compound V3 lets an account move collateral to another account in the same market, without withdrawing to a wallet and supplying it again.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Not a deposit or withdrawal
        text: |-
          a transfer changes custody, so this explorer counts it apart from deposited and withdrawn.
      - bold: |-
          Two accounts, one move
        text: |-
          the same transfer shows as an out-leg on the sender and an in-leg on the recipient.
      - bold: |-
          Health still enforced
        text: |-
          the transfer fails if it would make the sender's account liquidatable.
    links:
      - label: |-
          Transfer
        doc: TRANSFER
      - label: |-
          Collateral and borrowing
        doc: COLLATERAL_BORROWING

  fallback:
    title: |-
      How Compound V3 Positions Work
    intro: |-
      Compound V3 runs one market per base asset, each a contract Compound calls a Comet. A position is a signed base balance plus a separate stack of non-earning collateral.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Signed base
        text: |-
          supply and repay are one operation, pushing the balance up; withdraw and borrow are one, pulling it down past zero.
      - bold: |-
          Collateral factors
        text: |-
          each asset backs borrowing up to its borrow factor and counts toward the liquidation line up to its higher liquidate factor.
      - bold: |-
          Absorb liquidation
        text: |-
          past the liquidation line the protocol takes the collateral, clears the whole debt and credits each asset at its liquidation factor.
    links:
      - label: |-
          Compound III documentation
        doc: OVERVIEW
      - label: |-
          Liquidation
        doc: LIQUIDATION

  # ── The position card's "?" (an open position, by what it does now; a
  # closed one; an absorbed one). On Base the text_base forms apply. ──
  position_borrowing:
    title: |-
      About This Position
    intro: |-
      This panel explains the position in plain words: the base balance, the collateral behind its borrowing, and what would trigger an absorb.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One signed base balance
        text: |-
          positive base is lending and negative base is borrowing, so supply and repay are one operation, as are withdraw and borrow.
      - bold: |-
          Borrowing capacity
        text: |-
          each collateral asset adds capacity up to its borrow factor, while the liquidation line uses its higher liquidate factor.
      - bold: |-
          Absorb
        text: |-
          past the liquidation line the protocol takes the collateral, clears the whole debt and credits each asset at its liquidation factor.
      - bold: |-
          Who may act
        text: |-
          anyone may supply or repay for the account; taking value out or borrowing needs the owner or a named manager.
      - bold: |-
          One market per base asset
        text: |-
          each market, a contract Compound calls a Comet, lends and borrows one base asset; this card's is one of several, and they share nothing.
        text_base: |-
          Compound V3 on Base runs separate markets from Ethereum's; a position on one says nothing about the other.
    links:
      - label: |-
          Collateral and borrowing
        doc: COLLATERAL_BORROWING
      - label: |-
          Liquidation
        doc: LIQUIDATION
      - label: |-
          Account management
        doc: ACCOUNT_MANAGEMENT

  position_lending:
    title: |-
      About This Position
    intro: |-
      This panel explains the position in plain words: the base balance it holds, any collateral posted beside it, and what would trigger an absorb.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One signed base balance
        text: |-
          positive base is lending and earns the supply rate, negative base is borrowing, and supply and repay are one operation.
      - bold: |-
          Collateral stays separate
        text: |-
          collateral is a non-earning stack backing only this market's borrowing, with each asset counted up to its borrow factor.
      - bold: |-
          No debt, no absorb
        text: |-
          an account with a positive base and no debt has no liquidation line to cross.
      - bold: |-
          Who may act
        text: |-
          anyone may supply or repay for the account; taking value out or borrowing needs the owner or a named manager.
      - bold: |-
          One market per base asset
        text: |-
          each market, a contract Compound calls a Comet, lends and borrows one base asset; this card's is one of several, and they share nothing.
        text_base: |-
          Compound V3 on Base runs separate markets from Ethereum's; a position on one says nothing about the other.
    links:
      - label: |-
          Collateral and borrowing
        doc: COLLATERAL_BORROWING
      - label: |-
          Interest rates
        doc: INTEREST_RATES
      - label: |-
          Account management
        doc: ACCOUNT_MANAGEMENT

  position_closed:
    title: |-
      About This Position
    intro: |-
      This position has unwound: its debt is repaid and its collateral withdrawn, with at most dust under a cent left.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Highest recorded
        text: |-
          each peak is the highest balance the position held just before or after any event, as the chain read it with interest.
        text_base: |-
          each peak is the highest balance the position held just before or after any event, replayed from the logged amounts without interest.
      - bold: |-
          One signed base balance
        text: |-
          positive base is lending and negative base is borrowing, so supply and repay are one operation, as are withdraw and borrow.
      - bold: |-
          Coming back
        text: |-
          a new supply or borrow in this market reopens the same position's timeline.
      - bold: |-
          One market per base asset
        text: |-
          each market, a contract Compound calls a Comet, lends and borrows one base asset; this card's is one of several, and they share nothing.
        text_base: |-
          Compound V3 on Base runs separate markets from Ethereum's; a position on one says nothing about the other.
    links:
      - label: |-
          Collateral and borrowing
        doc: COLLATERAL_BORROWING
      - label: |-
          Liquidation
        doc: LIQUIDATION

  position_liquidated:
    title: |-
      About This Position
    intro: |-
      This position was absorbed when its debt outgrew its liquidation line, and nothing is borrowed or posted now.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Absorb
        text: |-
          Compound V3 liquidates the whole account: the protocol takes the collateral and clears all the debt in one step.
      - bold: |-
          Outcome
        text: |-
          a position that closes with an absorb in its record reads as liquidated.
      - bold: |-
          Highest recorded
        text: |-
          each peak is the highest balance the position held just before or after any event, as the chain read it with interest.
        text_base: |-
          each peak is the highest balance the position held just before or after any event, replayed from the logged amounts without interest.
      - bold: |-
          Coming back
        text: |-
          a new supply or borrow in this market reopens the same position's timeline.
      - bold: |-
          One market per base asset
        text: |-
          each market, a contract Compound calls a Comet, lends and borrows one base asset; this card's is one of several, and they share nothing.
        text_base: |-
          Compound V3 on Base runs separate markets from Ethereum's; a position on one says nothing about the other.
    links:
      - label: |-
          Absorb
        doc: ABSORB
      - label: |-
          Liquidation
        doc: LIQUIDATION
