# Compound V3 prose: every string an event's explanation, the position card's
# explanation and the "?" modals print on a Compound V3 (Comet) page, on
# Ethereum and on Base. The page reads this file and nothing else; the code
# chooses which strings to say and fills their figures
# (lib/compound/event-prose.ts for an event,
# components/protocol/compound/compound-position-explanation.tsx for the
# position card).
#
# How to edit
#   Each string sits on the line below its `|-`, indented. Write it as it should
#   read: colons, apostrophes, quotes, percent signs and dashes need no escaping.
#   Keep each string on one line, keep its indentation, and leave the ids (the
#   words before a colon) as they are.
#
# Placeholders
#   {name} is a figure the code fills in, printed at the rounding the
#   `placeholders` section gives it; {name|rounding} prints it at another
#   rounding for that string alone. Keep the braces and the name; move a
#   placeholder anywhere in its string.
#
# Limits
#   Every string here is held to rails-ops standards/prose-limits-and-zones.md:
#   `pnpm check:prose-limits` fails a bullet over 20 words or 2 figures, a modal
#   over 200 words, and the rest of the standard's section 2. `pnpm check:prose`
#   confirms the file parses, every id the code reads is here, and every
#   placeholder is one the code supplies.

# ── Roundings: how a placeholder's figure is printed ──
roundings:
  compound_amount: |-
    the card's amount: four places below one, three above, grouped (0.0743, 14,550.916)
  number: |-
    three places, grouped (6,500.123)
  usd_value: |-
    dollars and cents ($2.20)
  ratio_frac: |-
    a ratio given as a fraction, as a percent at two places (0.0512 → 5.12%)
  pct_whole: |-
    whole percent of a fraction (0.32 → 32%), unsigned
  usd: |-
    whole dollars ($4,490)
  count: |-
    a whole number, grouped (1,204)
  text: |-
    a word or name as given
  address: |-
    an address, shortened and linked to the block explorer

# ── Placeholders: each name, its default rounding and what it stands for ──
placeholders:
  delta:
    rounding: compound_amount
    means: |-
      the amount of the token the event moved, as the header prints it
  asset_symbol:
    rounding: text
    means: |-
      the symbol of the token the event moved
  market:
    rounding: text
    means: |-
      the market's label (cUSDCv3)
  base_symbol:
    rounding: text
    means: |-
      the market's base asset
  repaid:
    rounding: compound_amount
    means: |-
      the part of a supply that cleared base debt
  lent:
    rounding: compound_amount
    means: |-
      the part of a supply that was lent out, or the base balance a position lends
  from_savings:
    rounding: compound_amount
    means: |-
      the part of a withdrawal that came from the account's lent balance
  borrowed:
    rounding: compound_amount
    means: |-
      the part of a withdrawal that was borrowed, or the base debt a position owes
  base_debt:
    rounding: number
    means: |-
      the base debt the account owes after the event, as the detail grid prints it
  cleared:
    rounding: compound_amount
    means: |-
      the base debt an absorb cleared
  credit:
    rounding: compound_amount
    means: |-
      the credit an absorb left past the debt, kept as a lent balance
  kept:
    rounding: usd_value
    means: |-
      the value the protocol kept from the seized collateral, over the credit the account received
  short:
    rounding: usd_value
    means: |-
      how far the seized collateral fell short of the credit
  seized_usd:
    rounding: usd_value
    means: |-
      the seized collateral at the absorb's prices
  sibling_cleared:
    rounding: compound_amount
    means: |-
      the debt the same transaction's absorb cleared
  event_type:
    rounding: text
    means: |-
      the event's type as the index names it
  actor:
    rounding: address
    means: |-
      the account that sent the transaction
  funder:
    rounding: address
    means: |-
      the account that provided the tokens
  # The position card's figures, drawn by the card with their receipts.
  collateral_syms:
    rounding: text
    means: |-
      the collateral assets the account holds, listed
  deprecated_syms:
    rounding: text
    means: |-
      the held collateral assets that add no borrowing capacity, listed
  collateral_usd:
    rounding: usd
    means: |-
      the collateral at the market's oracle prices
  debt_usd:
    rounding: usd
    means: |-
      the base debt at the market's oracle prices
  collateral_base:
    rounding: compound_amount
    means: |-
      the collateral at the market's oracle prices, in the base asset
  supply_apr:
    rounding: ratio_frac
    means: |-
      the supply rate the market pays now, per year
  share:
    rounding: ratio_frac
    means: |-
      the debt as a share of the liquidation line (61.2%), or over 1,000×
  line:
    rounding: compound_amount
    means: |-
      the debt the liquidation line covers, in the base asset
  drop:
    rounding: pct_whole
    means: |-
      how far the collateral can fall before the account can be absorbed
  room:
    rounding: compound_amount
    means: |-
      the base the account could still borrow, or the collateral could back
  peak_coll:
    rounding: compound_amount
    means: |-
      the most of each collateral asset the position held, listed
  peak_lent:
    rounding: compound_amount
    means: |-
      the most base the position lent
  peak_debt:
    rounding: compound_amount
    means: |-
      the most base the position owed
  dust:
    rounding: compound_amount
    means: |-
      the dust left in each asset, listed
  count:
    rounding: count
    means: |-
      how many times the protocol absorbed the position
  time_word:
    rounding: text
    means: |-
      time or times
  external:
    rounding: count
    means: |-
      the events another address executed
  total:
    rounding: count
    means: |-
      the events recorded on the position
  actors:
    rounding: count
    means: |-
      the other addresses that executed events
  top_count:
    rounding: count
    means: |-
      the events the most active other address executed
  lead_name:
    rounding: text
    means: |-
      the name of the most active other address

# ── The event explanation's group headings, in the order the pane shows them ──
group_words:
  happened: |-
    What happened
  adds_up: |-
    How it adds up
  leaves: |-
    Where it leaves the position

# ── Words the code puts into a sentence ──
words:
  and: |-
    and
  time_one: |-
    time
  time_many: |-
    times

# ── The position card's explanation (zone Z1): an unheaded lead, then bullets
# under Holdings, Risk and History when two of them hold two or more bullets
# (Compound V3 has no rate group: the supply rate sits in the lead). Risk holds
# at most four: the debt against the liquidation line, the fall to absorption,
# the room to borrow, and the verdict when the account is absorbable or over
# its limit. Read by positionWords / positionNodes
# (lib/compound/event-templates.ts). ──
position_words:
  heading_holdings: |-
    Holdings
  heading_risk: |-
    Risk
  heading_history: |-
    History
  # ── An open position ──
  lead_borrow: |-
    This position borrows {borrowed} against collateral in {collateral_syms}:
  lead_lend: |-
    This position lends {lent} to the {base_symbol} market, earning the supply rate ({supply_apr} APR):
  lead_collateral: |-
    This position holds collateral in {collateral_syms} with nothing borrowed against it:
  worth_both: |-
    At the market's oracle prices, the collateral is worth {collateral_usd} and the debt {debt_usd}.
  worth_collateral: |-
    At the market's oracle prices, the collateral is worth {collateral_usd}.
  worth_debt: |-
    At the market's oracle prices, the debt is {debt_usd}.
  worth_base: |-
    At the market's oracle prices, the collateral is worth about {collateral_base}.
  also_collateral: |-
    It also holds collateral in {collateral_syms}, backing no borrowing.
  deprecated_one: |-
    {deprecated_syms} is deprecated and adds no borrowing capacity.
  deprecated_many: |-
    {deprecated_syms} are deprecated and add no borrowing capacity.
  liq_line: |-
    Debt sits at {share} of the liquidation line, which covers {line} of debt.
  liq_line_beyond: |-
    Debt is {share} the liquidation line, which covers {line} of debt.
  drop: |-
    The collateral can fall about {drop} before the account can be absorbed.
  absorbable: |-
    The account can be absorbed now: anyone may trigger it.
  over_limit: |-
    The account is over its borrow limit, so it cannot borrow more.
  capacity: |-
    The account could borrow about {room} more at current prices.
  idle_safe: |-
    Nothing is borrowed, so none of the collateral can be absorbed.
  idle_capacity: |-
    At current prices the collateral could back up to {room} of borrowing.
  operators: |-
    Of the {total} events here, {external} were executed by an address other than the owner's.
  operators_one: |-
    Of the {total} events here, {external} was executed by an address other than the owner's.
  operators_one_named: |-
    That one ran through {lead_name}.
  operators_all_named: |-
    All of them ran through {lead_name}.
  operators_most_named: |-
    Most of them ran through {lead_name}.
  operators_single: |-
    A single address ran all of them.
  operators_spread: |-
    The work is spread across {actors} addresses, the most active running {top_count} of them.
  # ── A closed or absorbed position ──
  closed_lead: |-
    This {market} position is closed; nothing is lent, borrowed or posted now:
  closed_lead_dust: |-
    This {market} position is closed; nothing is borrowed now:
  closed_lead_absorbed: |-
    This {market} position is closed, with an absorb in its record; nothing is lent, borrowed or posted now:
  closed_lead_absorbed_dust: |-
    This {market} position is closed, with an absorb in its record; nothing is borrowed now:
  dust_left: |-
    All that is left is dust worth under a cent: {dust}.
  peak_held: |-
    At its height it held up to {peak_coll} of collateral.
  peak_lent: |-
    It lent as much as {peak_lent}.
  peak_owed: |-
    It owed as much as {peak_debt}.
  peak_owed_principal: |-
    It owed as much as {peak_debt} in principal.
  absorbed: |-
    The protocol absorbed the position {count} {time_word}.

# ── Sentences more than one template says ──
shared_sentences:
  base.lends:
    when: |-
      the account's base balance is positive after the event
    text: |-
      The account now lends in this market and earns the supply rate.
  base.owes:
    when: |-
      the account's base balance is negative after the event
    text: |-
      The account now owes on its base balance and pays the borrow rate.
  base.flat:
    when: |-
      the account's base balance is zero after the event
    text: |-
      The account's base balance is now flat.
  base.unsettled:
    when: |-
      the row has no balance before it, so the balance after is still being read
    text: |-
      The balance after it, with interest, is still being read.
  coll.backs_debt:
    when: |-
      collateral was added or received, and the account owes base afterwards
    text: |-
      The collateral now stands behind {base_debt} {base_symbol} of base debt.
  coll.no_debt_in:
    when: |-
      collateral was added or received, and the account owes nothing afterwards
    text: |-
      No base is borrowed, so this collateral backs nothing yet.
  coll.still_backs:
    when: |-
      collateral was withdrawn or sent, and the account owes base afterwards
    text: |-
      The remaining collateral still stands behind {base_debt} {base_symbol} of base debt.
  coll.no_debt_out:
    when: |-
      collateral was withdrawn or sent, and the account owes nothing afterwards
    text: |-
      Nothing is borrowed, so no debt is left uncovered.
  actor.sent_funded:
    when: |-
      another account sent the transaction and provided the tokens
    text: |-
      Another account, {actor}, sent this transaction and provided the tokens.
  actor.sent:
    when: |-
      another account sent the transaction and the tokens came from somewhere else
    text: |-
      Another account, {actor}, sent this transaction.
  actor.bundler:
    when: |-
      the wallet is a smart account and a bundler sent its signed operation
    text: |-
      The owner's smart account signed this; the bundler {actor} sent it.
  actor.tokens_from:
    when: |-
      the tokens came from an account that did not send the transaction
    text: |-
      The tokens came from {funder}.
  actor.tokens_bulker:
    when: |-
      the tokens came through Compound's Bulker
    text: |-
      The tokens came through Compound's Bulker, {funder}.

# ── Templates: one per kind of event ──
#   id          the template's id
#   title       the event's label in the template list
#   when        the event and state that select it
#   L5          the modal it opens (see L5 below)
#   variants    each variant's id and when it applies
#   sentences   its sentences, each with `when` and `text`
#   order       the order the explanation says them in, shared sentences included
#   groups      which group (group_words) each sentence of order sits in
#   alternates  lists of sentences the code says at most one of
# A figure the card's cells, notes or price row show stays out of a sentence
# unless the sentence says what it means (rails-ops
# standards/prose-limits-and-zones.md).
templates:
  - id: compound3.supply
    title: |-
      Supply
    when: |-
      supply of the base asset: lends, repays debt, or both
    L5: supply
    variants:
      lend: |-
        the account had no debt, so all of it is lent
      repay: |-
        the supply only paid down debt
      split: |-
        the supply cleared the debt and lent the rest
      unsettled: |-
        the row has no balance before it, so the split is not known
      zero: |-
        the call moved nothing
    sentences:
      supply.zero:
        when: |-
          zero
        text: |-
          A supply call for 0 {asset_symbol} on the {market} market moved nothing.
      supply.what_lend:
        when: |-
          lend
        text: |-
          The account supplied {delta} {asset_symbol} to the {market} market, where it is lent out to earn the supply rate.
      supply.what_repay:
        when: |-
          repay
        text: |-
          The account supplied {delta} {asset_symbol} to the {market} market, paying down its base debt.
      supply.what:
        when: |-
          split, unsettled
        text: |-
          The account supplied {delta} {asset_symbol} to the {market} market.
      supply.split:
        when: |-
          split
        text: |-
          {repaid} {asset_symbol} cleared the base debt and {lent} {asset_symbol} was lent out.
    order:
      - supply.zero
      - supply.what_lend
      - supply.what_repay
      - supply.what
      - actor.sent_funded
      - actor.sent
      - actor.bundler
      - actor.tokens_from
      - actor.tokens_bulker
      - supply.split
      - base.lends
      - base.owes
      - base.flat
      - base.unsettled
    groups:
      happened:
        - supply.zero
        - supply.what_lend
        - supply.what_repay
        - supply.what
        - actor.sent_funded
        - actor.sent
        - actor.bundler
        - actor.tokens_from
        - actor.tokens_bulker
      adds_up:
        - supply.split
      leaves:
        - base.lends
        - base.owes
        - base.flat
        - base.unsettled
    alternates:
      - [supply.zero, supply.what_lend, supply.what_repay, supply.what]
      - [actor.sent_funded, actor.sent, actor.bundler]
      - [actor.tokens_from, actor.tokens_bulker]
      - [base.lends, base.owes, base.flat, base.unsettled]

  - id: compound3.withdraw
    title: |-
      Withdraw or borrow
    when: |-
      withdraw of the base asset: spends the lent balance, borrows, or both
    L5: withdraw
    variants:
      savings: |-
        the withdrawal came from the account's lent balance
      borrow: |-
        the account had no lent balance, so all of it is borrowed
      split: |-
        the withdrawal spent the lent balance and borrowed the rest
      unsettled: |-
        the row has no balance before it, so the split is not known
      zero: |-
        the call moved nothing
    sentences:
      withdraw.zero:
        when: |-
          zero
        text: |-
          A withdraw call for 0 {asset_symbol} on the {market} market moved nothing.
      withdraw.what_savings:
        when: |-
          savings
        text: |-
          The account withdrew {delta} {asset_symbol} of its lent balance back to the wallet.
      withdraw.what_borrow:
        when: |-
          borrow
        text: |-
          The account borrowed {delta} {asset_symbol} from the {market} market against its collateral.
      withdraw.what:
        when: |-
          split, unsettled
        text: |-
          The account withdrew {delta} {asset_symbol} from the {market} market.
      withdraw.split:
        when: |-
          split
        text: |-
          {from_savings} {asset_symbol} came from its lent balance and {borrowed} {asset_symbol} was borrowed.
    order:
      - withdraw.zero
      - withdraw.what_savings
      - withdraw.what_borrow
      - withdraw.what
      - withdraw.split
      - base.lends
      - base.flat
      - base.unsettled
    groups:
      happened:
        - withdraw.zero
        - withdraw.what_savings
        - withdraw.what_borrow
        - withdraw.what
      adds_up:
        - withdraw.split
      leaves:
        - base.lends
        - base.flat
        - base.unsettled
    alternates:
      - [withdraw.zero, withdraw.what_savings, withdraw.what_borrow, withdraw.what]
      - [base.lends, base.flat, base.unsettled]

  - id: compound3.supply_collateral
    title: |-
      Add collateral
    when: |-
      supply_collateral
    L5: collateral_in
    variants:
      default: |-
        always
    sentences:
      coll.what_in:
        when: |-
          always
        text: |-
          The account added {delta} {asset_symbol} to the {market} collateral stack.
    order:
      - coll.what_in
      - actor.sent_funded
      - actor.sent
      - actor.bundler
      - actor.tokens_from
      - actor.tokens_bulker
      - coll.backs_debt
      - coll.no_debt_in
    groups:
      happened:
        - coll.what_in
        - actor.sent_funded
        - actor.sent
        - actor.bundler
        - actor.tokens_from
        - actor.tokens_bulker
      leaves:
        - coll.backs_debt
        - coll.no_debt_in
    alternates:
      - [actor.sent_funded, actor.sent, actor.bundler]
      - [actor.tokens_from, actor.tokens_bulker]
      - [coll.backs_debt, coll.no_debt_in]

  - id: compound3.withdraw_collateral
    title: |-
      Withdraw collateral
    when: |-
      withdraw_collateral
    L5: collateral_out
    variants:
      default: |-
        always
    sentences:
      coll.what_out:
        when: |-
          always
        text: |-
          The account withdrew {delta} {asset_symbol} from the {market} collateral stack.
    order:
      - coll.what_out
      - coll.still_backs
      - coll.no_debt_out
    groups:
      happened:
        - coll.what_out
      leaves:
        - coll.still_backs
        - coll.no_debt_out
    alternates:
      - [coll.still_backs, coll.no_debt_out]

  - id: compound3.absorb_debt
    title: |-
      Absorb
    when: |-
      absorb_debt: the protocol took over the account's debt
    L5: absorb
    variants:
      plain: |-
        the absorb cleared the debt and left no credit
      credit: |-
        the credit passed the debt, and the rest stays as a lent balance
    sentences:
      absorb.what:
        when: |-
          always
        text: |-
          The account's debt passed its liquidation line, so the protocol absorbed it.
      absorb.cleared:
        when: |-
          plain
        text: |-
          The absorb cleared {cleared} {asset_symbol} of debt.
      absorb.cleared_credit:
        when: |-
          credit
        text: |-
          The absorb cleared {cleared} {asset_symbol} of debt, leaving {credit} {asset_symbol} as a lent balance.
      absorb.kept:
        when: |-
          the seized collateral was worth more than the credit
        text: |-
          The protocol kept {kept} of the collateral's value, which is what the absorb cost the account.
      absorb.short:
        when: |-
          the seized collateral was worth less than the credit
        text: |-
          The credit was {short} more than the collateral was worth; the protocol's reserves covered it.
    order:
      - absorb.what
      - absorb.cleared
      - absorb.cleared_credit
      - absorb.kept
      - absorb.short
    groups:
      happened:
        - absorb.what
      adds_up:
        - absorb.cleared
        - absorb.cleared_credit
      leaves:
        - absorb.kept
        - absorb.short
    alternates:
      - [absorb.cleared, absorb.cleared_credit]
      - [absorb.kept, absorb.short]

  - id: compound3.absorb_collateral
    title: |-
      Absorbed collateral
    when: |-
      absorb_collateral: one asset the protocol took from the account
    L5: absorb
    variants:
      priced: |-
        the row carries the asset's value at the absorb's prices
      unpriced: |-
        the row carries no value
    sentences:
      seize.what_usd:
        when: |-
          priced
        text: |-
          In this absorb the protocol seized {delta} {asset_symbol} of collateral, worth {seized_usd} at the absorb's prices.
      seize.what:
        when: |-
          unpriced
        text: |-
          In this absorb the protocol seized {delta} {asset_symbol} of collateral.
      seize.same_tx_amount:
        when: |-
          the same transaction's absorb row is on the page
        text: |-
          In the same transaction the protocol cleared the account's whole debt, {sibling_cleared} {base_symbol}.
      seize.same_tx:
        when: |-
          the same transaction's absorb row is not on the page
        text: |-
          In the same transaction the protocol cleared the account's whole debt.
    order:
      - seize.what_usd
      - seize.what
      - seize.same_tx_amount
      - seize.same_tx
    groups:
      happened:
        - seize.what_usd
        - seize.what
      adds_up:
        - seize.same_tx_amount
        - seize.same_tx
    alternates:
      - [seize.what_usd, seize.what]
      - [seize.same_tx_amount, seize.same_tx]

  - id: compound3.transfer
    title: |-
      Transfer
    when: |-
      transfer_in or transfer_out of the base balance
    L5: transfer_base
    variants:
      in: |-
        the account received base
      out: |-
        the account sent base
    sentences:
      xfer.in:
        when: |-
          in
        text: |-
          The account received {delta} {asset_symbol} of base from another Comet account.
      xfer.out:
        when: |-
          out
        text: |-
          The account sent {delta} {asset_symbol} of base to another Comet account.
    order:
      - xfer.in
      - xfer.out
      - base.lends
      - base.owes
      - base.flat
      - base.unsettled
    groups:
      happened:
        - xfer.in
        - xfer.out
      leaves:
        - base.lends
        - base.owes
        - base.flat
        - base.unsettled
    alternates:
      - [xfer.in, xfer.out]
      - [base.lends, base.owes, base.flat, base.unsettled]

  - id: compound3.transfer_collateral
    title: |-
      Collateral transfer
    when: |-
      transfer_collateral_in or transfer_collateral_out
    L5: transfer_collateral
    variants:
      in: |-
        the account received collateral
      out: |-
        the account sent collateral
    sentences:
      xfer_coll.in:
        when: |-
          in
        text: |-
          The account received {delta} {asset_symbol} of collateral from another Comet account.
      xfer_coll.out:
        when: |-
          out
        text: |-
          The account sent {delta} {asset_symbol} of collateral to another Comet account.
    order:
      - xfer_coll.in
      - xfer_coll.out
      - coll.backs_debt
      - coll.no_debt_in
      - coll.still_backs
      - coll.no_debt_out
    groups:
      happened:
        - xfer_coll.in
        - xfer_coll.out
      leaves:
        - coll.backs_debt
        - coll.no_debt_in
        - coll.still_backs
        - coll.no_debt_out
    alternates:
      - [xfer_coll.in, xfer_coll.out]
      - [coll.backs_debt, coll.no_debt_in, coll.still_backs, coll.no_debt_out]

  - id: compound3.fallback
    title: |-
      Event
    when: |-
      an event type the generator does not know
    L5: fallback
    variants:
      default: |-
        always
    sentences:
      fallback.what:
        when: |-
          always
        text: |-
          The account recorded a {event_type} event on the {market} market.
    order:
      - fallback.what
    groups:
      happened:
        - fallback.what

