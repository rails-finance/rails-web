  close: |-
    Close
  liquidated: |-
    Liquidated
  liquidation: |-
    Liquidation
  add: |-
    Add
  withdraw: |-
    Withdraw
  borrow: |-
    Borrow
  repay: |-
    Repay
  adjust: |-
    Adjust
  no_change: |-
    No change
  no_change_run: |-
    No change ×{run_count}
  rate_up: |-
    Increase interest rate
  rate_down: |-
    Decrease interest rate
  rate_change: |-
    Rate change
  apply_debt: |-
    Apply debt
  redemption: |-
    Redemption
  redeemed: |-
    Redeemed
  delegate: |-
    Delegate
  leave_delegate: |-
    Leave delegate
  transfer: |-
    Transfer
  batch_rate: |-
    Interest rate
  supply: |-
    Supply
  cleared: |-
    Cleared
  reduced: |-
    Reduced
  debt: |-
    Debt
  from_liquidation: |-
    From a liquidation
  and: |-
    and
  claimable: |-
    claimable
  claimed: |-
    claimable, claimed
  zombie: |-
    Zombie

# ── L2: the opened card's labels and sub-lines ──
L2_words:
  collateral: |-
    Collateral
  debt: |-
    Debt
  interest_rate: |-
    Interest Rate
  price: |-
    {coll_symbol} price
  # The Debt cell and line where the whole move is the accrual: "+8,580.12
  # interest = 667,073.79".
  accrual_move: |-
    +{accrued_total} {accrual_noun}
  # The Debt cell's sub-line where the owner acted and interest accrued: the
  # figure is the ledger's "since last event" line.
  accrual_in_ledger: |-
    with {accrual_noun}, in the ledger
  # L2's Debt line, the same case.
  accrual_since: |-
    +{accrued_total} {accrual_noun} since the last event is in the ledger
  # The Debt ledger's rows for the accrual since the previous event; the
  # earlier accrual is "Interest before", "Batch management fees before".
  ledger_interest_since: |-
    Interest since last event
  ledger_batch_fee_since: |-
    Batch management fees since last event
  interest: |-
    interest
  interest_and_fees: |-
    interest and fees
  fee: |-
    {upfront_fee} fee
  yearly_interest: |-
    {yearly_interest} {debt_symbol} / year interest
  excl_fee: |-
    , excl. management fee
  yearly_fee: |-
    + {batch_fee_rate} management fee · {yearly_fee} {debt_symbol} / year
  closed: |-
    CLOSED
  not_applicable: |-
    N/A
  redeemed_by: |-
    Redeemed by:
  pl: |-
    P/L
  claimable: |-
    claimable
  # T2's row under a redemption's price chip, where the redeemed collateral at
  # the latest block's price sits on the other side of the debt it paid off.
  redemption_today_lower: |-
    At the latest block’s price, {price_today}, the redeemed {coll_symbol} would be worth {redemption_vs_today_usd} less than the debt it paid off
  redemption_today_higher: |-
    At the latest block’s price, {price_today}, the redeemed {coll_symbol} would be worth {redemption_vs_today_usd} more than the debt it paid off
  collateral_ratio: |-
    Collateral Ratio

# ── Copy for LLM: the block's context header ──
context_words:
  title: |-
    # Liquity V2 · {title} · {utc} UTC
  position: |-
    Liquity V2 · {chain} · {coll_symbol} trove {trove} · owner {owner}
  event: |-
    Event #{n} of {total} · tx {tx} · {url}
  prices: |-
    Prices are {coll_symbol} oracle prices at the time of the event unless marked "today". Not financial advice.
  chain_default: |-
    Ethereum
  owner_unknown: |-
    unknown

# ── The footer line ──
footer_words:
  gas: |-
    Gas {gas}
  gas_run: |-
    Gas across {run_count} transactions {gas}
  tx: |-
    tx {tx}
  block: |-
    block {block}

# ── Copy for LLM: the block's words ──
copy_words:
  links: |-
    Links:
  below: |-
    (below)
  footer: |-
    Footer

# ── The event page's actions row: the Trove's words ──
# The row's shared words are lib/shared/event-page-words.ts; a `_hint` is a
# control's tooltip.
action_words:
  in_timeline_hint: |-
    Open this event in the Trove's timeline

# ── The event page: the side column beside the card ──
# The Trove's words in the shared column (components/shared/event-page-aside.tsx):
# the paragraph and its timeline link, and the facts rows above the shared
# ones (event, block, transaction). The metadata description is
# `description`; {holder} is held_by or last_held_by (a closed Trove's owner is
# its last one).
page_words:
  paragraph: |-
    This page is one transaction; its figures are the Trove's state after it.
  description: |-
    One transaction from the {coll_symbol} Trove {trove}, {holder}: event {n|count} of {total|count}, on {day}. The figures are the Trove's state after it.
  held_by: |-
    held by {owner}
  last_held_by: |-
    last held by {owner}
  timeline_link: |-
    See the whole history in the timeline.
  branch: |-
    Branch
  trove: |-
    Trove
  holder: |-
    Holder
  last_holder: |-
    Last holder
  copy_trove: |-
    Copy the Trove id
  explanation_heading: |-
    Event explanation

# ── The explanation's groups: the headings over its bullets ──
# A template's `groups` puts each of its sentences under one of these. When two
# or more groups hold two or more bullets each, the explanation shows every
# group that has a bullet under its heading, in this order, the bullets in the
# template's `order` within each; otherwise the bullets stand as one list in
# `order`. Copy for LLM prints each heading as "L4 · {heading}".
group_words:
  happened: |-
    What happened
  adds_up: |-
    How it adds up
  leaves: |-
    Where it leaves the position

# ── Words the L5 modals fill in ──
L5_words:
  coll_type_unknown: |-
    this collateral
  delegate_named: |-
    the {delegate_name} delegate
  delegate_unnamed: |-
    a batch-manager delegate

