  prov_mgmt_fee: |-
    Accrued delegate fee — the delegate’s management fee built up on the trove’s debt since its last change. It is charged on top of the interest.
  field_accrued_interest: |-
    accrued interest
  field_accrued_fee: |-
    accrued batch management fee
  prov_mgmt_rate: |-
    Delegate management rate — the delegate’s annual fee, charged on top of the interest rate. The delegate sets one rate for every trove in the batch.
  prov_mgmt_rate_via: |-
    the batch’s most recent BatchUpdated log: _annualManagementFee
  prov_redemption_count: |-
    Redemption count — the number of redemptions that have taken collateral from this trove.
  prov_redemption_count_via: |-
    count of the trove’s redemption events
  prov_owner_tx_count: |-
    Owner transactions — the number of events in the trove’s history minus its redemptions, which other BOLD holders start.
  prov_owner_tx_count_formula: |-
    transaction count − redemption count
  prov_owner_tx_count_via: |-
    counts of the trove’s events

# ── Shared sentences: said by more than one template ──
# Each has `when` (the condition under which the code says it) and `text`.
# A template says one only where its `order` lists it.
shared_sentences:
  market.fell:
    when: |-
      the price fell since the trove's previous event by at least a quarter of the room the trove had above the minimum
    text: |-
      {coll_symbol} had fallen {price_change} since the previous event, from {price_prev}.
  market.rose:
    when: |-
      the price rose by the same measure
    text: |-
      {coll_symbol} had risen {price_change} since the previous event, from {price_prev}.
  redist.debt:
    when: |-
      the touch applied a redistribution of debt only
    text: |-
      Liquidations on the {coll_symbol} branch had passed this trove {redist_debt} {debt_symbol} of debt.
  redist.coll:
    when: |-
      the touch applied a redistribution of collateral only
    text: |-
      Liquidations on the {coll_symbol} branch had passed this trove {redist_coll} {coll_symbol} of collateral.
  redist.both:
    when: |-
      the touch applied a redistribution of both
    text: |-
      Liquidations on the {coll_symbol} branch had passed this trove {redist_debt} {debt_symbol} of debt and {redist_coll} {coll_symbol} of collateral.
  accrual.interest:
    when: |-
      more than 0.01 accrued and the trove was not batched
    text: |-
      Interest of {accrued_total} {debt_symbol} accrued since the last operation.
  accrual.batched:
    when: |-
      more than 0.01 accrued on a batched trove
    text: |-
      Interest and fees of {accrued_total} {debt_symbol} accrued since the last operation.
  accrual.batched_fee:
    when: |-
      the same, with the management fee told apart
    text: |-
      Interest and fees of {accrued_total} {debt_symbol} accrued since the last operation, including a {accrued_fee} {debt_symbol} management fee.
  liq.after:
    when: |-
      the liquidation price is below the event's price
    text: |-
      Liquidation would come at {coll_symbol} {liq_price_after}, {liq_distance_after} below this price.
  same_block:
    when: |-
      the block holds more than one of the trove's events
    text: |-
      This trove had {block_events} events in this block; this is {block_position}.

# ── Templates: one per kind of event ──
#   id          the template's id (the exports and the JSON route name it)
#   title       the Copy for LLM block's event label
#   when        the operations and state that select it
#   L5          the modal it opens (see L5 below)
#   variants    each variant's id and when it applies
#   L1          the header line: groups of words (an L1_words id) and figures (a
#               placeholder, with the token symbol after it); a group whose figure
#               the event lacks is left out
#   sentences   its sentences, each with `when` and `text`
#   order       the order the explanation says them in, shared sentences included
#   groups      which group (group_words) each sentence of order sits in
#   alternates  lists of sentences the code says at most one of (the prose
#               limits check counts each list as one bullet)
# A figure the card's cells or price row show stays out of a sentence unless the
# sentence says what it means (rails-ops standards/prose-limits-and-zones.md).
templates:
  - id: liquity2.adjust.add_coll
    title: |-
      Add collateral
    when: |-
      adjustTrove that added collateral and moved no debt
    L5: adjust
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: coll_change
          symbol: coll_symbol
      - - word: from_liquidation
        - figure: redist_l1
    sentences:
      add.what:
        when: |-
          always
        text: |-
          The owner added {added} {coll_symbol} of collateral to the trove.
      add.liq_distance:
        when: |-
          the trove has debt before and after
        text: |-
          The trove is safer: {coll_symbol} would now need to fall {liq_distance_after} to reach liquidation, against {liq_distance_before} before.
    order:
      - add.what
      - add.liq_distance
      - market.fell
      - market.rose
      - redist.debt
      - redist.coll
      - redist.both
      - same_block
    groups:
      happened: [add.what, same_block]
      adds_up: [redist.debt, redist.coll, redist.both]
      leaves: [add.liq_distance, market.fell, market.rose]

  - id: liquity2.adjust.withdraw_coll
    title: |-
      Withdraw collateral
    when: |-
      adjustTrove that withdrew collateral and moved no debt
    L5: adjust
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: coll_change
          symbol: coll_symbol
      - - word: from_liquidation
        - figure: redist_l1
    sentences:
      withdraw.what:
        when: |-
          always
        text: |-
          The owner withdrew {withdrawn} {coll_symbol} of collateral from the trove.
      withdraw.liq_distance:
        when: |-
          the trove has debt before and after
        text: |-
          The trove is less safe: {coll_symbol} would now need to fall {liq_distance_after} to reach liquidation, against {liq_distance_before} before.
    order:
      - withdraw.what
      - withdraw.liq_distance
      - market.fell
      - market.rose
      - redist.debt
      - redist.coll
      - redist.both
      - same_block
    groups:
      happened: [withdraw.what, same_block]
      adds_up: [redist.debt, redist.coll, redist.both]
      leaves: [withdraw.liq_distance, market.fell, market.rose]

  - id: liquity2.adjust.borrow
    title: |-
      Borrow
    when: |-
      adjustTrove that borrowed more and moved no collateral
    L5: adjust
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: debt_change
          symbol: debt_symbol
      - - word: from_liquidation
        - figure: redist_l1
    sentences:
      borrow.what:
        when: |-
          no upfront fee
        text: |-
          The owner borrowed {borrowed} {debt_symbol} more against the trove.
      borrow.what_fee:
        when: |-
          the borrow charged an upfront fee
        text: |-
          The owner borrowed {borrowed} {debt_symbol} more, paying an upfront fee of 7 days of average interest.
      borrow.liq_distance:
        when: |-
          the trove has debt before and after
        text: |-
          The trove is less safe: {coll_symbol} would now need to fall {liq_distance_after} to reach liquidation, against {liq_distance_before} before.
    order:
      - borrow.what
      - borrow.what_fee
      - borrow.liq_distance
      - market.fell
      - market.rose
      - redist.debt
      - redist.coll
      - redist.both
      - same_block
    groups:
      happened: [borrow.what, borrow.what_fee, same_block]
      adds_up: [redist.debt, redist.coll, redist.both]
      leaves: [borrow.liq_distance, market.fell, market.rose]
    alternates:
      - [borrow.what, borrow.what_fee]

  - id: liquity2.adjust.repay
    title: |-
      Repay
    when: |-
      adjustTrove that repaid debt and moved no collateral
    L5: adjust
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: debt_change
          symbol: debt_symbol
      - - word: from_liquidation
        - figure: redist_l1
    sentences:
      repay.what:
        when: |-
          always
        text: |-
          The owner repaid {repaid} {debt_symbol} of the trove’s debt.
      repay.liq_distance:
        when: |-
          the trove has debt before and after
        text: |-
          The trove is safer: {coll_symbol} would now need to fall {liq_distance_after} to reach liquidation, against {liq_distance_before} before.
    order:
      - repay.what
      - repay.liq_distance
      - market.fell
      - market.rose
      - redist.debt
      - redist.coll
      - redist.both
      - same_block
    groups:
      happened: [repay.what, same_block]
      adds_up: [redist.debt, redist.coll, redist.both]
      leaves: [repay.liq_distance, market.fell, market.rose]

  - id: liquity2.adjust.combined
    title: |-
      Adjust trove
    when: |-
      adjustTrove that moved both collateral and debt
    L5: adjust
    variants:
      add_borrow: |-
        added collateral and borrowed
      add_repay: |-
        added collateral and repaid
      withdraw_borrow: |-
        withdrew collateral and borrowed
      withdraw_repay: |-
        withdrew collateral and repaid
    L1:
      - - figure: coll_label
        - figure: coll_change
          symbol: coll_symbol
      - - figure: debt_label
        - figure: debt_change
          symbol: debt_symbol
      - - word: from_liquidation
        - figure: redist_l1
    sentences:
      combined.what.add_borrow:
        when: |-
          variant add_borrow, no upfront fee
        text: |-
          The owner added {added} {coll_symbol} of collateral and borrowed {borrowed} {debt_symbol} more.
      combined.what.add_borrow_fee:
        when: |-
          variant add_borrow, an upfront fee
        text: |-
          The owner added {added} {coll_symbol} of collateral and borrowed {borrowed} {debt_symbol} more, plus the upfront fee.
      combined.what.add_repay:
        when: |-
          variant add_repay
        text: |-
          The owner added {added} {coll_symbol} of collateral and repaid {repaid} {debt_symbol} of debt.
      combined.what.withdraw_borrow:
        when: |-
          variant withdraw_borrow, no upfront fee
        text: |-
          The owner withdrew {withdrawn} {coll_symbol} of collateral and borrowed {borrowed} {debt_symbol} more.
      combined.what.withdraw_borrow_fee:
        when: |-
          variant withdraw_borrow, an upfront fee
        text: |-
          The owner withdrew {withdrawn} {coll_symbol} of collateral and borrowed {borrowed} {debt_symbol} more, plus the upfront fee.
      combined.what.withdraw_repay:
        when: |-
          variant withdraw_repay
        text: |-
          The owner withdrew {withdrawn} {coll_symbol} of collateral and repaid {repaid} {debt_symbol} of debt.
      combined.liq_distance:
        when: |-
          the trove has debt before and after
        text: |-
          {coll_symbol} would now need to fall {liq_distance_after} to reach liquidation, against {liq_distance_before} before this adjustment.
    order:
      - combined.what.add_borrow
      - combined.what.add_borrow_fee
      - combined.what.add_repay
      - combined.what.withdraw_borrow
      - combined.what.withdraw_borrow_fee
      - combined.what.withdraw_repay
      - combined.liq_distance
      - market.fell
      - market.rose
      - redist.debt
      - redist.coll
      - redist.both
      - same_block
    groups:
      happened: [combined.what.add_borrow, combined.what.add_borrow_fee, combined.what.add_repay, combined.what.withdraw_borrow, combined.what.withdraw_borrow_fee, combined.what.withdraw_repay, same_block]
      adds_up: [redist.debt, redist.coll, redist.both]
      leaves: [combined.liq_distance, market.fell, market.rose]
    alternates:
      - [combined.what.add_borrow, combined.what.add_borrow_fee]
      - [combined.what.withdraw_borrow, combined.what.withdraw_borrow_fee]

  - id: liquity2.adjust.no_change
    title: |-
      No change
    when: |-
      adjustTrove that moved neither side past display precision, or the server's run of them
    L5: adjust
    variants:
      single: |-
        one touch
      run: |-
        a run of touches the server collapsed into one row
    L1:
      - - figure: label
    sentences:
      nochange.run:
        when: |-
          variant run
        text: |-
          This row stands for the adjustments from {run_first} to {run_last}, none of which changed the trove.
      nochange.run_repaid:
        when: |-
          variant run, debt repaid
        text: |-
          Together they repaid {dust} {debt_symbol}, the interest that accrued between touches.
      nochange.dust:
        when: |-
          variant single, debt repaid
        text: |-
          This adjustment moved no collateral and repaid only {dust} {debt_symbol}, the interest accrued since the last touch.
      nochange.none:
        when: |-
          variant single, nothing repaid
        text: |-
          This adjustment moved no collateral and no debt.
      nochange.capped_run:
        when: |-
          variant run, the debt after is the minimum
        text: |-
          The debt sits at the {min_debt} {debt_symbol} minimum, so each repayment could clear only the interest since the touch before.
      nochange.capped:
        when: |-
          variant single, the debt after is the minimum
        text: |-
          The debt sits at the {min_debt} {debt_symbol} minimum, so a repayment could clear only the interest since the last touch.
      nochange.bot:
        when: |-
          always
        text: |-
          Repeated no-change adjustments like this usually come from an automated manager retrying an operation the protocol reduces to nothing.
    order:
      - nochange.run
      - nochange.run_repaid
      - nochange.dust
      - nochange.none
      - nochange.capped_run
      - nochange.capped
      - nochange.bot
      - same_block
    groups:
      happened: [nochange.run, nochange.dust, nochange.none, nochange.bot, same_block]
      adds_up: [nochange.run_repaid]
      leaves: [nochange.capped_run, nochange.capped]
    alternates:
      - [nochange.dust, nochange.none]

  - id: liquity2.adjust.rate
    title: |-
      Interest rate change
    when: |-
      adjustTroveInterestRate: the owner set a new rate
    L5: interest_rate
    variants:
      raised: |-
        the rate rose
      lowered: |-
        the rate fell
    L1:
      - - figure: label
      - - figure: rate_after
          rounding: rate
    sentences:
      rate.raised:
        when: |-
          variant raised
        text: |-
          This adjustment raised the interest rate to {rate_after}, so the trove pays more and sits later in the redemption queue.
      rate.lowered:
        when: |-
          variant lowered
        text: |-
          This adjustment lowered the interest rate to {rate_after}, so the trove pays less and sits earlier in the redemption queue.
      rate.fee:
        when: |-
          the change charged an upfront fee
        text: |-
          Changing the rate within 7 days of the last change added a {upfront_fee} {debt_symbol} fee to the debt.
    order:
      - rate.raised
      - rate.lowered
      - accrual.interest
      - accrual.batched
      - accrual.batched_fee
      - rate.fee
      - same_block
    groups:
      happened: [rate.raised, rate.lowered, same_block]
      adds_up: [accrual.interest, accrual.batched, accrual.batched_fee, rate.fee]

  - id: liquity2.redemption
    title: |-
      Redemption
    when: |-
      redeemCollateral, or a zombie trove's adjustZombieTrove / adjustUnredeemableZombieTrove
    L5: redemption
    variants:
      at_event: |-
        the event carries a redemption log
      no_detail: |-
        the event carries no redemption log
    L1:
      - - figure: label
      - - word: cleared
        - figure: debt_change
          symbol: debt_symbol
      - - word: reduced
        - figure: coll_change
          symbol: coll_symbol
    sentences:
      redeem.no_detail:
        when: |-
          variant no_detail
        text: |-
          The {coll_symbol} trove was redeemed.
      redeem.what:
        when: |-
          variant at_event
        text: |-
          A redeemer swapped {debt_cleared} {debt_symbol} for {coll_taken} {coll_symbol} of this trove’s collateral, clearing that much debt.
      redeem.result:
        when: |-
          variant at_event, the fee the trove kept reads at least $1
        text: |-
          This works like selling collateral at this price to repay debt; the P/L is the fee the trove kept.
      redeem.result_no_fee:
        when: |-
          variant at_event, the fee reads under $1
        text: |-
          This works like selling collateral at this price to repay the same amount of debt.
      redeem.why_batch:
        when: |-
          variant at_event, not a zombie, the trove is batched
        text: |-
          It was redeemed because its {rate_after} rate, set by batch manager {rate_setter}, was among the lowest in the {coll_symbol} branch.
      redeem.why_owner:
        when: |-
          variant at_event, not a zombie, the owner sets the rate
        text: |-
          It was redeemed because its {rate_after} rate was among the lowest in the {coll_symbol} branch.
      redeem.zombie_zero:
        when: |-
          variant at_event, a zombie with no debt left
        text: |-
          With no debt left, the trove stays open with its collateral as a zombie and accrues no interest.
      redeem.zombie_zero_next:
        when: |-
          variant at_event, a zombie with no debt left
        text: |-
          It can be closed by withdrawing the collateral, or re-activated by borrowing {min_debt} {debt_symbol} or more.
      redeem.zombie_low:
        when: |-
          variant at_event, a zombie with debt left
        text: |-
          The debt left is below the {min_debt} {debt_symbol} minimum, so the trove is now a zombie.
      redeem.zombie_low_next:
        when: |-
          variant at_event, a zombie with debt left
        text: |-
          It can be closed by repaying the debt and withdrawing the collateral, or restored by borrowing above the minimum.
    order:
      - redeem.no_detail
      - redeem.what
      - redeem.result
      - redeem.result_no_fee
      - redeem.why_batch
      - redeem.why_owner
      - redeem.zombie_zero
      - redeem.zombie_zero_next
      - redeem.zombie_low
      - redeem.zombie_low_next
      - same_block
    groups:
      happened: [redeem.no_detail, redeem.what, redeem.why_batch, redeem.why_owner, same_block]
      adds_up: [redeem.result, redeem.result_no_fee]
      leaves: [redeem.zombie_zero, redeem.zombie_zero_next, redeem.zombie_low, redeem.zombie_low_next]
    alternates:
      - [redeem.result, redeem.result_no_fee]
      - [redeem.why_batch, redeem.why_owner, redeem.zombie_zero, redeem.zombie_low]
      - [redeem.zombie_zero_next, redeem.zombie_low_next]

  - id: liquity2.delegation.join
    title: |-
      Join batch manager
    when: |-
      setInterestBatchManager
    L5: delegation
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: rate_after
          rounding: rate
      - - figure: rate_setter
    sentences:
      join.what:
        when: |-
          the batch manager is known
        text: |-
          This trove handed its interest rate to batch manager {manager}.
      join.what_plain:
        when: |-
          the batch manager is not known
        text: |-
          This trove handed its interest rate to a batch manager.
      join.fee:
        when: |-
          joining charged an upfront fee
        text: |-
          Joining the batch added a {upfront_fee} {debt_symbol} upfront fee to the debt.
      join.rate:
        when: |-
          the rate after is known
        text: |-
          The batch’s {rate_after} rate now sets the trove’s place in the redemption queue.
    order:
      - join.what
      - join.what_plain
      - join.fee
      - join.rate
      - same_block
    groups:
      happened: [join.what, join.what_plain, same_block]
      adds_up: [join.fee]
      leaves: [join.rate]
    alternates:
      - [join.what, join.what_plain]

  - id: liquity2.delegation.leave
    title: |-
      Leave batch manager
    when: |-
      removeFromBatch
    L5: delegation
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: rate_after
          rounding: rate
    sentences:
      leave.what:
        when: |-
          the batch manager is known
        text: |-
          This trove left batch manager {former_manager}, so the owner sets its interest rate again.
      leave.what_plain:
        when: |-
          the batch manager is not known
        text: |-
          This trove left its batch manager, so the owner sets its interest rate again.
      leave.fees:
        when: |-
          more than 0.01 of management fee accrued since the previous event
        text: |-
          About {accrued_fee} {debt_symbol} of batch management fees had accrued since the last operation.
      leave.fee:
        when: |-
          leaving charged an upfront fee
        text: |-
          Leaving the batch added a {upfront_fee} {debt_symbol} upfront fee to the debt.
      leave.rate:
        when: |-
          the rate moved
        text: |-
          The interest rate moved from the batch’s {rate_before} to the owner’s {rate_after}.
    order:
      - leave.what
      - leave.what_plain
      - leave.fees
      - leave.fee
      - leave.rate
      - same_block
    groups:
      happened: [leave.what, leave.what_plain, leave.rate, same_block]
      adds_up: [leave.fees, leave.fee]
    alternates:
      - [leave.what, leave.what_plain]

  - id: liquity2.delegation.rate_update
    title: |-
      Batch manager rate change
    when: |-
      setBatchManagerAnnualInterestRate: the trove's batch manager set the batch's rate
    L5: delegation
    variants:
      raised: |-
        the rate rose
      lowered: |-
        the rate fell
      kept: |-
        the rate held
    L1:
      - - figure: label
      - - figure: rate_after
          rounding: rate
      - - figure: rate_setter
      - - word: debt
        - figure: debt_move_abs
          sign: true
          symbol: debt_symbol
    sentences:
      bru.raised:
        when: |-
          variant raised
        text: |-
          The batch manager raised the delegated interest rate from {rate_before|rate_step} to {rate_after|rate_step} APR.
      bru.lowered:
        when: |-
          variant lowered
        text: |-
          The batch manager lowered the delegated interest rate from {rate_before|rate_step} to {rate_after|rate_step} APR.
      bru.kept:
        when: |-
          variant kept
        text: |-
          The batch manager kept the delegated interest rate at {rate_after} APR.
      bru.interest:
        when: |-
          the debt moved by 0.01 or more, interest of 0.005 or more
        text: |-
          Interest since the last event: {move_interest} {debt_symbol} at {move_rate}.
      bru.mgmt:
        when: |-
          the debt moved by 0.01 or more, management fee of 0.005 or more
        text: |-
          Management fee {move_fee} {debt_symbol} at the batch’s {move_fee_rate} a year.
      bru.upfront:
        when: |-
          the debt moved by 0.01 or more, the change fell inside the 7-day cooldown and left a remainder
        text: |-
          Upfront fee {move_upfront} {debt_symbol}: the manager changed the rate again within 7 days.
    order:
      - bru.raised
      - bru.lowered
      - bru.kept
      - bru.interest
      - bru.mgmt
      - bru.upfront
      - same_block
    groups:
      happened: [bru.raised, bru.lowered, bru.kept, same_block]
      adds_up: [bru.interest, bru.mgmt, bru.upfront]

  - id: liquity2.open
    title: |-
      Open trove
    when: |-
      openTrove or openTroveAndJoinBatch
    L5: open
    variants:
      self: |-
        the owner sets the rate
      join_batch: |-
        opened straight into a batch
    L1:
      - - figure: label
      - - word: supply
        - figure: coll_change
          symbol: coll_symbol
      - - word: borrow
        - figure: debt_change
          symbol: debt_symbol
      - - figure: rate_after
          rounding: rate
    sentences:
      open.what:
        when: |-
          always
        text: |-
          This trove opened, depositing {coll_after} {coll_symbol} as collateral and borrowing {principal} {debt_symbol} against it.
      open.rate:
        when: |-
          always
        text: |-
          Its {rate_after} interest rate sets its place in the {coll_symbol} redemption queue.
      open.join:
        when: |-
          variant join_batch, manager and fee known
        text: |-
          It joined batch manager {manager}, which sets its rate, for a {batch_fee_rate} management fee.
      open.join_no_fee:
        when: |-
          variant join_batch, no management fee
        text: |-
          It joined batch manager {manager}, which sets its rate.
      open.join_plain:
        when: |-
          variant join_batch, manager not known
        text: |-
          It joined a batch manager, which sets its rate.
    order:
      - open.what
      - liq.after
      - open.rate
      - open.join
      - open.join_no_fee
      - open.join_plain
      - same_block
    groups:
      happened: [open.what, open.join, open.join_no_fee, open.join_plain, same_block]
      leaves: [liq.after, open.rate]
    alternates:
      - [open.join, open.join_no_fee, open.join_plain]

  - id: liquity2.close
    title: |-
      Close trove
    when: |-
      closeTrove
    L5: close
    variants:
      repaid: |-
        the close repaid debt
      zero_debt: |-
        a redemption had already cleared the debt
    L1:
      - - figure: label
      - - figure: debt_change
          symbol: debt_symbol
      - - figure: coll_change
          symbol: coll_symbol
    sentences:
      close.repaid:
        when: |-
          variant repaid
        text: |-
          This transaction closed the trove, repaying {debt_repaid} {debt_symbol} of debt and returning {coll_retrieved} {coll_symbol} of collateral.
      close.zero:
        when: |-
          variant zero_debt
        text: |-
          This transaction closed the trove and returned {coll_retrieved} {coll_symbol} of collateral; redemptions had cleared its debt.
    order:
      - close.repaid
      - close.zero
      - same_block
    groups:
      happened: [close.repaid, close.zero, same_block]

  - id: liquity2.liquidation
    title: |-
      Liquidation
    when: |-
      liquidate
    L5: liquidation
    variants:
      destructive: |-
        this trove was liquidated
      redistribution_gain: |-
        another trove's liquidation redistributed collateral and debt onto this one
      no_detail: |-
        the event carries no liquidation log
    L1:
      - - figure: label
      - - word: liquidated
        - figure: coll_change
          symbol: coll_symbol
      - - word: cleared
        - figure: debt_change
          symbol: debt_symbol
      - - figure: surplus_l1
    sentences:
      liq.no_detail:
        when: |-
          variant no_detail
        text: |-
          The {coll_symbol} trove was liquidated.
      liq.gain.received:
        when: |-
          variant redistribution_gain
        text: |-
          Another trove’s liquidation passed this trove {redist_coll} {coll_symbol} of collateral and {redist_debt} {debt_symbol} of debt.
      liq.gain.net_pos:
        when: |-
          variant redistribution_gain, the collateral outweighed the debt
        text: |-
          The net effect was +{net_benefit}, the redistribution penalty working in this trove’s favour.
      liq.gain.net_neg:
        when: |-
          variant redistribution_gain, the debt outweighed the collateral
        text: |-
          The net effect was −{net_benefit}, a small cost.
      liq.gain.open:
        when: |-
          variant redistribution_gain
        text: |-
          The trove remains open, now carrying the inherited debt.
      liq.what:
        when: |-
          variant destructive
        text: |-
          This trove was liquidated: its collateral ratio had dropped to {cr_at_liquidation}, below the {mcr} liquidation line for {coll_symbol}.
      liq.surplus:
        when: |-
          variant destructive, a surplus, not claimed yet
        text: |-
          The borrower can claim the {coll_surplus} {coll_symbol} of collateral left after the debt and penalty.
      liq.surplus_claimed:
        when: |-
          variant destructive, the surplus since claimed
        text: |-
          The borrower claimed the {coll_surplus} {coll_symbol} of collateral left over on {claimed_at}.
      liq.surplus_claimed_undated:
        when: |-
          variant destructive, the surplus since claimed, date unknown
        text: |-
          The borrower has claimed the {coll_surplus} {coll_symbol} of collateral left over.
      liq.loss:
        when: |-
          variant destructive, the collateral was worth more than the debt
        text: |-
          After that surplus, the borrower’s estimated loss was about {est_loss}.
      liq.partial:
        when: |-
          variant destructive, the pool covered part
        text: |-
          The Stability Pool covered part of the debt; the rest was redistributed to other troves.
    order:
      - liq.no_detail
      - liq.gain.received
      - liq.gain.net_pos
      - liq.gain.net_neg
      - liq.gain.open
      - liq.what
      - liq.partial
      - liq.surplus
      - liq.surplus_claimed
      - liq.surplus_claimed_undated
      - liq.loss
      - same_block
    groups:
      happened: [liq.no_detail, liq.gain.received, liq.what, same_block]
      adds_up: [liq.gain.net_pos, liq.gain.net_neg, liq.partial]
      leaves: [liq.gain.open, liq.surplus, liq.surplus_claimed, liq.surplus_claimed_undated, liq.loss]
    alternates:
      - [liq.surplus, liq.surplus_claimed, liq.surplus_claimed_undated]

  - id: liquity2.apply_pending_debt
    title: |-
      Apply pending debt
    when: |-
      applyPendingDebt
    L5: interest_rate
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: debt_change
          symbol: debt_symbol
      - - figure: coll_change
          symbol: coll_symbol
    sentences:
      apply.what:
        when: |-
          no collateral arrived
        text: |-
          This event applied {redist_debt} {debt_symbol} of pending redistribution debt to the trove.
      apply.what_coll:
        when: |-
          collateral arrived too
        text: |-
          This event applied {redist_debt} {debt_symbol} of pending redistribution debt and {redist_coll} {coll_symbol} of collateral to the trove.
      apply.batch:
        when: |-
          a batch update rode with it
        text: |-
          A batch manager applied the trove’s accrued interest at the same time.
    order:
      - apply.what
      - apply.what_coll
      - apply.batch
      - same_block
    groups:
      happened: [apply.what, apply.what_coll, apply.batch, same_block]
    alternates:
      - [apply.what, apply.what_coll]

  - id: liquity2.transfer
    title: |-
      Transfer
    when: |-
      transferTrove: the trove NFT changed hands
    L5: transfer
    variants:
      transfer: |-
        a transfer between wallets
      mint: |-
        the NFT's mint
      burn: |-
        the NFT's burn
      no_detail: |-
        no transfer log
    L1:
      - - figure: label
    sentences:
      transfer.no_detail:
        when: |-
          variant no_detail
        text: |-
          The {coll_symbol} trove’s ownership was transferred.
      transfer.mint:
        when: |-
          variant mint
        text: |-
          The trove NFT was minted to {to_address}.
      transfer.burn:
        when: |-
          variant burn
        text: |-
          The trove NFT was burned from {from_address}.
      transfer.move:
        when: |-
          variant transfer
        text: |-
          The trove NFT moved from {from_address} to {to_address}.
      transfer.state:
        when: |-
          variant transfer, the trove holds something
        text: |-
          The new holder takes over {debt_after} {debt_symbol} of debt against {coll_after} {coll_symbol} of collateral, unchanged by the transfer.
    order:
      - transfer.no_detail
      - transfer.mint
      - transfer.burn
      - transfer.move
      - transfer.state
      - same_block
    groups:
      happened: [transfer.no_detail, transfer.mint, transfer.burn, transfer.move, same_block]
      leaves: [transfer.state]

  - id: liquity2.fallback
    title: |-
      Trove event
    when: |-
      any operation no other template takes
    L5: fallback
    variants:
      default: |-
        always
    L1:
      - - figure: label
    sentences:
      fallback.what:
        when: |-
          always
        text: |-
          This was a {operation} on the {coll_symbol} trove.
    order:
      - fallback.what
      - same_block
    groups:
      happened: [fallback.what, same_block]

# ── L5: the "?" modal, one per kind of event ──
#   title, intro           the heading and first paragraph
#   extraParagraphs        further paragraphs
#   detailsHeading,        a heading and its bullets, each a bold lead and its
#   details                text
#   links                  each a label and `faq`, an id the code resolves to
#                          Liquity's FAQ (FAQ_URLS)
# The interest-rate modal has `intro_delegated` and, on its first detail,
# `text_delegated`: what it says when a batch manager sets the trove's rate.
# The liquidation modal's intro reads {min_cr}, {max_ltv} and {coll_type}.
# Each concept that states a mechanism rests on a row of rails-ops
# reference/official-docs/liquity-v2.md, and its link is that row's page.
L5:
  adjust:
    title: |-
      How adjusting a trove works
    intro: |-
      An adjustment changes a trove without closing it. The owner can add or withdraw collateral, borrow more BOLD, or repay some of the debt.
    extraParagraphs:
      - |-
        Adding collateral or repaying makes the trove safer. Withdrawing collateral or borrowing more brings it closer to liquidation. An adjustment must keep the LTV under the branch maximum (90.91% for WETH, a 110% collateral ratio), or it is rejected.
      - |-
        Adjusting doesn't change the interest rate, which is a separate action. The rate matters because it decides how early the trove is redeemed against.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Upfront fee
        text: |-
          borrowing more adds a one-time fee of 7 days of the branch's average interest to the debt.
      - bold: |-
          Minimum debt
        text: |-
          a trove must keep at least 2,000 BOLD of debt while it is open.
      - bold: |-
          Redistribution
        text: |-
          when a branch's Stability Pool runs out, a liquidated trove's debt and collateral can pass to the other troves by their collateral.
    links:
      - label: |-
          How do I decide on my LTV?
        faq: LTV_COLLATERAL_RATIO
      - label: |-
          Are there other borrowing fees?
        faq: BORROWING_FEES
      - label: |-
          Is there a minimum debt?
        faq: MINIMUM_DEBT
      - label: |-
          What if the Stability Pool is empty?
        faq: STABILITY_POOL_EMPTY

  redemption:
    title: |-
      How redemptions work
    intro: |-
      Anyone holding BOLD can exchange it for $1 of collateral per BOLD. Bots redeem when BOLD trades below $1, which helps hold BOLD at its peg.
    extraParagraphs:
      - |-
        For the borrower, a redemption works like selling collateral at the current price to repay the same amount of debt. The redemption fee stays in the trove, so the loss at the time is small. The trove is left with less exposure to the collateral's price.
      - |-
        Troves are redeemed in order of interest rate, lowest first, so a higher rate pushes a trove further back in the queue.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Redemption fee
        text: |-
          a cut of the redeemed collateral that stays in the trove; it starts at 0.5% and rises with recent redemptions.
      - bold: |-
          Zombie trove
        text: |-
          a trove redeemed below 2,000 BOLD of debt stays open, dormant, until it is closed or borrows back above the minimum.
    links:
      - label: |-
          What are redemptions?
        faq: REDEMPTIONS
      - label: |-
          What happens if my Trove gets redeemed?
        faq: REDEMPTION_SELECTION
      - label: |-
          How can I stay protected?
        faq: REDEMPTION_PROTECTION
      - label: |-
          Is there a redemption fee?
        faq: REDEMPTION_FEE

  liquidation:
    title: |-
      How Liquidations Work
    intro: |-
      A trove can be liquidated once its collateral ratio falls below {min_cr} for {coll_type}, a maximum LTV of {max_ltv}. Anyone can trigger the liquidation.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Stability Pool
        text: |-
          each branch's pool of deposited BOLD pays off a liquidated trove's debt and receives its collateral.
      - bold: |-
          Penalty and surplus
        text: |-
          the borrower usually loses a 5% penalty and can claim the collateral left after the liquidation.
      - bold: |-
          Redistribution
        text: |-
          when the Stability Pool runs out, the rest of the debt and collateral can pass to the branch's other troves by their collateral.
      - bold: |-
          Gas compensation
        text: |-
          the liquidator receives 0.0375 WETH from the trove's gas deposit plus 0.5% of its collateral, capped at 2 units.
    links:
      - label: |-
          How do liquidations work?
        faq: LIQUIDATIONS
      - label: |-
          What is the maximum LTV?
        faq: MAX_LTV
      - label: |-
          What if the Stability Pool is empty?
        faq: STABILITY_POOL_EMPTY
      - label: |-
          How is a liquidator compensated?
        faq: LIQUIDATOR_COMPENSATION

  open:
    title: |-
      How Borrowing Works
    intro: |-
      Liquity V2 lets a borrower deposit collateral into a Trove and borrow BOLD against it. The interest rate set at opening decides redemption risk: a higher rate costs more and sits later in the redemption queue.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Collateral ratio
        text: |-
          the value of the collateral relative to the debt, which must stay above the branch minimum.
      - bold: |-
          Interest rate
        text: |-
          the borrower sets the rate or delegates it to a batch manager; lower rates cost less and are redeemed sooner.
      - bold: |-
          Upfront fee
        text: |-
          a one-time borrowing fee of 7 days of average interest, added to the Trove's debt.
      - bold: |-
          Liquidation reserve
        text: |-
          0.0375 ETH set aside to cover the gas of a liquidation, returned when the Trove is closed.
    links:
      - label: |-
          How do I decide on my LTV?
        faq: LTV_COLLATERAL_RATIO
      - label: |-
          Understanding borrowing fees
        faq: BORROWING_FEES
      - label: |-
          What is the liquidation reserve?
        faq: LIQUIDATION_RESERVE
      - label: |-
          How user-set interest rates work
        faq: USER_SET_RATES

  close:
    title: |-
      How Closing a Trove Works
    intro: |-
      Closing a trove repays its entire debt and returns the collateral, ending the position.
    # A close with no debt left (a redemption cleared it): intro_zero_debt and
    # text_zero_debt stand in for intro and text.
    intro_zero_debt: |-
      Closing a trove returns its collateral and ends the position.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Full repayment
        text: |-
          closing requires repaying the whole debt — principal plus accrued interest — in BOLD.
        text_zero_debt: |-
          closing repays whatever debt is left, in BOLD; a trove whose debt a redemption cleared has nothing to repay.
      - bold: |-
          Liquidation reserve
        text: |-
          the 0.0375 ETH gas reserve set aside when the trove opened is refunded on close.
      - bold: |-
          Trove NFT
        text: |-
          each trove is a separate NFT, and one address can hold several.
    links:
      - label: |-
          What is a Trove?
        faq: WHAT_IS_TROVE
      - label: |-
          What is the liquidation reserve?
        faq: LIQUIDATION_RESERVE
      - label: |-
          How many troves can I open with the same address?
        faq: NFT_TROVES

  interest_rate:
    title: |-
      How Interest Rates Work
    intro: |-
      Each trove carries an annual interest rate that is added to its debt over time. The borrower can change the rate at any time, or delegate it to a batch manager that sets one rate for many troves.
    intro_delegated: |-
      Each trove carries an annual interest rate that is added to its debt over time. This trove's rate is set by {delegate}, a batch manager that sets one rate for many troves.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Who sets the rate
        text: |-
          the borrower sets the rate or delegates it to a batch manager; lower rates cost less but sit earlier in the redemption queue.
        text_delegated: |-
          the batch manager sets the rate for every trove in its batch; lower rates cost less but sit earlier in the redemption queue.
      - bold: |-
          Continuous accrual
        text: |-
          interest is added to the debt as it accrues, with no repayment schedule.
      - bold: |-
          Premium on change
        text: |-
          changing the rate within 7 days of the last change adds a fee of 7 days of average interest.
    links:
      - label: |-
          How do user-set interest rates work?
        faq: USER_SET_RATES
      - label: |-
          Are there other borrowing fees?
        faq: BORROWING_FEES
      - label: |-
          What are redemptions?
        faq: REDEMPTIONS

  delegation:
    title: |-
      How Interest Delegation Works
    intro: |-
      A trove can hand its interest rate to a batch manager. The manager sets one rate for a group of troves and charges a management fee.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Batch manager
        text: |-
          a delegate that sets a single interest rate, within a preset range, for every trove in its batch.
      - bold: |-
          Management fee
        text: |-
          an annual fee, on top of the interest, that accrues to the debt as the delegate's compensation.
      - bold: |-
          Joining a batch
        text: |-
          the trove takes on the batch's rate and pays the upfront fee, which stops troves hopping between batches.
    links:
      - label: |-
          What is interest-rate delegation?
        faq: DELEGATION
      - label: |-
          How do user-set interest rates work?
        faq: USER_SET_RATES

  transfer:
    title: |-
      How Trove Transfers Work
    intro: |-
      A trove is an ERC-721 NFT, so its ownership can be transferred to another wallet like any other token.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Trove NFT
        text: |-
          ownership of the position is a transferable NFT — whoever holds it controls the trove.
      - bold: |-
          Transfer effects
        text: |-
          transferring the NFT hands full control of the collateral and debt to the new owner.
      - bold: |-
          Multiple troves
        text: |-
          one address can hold many troves, each a separate NFT and position.
    links:
      - label: |-
          How many troves can I open with the same address?
        faq: NFT_TROVES
      - label: |-
          What is a Trove?
        faq: WHAT_IS_TROVE

  fallback:
    title: |-
      How Liquity V2 Troves Work
    intro: |-
      Liquity V2 lets a borrower take out BOLD against collateral in a trove — a self-custodied position represented by an NFT.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Trove
        text: |-
          the borrowing position — collateral in, BOLD out, with a collateral ratio to keep above the threshold.
      - bold: |-
          Interest rate
        text: |-
          a user-set rate that accrues to the debt and sets the trove's place in the redemption queue.
      - bold: |-
          Redemptions
        text: |-
          BOLD can be redeemed for collateral at face value, starting with the lowest-rate troves.
    links:
      - label: |-
          What is a Trove?
        faq: WHAT_IS_TROVE
      - label: |-
          How do user-set interest rates work?
        faq: USER_SET_RATES
      - label: |-
          What are redemptions?
        faq: REDEMPTIONS
