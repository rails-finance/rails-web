    Open
  close: |-
    Close
  liquidated: |-
    Liquidated
  liquidation: |-
    Liquidation
  add: |-
    Add
  withdraw: |-
    Withdraw
  borrow: |-
    Borrow
  repay: |-
    Repay
  adjust: |-
    Adjust
  no_change: |-
    No change
  no_change_run: |-
    No change ×{run_count}
  rate_up: |-
    Increase interest rate
  rate_down: |-
    Decrease interest rate
  rate_change: |-
    Rate change
  apply_debt: |-
    Apply debt
  redemption: |-
    Redemption
  redeemed: |-
    Redeemed
  delegate: |-
    Delegate
  leave_delegate: |-
    Leave delegate
  transfer: |-
    Transfer
  batch_rate: |-
    Interest rate
  supply: |-
    Supply
  cleared: |-
    Cleared
  took: |-
    Took
  debt: |-
    Debt
  from_liquidation: |-
    From a liquidation
  and: |-
    and
  claimable: |-
    claimable
  claimed: |-
    claimable, claimed
  zombie: |-
    Zombie

# ── L2: the opened card's labels and sub-lines ──
L2_words:
  collateral: |-
    Collateral
  debt: |-
    Debt
  interest_rate: |-
    Interest Rate
  price: |-
    {coll_symbol} price
  # The Debt cell and line where the whole move is the accrual: "+8,580.12
  # interest = 667,073.79".
  accrual_move: |-
    +{accrued_total} {accrual_noun}
  # The Debt cell's sub-line where the owner acted and interest accrued: the
  # figure is the ledger's "since last event" line.
  accrual_in_ledger: |-
    with {accrual_noun}, in the ledger
  # L2's Debt line, the same case.
  accrual_since: |-
    +{accrued_total} {accrual_noun} since the last event is in the ledger
  # The Debt ledger's rows for the accrual since the previous event; the
  # earlier accrual is "Interest before", "Batch management fees before".
  ledger_interest_since: |-
    Interest since last event
  ledger_batch_fee_since: |-
    Batch management fees since last event
  interest: |-
    interest
  interest_and_fees: |-
    interest and fees
  fee: |-
    {upfront_fee} fee
  yearly_interest: |-
    {yearly_interest} {debt_symbol} / year interest
  excl_fee: |-
    , excl. management fee
  yearly_fee: |-
    + {batch_fee_rate} management fee · {yearly_fee} {debt_symbol} / year
  closed: |-
    CLOSED
  not_applicable: |-
    N/A
  redeemed_by: |-
    Redeemed by:
  pl: |-
    P/L
  or: |-
    or
  today: |-
    today
  claimable: |-
    claimable
  collateral_ratio: |-
    Collateral Ratio

# ── Copy for LLM: the block's context header ──
context_words:
  title: |-
    # Liquity V2 · {title} · {utc} UTC
  position: |-
    Liquity V2 · {chain} · {coll_symbol} trove {trove} · owner {owner}
  event: |-
    Event #{n} of {total} · tx {tx} · {url}
  prices: |-
    Prices are {coll_symbol} oracle prices at the time of the event unless marked "today". Not financial advice.
  chain_default: |-
    Ethereum
  owner_unknown: |-
    unknown

# ── The footer line ──
footer_words:
  gas: |-
    Gas {gas}
  gas_run: |-
    Gas across {run_count} transactions {gas}
  tx: |-
    tx {tx}
  block: |-
    block {block}

# ── Copy for LLM: the control and the block's words ──
copy_words:
  button: |-
    Copy for LLM
  copied: |-
    Copied
  button_label: |-
    Copy this event as Markdown for an AI assistant
  links: |-
    Links:
  below: |-
    (below)
  footer: |-
    Footer

# ── The event menu: the ⋮ at the right end of the price row ──
# Each row is a title and the line under it; a copy row's line reads `copied`
# for a moment after the copy. Copy for LLM reads copy_words; View as Markdown,
# after it, opens the text Copy for LLM copies, at the event page's URL with .md.
menu_words:
  menu: |-
    Event menu
  heading: |-
    Event
  view_page: |-
    View event page
  view_page_hint: |-
    Open this event's page
  view_explorer: |-
    View on Etherscan
  view_explorer_hint: |-
    Open the transaction's logs
  copy_link: |-
    Copy link to event page
  copy_link_hint: |-
    Copy the page's address
  view_markdown: |-
    View as Markdown
  view_markdown_hint: |-
    Open this event as Markdown

# ── The event page: the side column beside the card ──
# The column holds the paragraph, a table of facts the card does not show, and
# the previous, next and timeline links. The metadata description is
# `description`; {holder} is held_by or last_held_by (a closed Trove's owner is
# its last one).
page_words:
  paragraph: |-
    This page is one transaction; its figures are the Trove's state after it.
  description: |-
    One transaction from the {coll_symbol} Trove {trove}, {holder}: event {n|count} of {total|count}, on {day}. The figures are the Trove's state after it.
  held_by: |-
    held by {owner}
  last_held_by: |-
    last held by {owner}
  timeline_link: |-
    See the whole history in the timeline.
  branch: |-
    Branch
  trove: |-
    Trove
  holder: |-
    Holder
  last_holder: |-
    Last holder
  event: |-
    Event
  event_of: |-
    {n|count} of {total|count}
  block: |-
    Block
  copy_trove: |-
    Copy the Trove id
  copied: |-
    Copied
  in_timeline: |-
    See in timeline
  previous: |-
    Previous event
  next: |-
    Next event
  explanation_heading: |-
    Event explanation

# ── Words the L5 modals fill in ──
L5_words:
  coll_type_unknown: |-
    this collateral
  delegate_named: |-
    the {delegate_name} delegate
  delegate_unnamed: |-
    a batch-manager delegate

# ── Fragments: parts of a sentence the code joins ──
# redist.balance's {debt_terms} is these, in order, joined with spaces; {x} is
# the term's figure.
fragments:
  debt_term.repaid: |-
    − {x} repaid
  debt_term.borrowed: |-
    + {x} borrowed
  debt_term.fee: |-
    + {x} fee
  debt_term.redist: |-
    + {x} from the liquidation
  debt_term.interest: |-
    + {x} interest
  debt_term.interest_and_fees: |-
    + {x} interest and fees

# ── Shared sentences: said by more than one template ──
# Each has `when` (the condition under which the code says it) and `text`.
# A template says one only where its `order` lists it.
shared_sentences:
  market.fell:
    when: |-
      the price fell since the trove's previous event by at least a quarter of the room the trove had above the minimum
    text: |-
      {coll_symbol} had fallen {price_change} since the previous event, from {price_prev} to {price_at_event}.
  market.rose:
    when: |-
      the price rose by the same measure
    text: |-
      {coll_symbol} had risen {price_change} since the previous event, from {price_prev} to {price_at_event}.
  rate.moved:
    when: |-
      an adjustment also moved the rate
    text: |-
      The annual interest rate moved from {rate_before} to {rate_after}.
  redist.debt:
    when: |-
      the touch applied a redistribution of debt only
    text: |-
      Liquidations on the {coll_symbol} branch passed this trove {redist_debt} {debt_symbol} of debt since its last change, applied at this touch.
  redist.coll:
    when: |-
      the touch applied a redistribution of collateral only
    text: |-
      Liquidations on the {coll_symbol} branch passed this trove {redist_coll} {coll_symbol} of collateral since its last change, applied at this touch.
  redist.both:
    when: |-
      the touch applied a redistribution of both
    text: |-
      Liquidations on the {coll_symbol} branch passed this trove {redist_debt} {debt_symbol} of debt and {redist_coll} {coll_symbol} of collateral since its last change, applied at this touch.
  redist.balance:
    when: |-
      a redistribution of debt arrived with the touch
    text: |-
      Debt: {debt_before} before {debt_terms} = {debt_after} {debt_symbol}.
  fee.borrow:
    when: |-
      the adjustment charged an upfront fee
    text: |-
      Borrowing more charged a one-time fee of {upfront_fee} {debt_symbol}, equal to 7 days of average interest on the {coll_symbol} branch.
  accrual.interest:
    when: |-
      more than 0.01 accrued and the trove was not batched
    text: |-
      Interest of {accrued_total} {debt_symbol} accrued since the last operation.
  accrual.batched:
    when: |-
      more than 0.01 accrued on a batched trove
    text: |-
      Interest and fees of {accrued_total} {debt_symbol} accrued since the last operation.
  accrual.batched_fee:
    when: |-
      the same, with the management fee told apart
    text: |-
      Interest and fees of {accrued_total} {debt_symbol} accrued since the last operation, including a {accrued_fee} {debt_symbol} management fee.
  state.debt_now:
    when: |-
      the trove has debt after the event
    text: |-
      Its debt now stands at {debt_after} {debt_symbol}.
  state.cr:
    when: |-
      the trove has a ratio after the event
    text: |-
      The collateral ratio is {cr_after|ratio_pair}.
  liq.after:
    when: |-
      the liquidation price is below the event's price
    text: |-
      Liquidation would now come at {coll_symbol} {liq_price_after}, {liq_distance_after} below that price.
  liq.after_before:
    when: |-
      the same, where the liquidation price moved
    text: |-
      Liquidation would now come at {coll_symbol} {liq_price_after}, {liq_distance_after} below that price, against {liq_price_before} before.
  same_block:
    when: |-
      the block holds more than one of the trove's events
    text: |-
      This trove had {block_events} events in block {block}; this is {block_position}, in the order the block recorded them.

# ── Templates: one per kind of event ──
#   id         the template's id (the exports and the JSON route name it)
#   title      the Copy for LLM block's event label
#   when       the operations and state that select it
#   L5         the modal it opens (see L5 below)
#   variants   each variant's id and when it applies
#   L1         the header line: groups of words (an L1_words id) and figures (a
#              placeholder, with the token symbol after it); a group whose figure
#              the event lacks is left out
#   sentences  its sentences, each with `when` and `text`
#   order      the order the explanation says them in, shared sentences included
#   list       a liquidation's payout legs, said as a list under the sentences
templates:
  - id: liquity2.adjust.add_coll
    title: |-
      Add collateral
    when: |-
      adjustTrove that added collateral and moved no debt
    L5: adjust
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: coll_change
          symbol: coll_symbol
      - - word: from_liquidation
        - figure: redist_l1
    sentences:
      add.what:
        when: |-
          always
        text: |-
          The owner added {added} {coll_symbol} ({added_usd}) of collateral to the trove.
      add.safety:
        when: |-
          the ratio moved
        text: |-
          With more collateral behind the same debt, the trove is safer: its collateral ratio rose from {cr_before_same_price} to {cr_after}.
      add.liq_distance:
        when: |-
          the trove has debt before and after
        text: |-
          {coll_symbol} would now need to fall {liq_distance_after}, to about {liq_price_after}, before liquidation, compared with {liq_distance_before} before this deposit.
      add.rest:
        when: |-
          no redistribution arrived and the rate held
        text: |-
          Its debt and interest rate are unchanged.
    order:
      - add.what
      - add.safety
      - add.liq_distance
      - market.fell
      - market.rose
      - redist.debt
      - redist.coll
      - redist.both
      - redist.balance
      - add.rest
      - rate.moved
      - same_block

  - id: liquity2.adjust.withdraw_coll
    title: |-
      Withdraw collateral
    when: |-
      adjustTrove that withdrew collateral and moved no debt
    L5: adjust
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: coll_change
          symbol: coll_symbol
      - - word: from_liquidation
        - figure: redist_l1
    sentences:
      withdraw.what:
        when: |-
          always
        text: |-
          The owner withdrew {withdrawn} {coll_symbol} ({withdrawn_usd}) of collateral from the trove.
      withdraw.safety:
        when: |-
          the ratio moved
        text: |-
          With less collateral behind the same debt, the trove is less safe: its collateral ratio fell from {cr_before_same_price} to {cr_after}.
      withdraw.liq_distance:
        when: |-
          the trove has debt before and after
        text: |-
          {coll_symbol} would now need to fall {liq_distance_after}, to about {liq_price_after}, before liquidation, compared with {liq_distance_before} before this withdrawal.
      withdraw.margin_far:
        when: |-
          the ratio after is at least twice the minimum, no redistribution arrived and the rate held
        text: |-
          The trove stays far above the {mcr} minimum, and its debt and interest rate are unchanged.
      withdraw.margin:
        when: |-
          the ratio after is under twice the minimum, no redistribution arrived and the rate held
        text: |-
          The trove stays above the {mcr} minimum, and its debt and interest rate are unchanged.
    order:
      - withdraw.what
      - withdraw.safety
      - withdraw.liq_distance
      - market.fell
      - market.rose
      - redist.debt
      - redist.coll
      - redist.both
      - redist.balance
      - withdraw.margin_far
      - withdraw.margin
      - rate.moved
      - same_block

  - id: liquity2.adjust.borrow
    title: |-
      Borrow
    when: |-
      adjustTrove that borrowed more and moved no collateral
    L5: adjust
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: debt_change
          symbol: debt_symbol
      - - word: from_liquidation
        - figure: redist_l1
    sentences:
      borrow.what:
        when: |-
          always
        text: |-
          The owner borrowed {borrowed} {debt_symbol} more against the trove.
      borrow.safety:
        when: |-
          the ratio moved
        text: |-
          With more debt against the same collateral, the trove is less safe: its collateral ratio fell from {cr_before_same_price} to {cr_after}.
      borrow.liq_distance:
        when: |-
          the trove has debt before and after
        text: |-
          {coll_symbol} would now need to fall {liq_distance_after}, to about {liq_price_after}, before liquidation, compared with {liq_distance_before} before this borrow.
      borrow.margin_far:
        when: |-
          the ratio after is at least twice the minimum, no redistribution arrived and the rate held
        text: |-
          The trove stays far above the {mcr} minimum, and its collateral and interest rate are unchanged.
      borrow.margin:
        when: |-
          the ratio after is under twice the minimum, no redistribution arrived and the rate held
        text: |-
          The trove stays above the {mcr} minimum, and its collateral and interest rate are unchanged.
    order:
      - borrow.what
      - borrow.safety
      - borrow.liq_distance
      - market.fell
      - market.rose
      - fee.borrow
      - redist.debt
      - redist.coll
      - redist.both
      - redist.balance
      - borrow.margin_far
      - borrow.margin
      - rate.moved
      - same_block

  - id: liquity2.adjust.repay
    title: |-
      Repay
    when: |-
      adjustTrove that repaid debt and moved no collateral
    L5: adjust
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: debt_change
          symbol: debt_symbol
      - - word: from_liquidation
        - figure: redist_l1
    sentences:
      repay.what:
        when: |-
          always
        text: |-
          The owner repaid {repaid} {debt_symbol} of the trove’s debt.
      repay.safety:
        when: |-
          the ratio moved
        text: |-
          With less debt against the same collateral, the trove is safer: its collateral ratio rose from {cr_before_same_price} to {cr_after}.
      repay.liq_distance:
        when: |-
          the trove has debt before and after
        text: |-
          {coll_symbol} would now need to fall {liq_distance_after}, to about {liq_price_after}, before liquidation, compared with {liq_distance_before} before this repayment.
      repay.rest:
        when: |-
          no redistribution arrived and the rate held
        text: |-
          Its collateral and interest rate are unchanged.
    order:
      - repay.what
      - repay.safety
      - repay.liq_distance
      - market.fell
      - market.rose
      - redist.debt
      - redist.coll
      - redist.both
      - redist.balance
      - repay.rest
      - rate.moved
      - same_block

  - id: liquity2.adjust.combined
    title: |-
      Adjust trove
    when: |-
      adjustTrove that moved both collateral and debt
    L5: adjust
    variants:
      add_borrow: |-
        added collateral and borrowed
      add_repay: |-
        added collateral and repaid
      withdraw_borrow: |-
        withdrew collateral and borrowed
      withdraw_repay: |-
        withdrew collateral and repaid
    L1:
      - - figure: coll_label
        - figure: coll_change
          symbol: coll_symbol
      - - figure: debt_label
        - figure: debt_change
          symbol: debt_symbol
      - - word: from_liquidation
        - figure: redist_l1
    sentences:
      combined.what.add_borrow:
        when: |-
          variant add_borrow
        text: |-
          The owner added {added} {coll_symbol} ({added_usd}) of collateral and borrowed {borrowed} {debt_symbol} more.
      combined.what.add_repay:
        when: |-
          variant add_repay
        text: |-
          The owner added {added} {coll_symbol} ({added_usd}) of collateral and repaid {repaid} {debt_symbol} of debt.
      combined.what.withdraw_borrow:
        when: |-
          variant withdraw_borrow
        text: |-
          The owner withdrew {withdrawn} {coll_symbol} ({withdrawn_usd}) of collateral and borrowed {borrowed} {debt_symbol} more.
      combined.what.withdraw_repay:
        when: |-
          variant withdraw_repay
        text: |-
          The owner withdrew {withdrawn} {coll_symbol} ({withdrawn_usd}) of collateral and repaid {repaid} {debt_symbol} of debt.
      combined.safety_rose:
        when: |-
          the ratio rose
        text: |-
          Together, these changes raised the collateral ratio from {cr_before_same_price} to {cr_after}.
      combined.safety_fell:
        when: |-
          the ratio fell
        text: |-
          Together, these changes lowered the collateral ratio from {cr_before_same_price} to {cr_after}.
      combined.liq_distance:
        when: |-
          the trove has debt before and after
        text: |-
          {coll_symbol} would now need to fall {liq_distance_after}, to about {liq_price_after}, before liquidation, compared with {liq_distance_before} before this adjustment.
      combined.rate:
        when: |-
          the rate held
        text: |-
          Its interest rate is unchanged.
    order:
      - combined.what.add_borrow
      - combined.what.add_repay
      - combined.what.withdraw_borrow
      - combined.what.withdraw_repay
      - combined.safety_rose
      - combined.safety_fell
      - combined.liq_distance
      - market.fell
      - market.rose
      - fee.borrow
      - redist.debt
      - redist.coll
      - redist.both
      - redist.balance
      - combined.rate
      - rate.moved
      - same_block

  - id: liquity2.adjust.no_change
    title: |-
      No change
    when: |-
      adjustTrove that moved neither side past display precision, or the server's run of them
    L5: adjust
    variants:
      single: |-
        one touch
      run: |-
        a run of touches the server collapsed into one row
    L1:
      - - figure: label
    sentences:
      nochange.run:
        when: |-
          variant run
        text: |-
          This row stands in for {run_count} adjustments between {run_first} and {run_last}, every one of which left the trove unchanged.
      nochange.run_repaid:
        when: |-
          variant run, debt repaid
        text: |-
          Together they repaid {dust} {debt_symbol}, the interest that accrued between touches.
      nochange.dust:
        when: |-
          variant single, debt repaid
        text: |-
          This adjustment moved no collateral and repaid only {dust} {debt_symbol}, the interest that had accrued since the trove was last touched.
      nochange.none:
        when: |-
          variant single, nothing repaid
        text: |-
          This adjustment moved no collateral and no debt.
      nochange.at_min:
        when: |-
          the debt after is the minimum
        text: |-
          The debt sits at Liquity V2’s {min_debt} {debt_symbol} minimum.
      nochange.capped_run:
        when: |-
          variant run at the minimum
        text: |-
          A repayment stops at that floor unless it closes the trove, so every larger attempt in this stretch was capped at the interest accrued since the last touch.
      nochange.capped:
        when: |-
          variant single at the minimum
        text: |-
          A repayment stops at that floor unless it closes the trove, so any larger attempt was capped at the interest accrued since the last touch.
      nochange.bot:
        when: |-
          always
        text: |-
          Repeated no-change adjustments like this are typically sent by an automated manager retrying an operation the protocol clamps to nothing.
      nochange.gas:
        when: |-
          always
        text: |-
          Each attempt costs the sender only gas.
    order:
      - nochange.run
      - nochange.run_repaid
      - nochange.dust
      - nochange.none
      - nochange.at_min
      - nochange.capped_run
      - nochange.capped
      - nochange.bot
      - nochange.gas
      - same_block

  - id: liquity2.adjust.rate
    title: |-
      Interest rate change
    when: |-
      adjustTroveInterestRate: the owner set a new rate
    L5: interest_rate
    variants:
      raised: |-
        the rate rose
      lowered: |-
        the rate fell
    L1:
      - - figure: label
      - - figure: rate_after
          rounding: rate
    sentences:
      rate.raised:
        when: |-
          variant raised
        text: |-
          This adjustment raised the trove’s interest rate from {rate_before} to {rate_after} APR.
      rate.lowered:
        when: |-
          variant lowered
        text: |-
          This adjustment lowered the trove’s interest rate from {rate_before} to {rate_after} APR.
      rate.fee:
        when: |-
          the change charged an upfront fee
        text: |-
          An upfront fee of {upfront_fee} {debt_symbol} was added to the debt, because the rate changed within 7 days of the trove’s previous rate change; the fee equals 7 days of average interest.
      rate.coll:
        when: |-
          the trove holds priced collateral
        text: |-
          The collateral remains {coll_after} {coll_symbol} ({coll_after_usd}).
    order:
      - rate.raised
      - rate.lowered
      - accrual.interest
      - accrual.batched
      - accrual.batched_fee
      - rate.fee
      - state.debt_now
      - rate.coll
      - state.cr
      - same_block

  - id: liquity2.redemption
    title: |-
      Redemption
    when: |-
      redeemCollateral, or a zombie trove's adjustZombieTrove / adjustUnredeemableZombieTrove
    L5: redemption
    variants:
      price_lower_now: |-
        the collateral's price today is below its price at the redemption
      price_higher_now: |-
        the price today is far enough above it that the redeemed collateral would now be worth more than the debt it paid off
      at_event: |-
        no price today, or one that reads the same, or a rise smaller than the fee
      no_detail: |-
        the event carries no redemption log
    L1:
      - - figure: label
      - - word: cleared
        - figure: debt_change
          symbol: debt_symbol
      - - word: took
        - figure: coll_change
          symbol: coll_symbol
    sentences:
      redeem.no_detail:
        when: |-
          variant no_detail
        text: |-
          The {coll_symbol} trove was redeemed.
      redeem.what:
        when: |-
          always
        text: |-
          A redeemer exchanged {debt_cleared} {debt_symbol} for this trove’s {coll_symbol}, clearing that much debt and taking {coll_taken} {coll_symbol} ({coll_taken_usd}) of collateral.
      redeem.result:
        when: |-
          the fee the trove kept reads at least $1
        text: |-
          In effect, some collateral was sold at {price_at_event} to repay debt, and the trove kept a {redemption_result_usd} fee, so the owner came out slightly ahead.
      redeem.result_no_fee:
        when: |-
          the fee reads under $1
        text: |-
          In effect, some collateral was sold at {price_at_event} to repay the same amount of debt.
      redeem.today_lower:
        when: |-
          variant price_lower_now
        text: |-
          {coll_symbol} has since fallen to {price_today} today, so the redeemed {coll_symbol} would now be worth {redemption_vs_today_usd} less than the debt it paid off.
      redeem.today_higher:
        when: |-
          variant price_higher_now
        text: |-
          {coll_symbol} has since risen to {price_today} today, so if the trove had kept the redeemed {coll_symbol}, it would now be worth {redemption_vs_today_usd} more than the debt it paid off.
      redeem.why_batch:
        when: |-
          not a zombie, the trove is batched
        text: |-
          It was redeemed because its {rate_after} rate, set by batch manager {rate_setter}, was among the lowest in the {coll_symbol} branch.
      redeem.why_owner:
        when: |-
          not a zombie, the owner sets the rate
        text: |-
          It was redeemed because its {rate_after} rate was among the lowest in the {coll_symbol} branch.
      redeem.zero:
        when: |-
          the redemption cleared all the debt, not a zombie
        text: |-
          The trove now holds 0 {debt_symbol} of debt.
      redeem.zombie_zero:
        when: |-
          a zombie with no debt left
        text: |-
          The trove now holds 0 {debt_symbol} of debt and remains open with collateral only, a zero-debt zombie trove.
      redeem.zombie_zero_rate:
        when: |-
          a zombie with no debt left
        text: |-
          With no debt, interest accrual has stopped and the {rate_after} rate is inactive.
      redeem.zombie_zero_next:
        when: |-
          a zombie with no debt left
        text: |-
          It can be closed by withdrawing the remaining collateral, or re-activated by borrowing {min_debt} {debt_symbol} or more.
      redeem.zombie_low:
        when: |-
          a zombie with debt left
        text: |-
          The trove now holds {debt_after} {debt_symbol} of debt, a low-debt zombie trove below the {min_debt} {debt_symbol} minimum.
      redeem.zombie_low_queue:
        when: |-
          a zombie with debt left
        text: |-
          It is removed from the normal redemption order and may be prioritised in later redemptions to clear the below-minimum debt.
      redeem.zombie_low_rate:
        when: |-
          a zombie with debt left
        text: |-
          Interest keeps accruing at {rate_after}; if the debt later rises back above {min_debt} {debt_symbol}, the trove returns to normal behaviour.
      redeem.zombie_low_next:
        when: |-
          a zombie with debt left
        text: |-
          It can be resolved by repaying the remaining debt and withdrawing collateral to close it, or by borrowing more to bring the debt above {min_debt} {debt_symbol}.
    order:
      - redeem.no_detail
      - redeem.what
      - redeem.result
      - redeem.result_no_fee
      - redeem.today_lower
      - redeem.today_higher
      - redeem.why_batch
      - redeem.why_owner
      - redeem.zero
      - redeem.zombie_zero
      - redeem.zombie_zero_rate
      - redeem.zombie_zero_next
      - redeem.zombie_low
      - redeem.zombie_low_queue
      - redeem.zombie_low_rate
      - redeem.zombie_low_next
      - same_block

  - id: liquity2.delegation.join
    title: |-
      Join batch manager
    when: |-
      setInterestBatchManager
    L5: delegation
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: rate_after
          rounding: rate
      - - figure: rate_setter
    sentences:
      join.what:
        when: |-
          the batch manager is known
        text: |-
          This trove delegated its interest-rate management to {manager}.
      join.what_plain:
        when: |-
          the batch manager is not known
        text: |-
          This trove delegated its interest-rate management.
      join.debt_accrued:
        when: |-
          the debt moved and interest accrued
        text: |-
          Its debt updated from {debt_before} {debt_symbol} to {debt_after} {debt_symbol}, reflecting accrued interest.
      join.debt_moved:
        when: |-
          the debt moved, nothing accrued
        text: |-
          Its debt updated from {debt_before} {debt_symbol} to {debt_after} {debt_symbol}.
      join.debt_same:
        when: |-
          the debt held
        text: |-
          Its debt is unchanged at {debt_after} {debt_symbol}.
      join.fee:
        when: |-
          joining charged an upfront fee
        text: |-
          An upfront fee of {upfront_fee} {debt_symbol} was added to the debt: joining a batch charges the upfront fee, 7 days of interest at the branch’s average rate.
      join.coll:
        when: |-
          the trove holds collateral
        text: |-
          The collateral remains {coll_after} {coll_symbol}.
      join.rate:
        when: |-
          the rate after is known
        text: |-
          The trove now accrues at a delegated rate of {rate_after} APR.
    order:
      - join.what
      - join.what_plain
      - join.debt_accrued
      - join.debt_moved
      - join.debt_same
      - join.fee
      - join.coll
      - join.rate
      - state.cr
      - same_block

  - id: liquity2.delegation.leave
    title: |-
      Leave batch manager
    when: |-
      removeFromBatch
    L5: delegation
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: rate_after
          rounding: rate
    sentences:
      leave.what:
        when: |-
          the batch manager is known
        text: |-
          This trove left its batch manager and returned to managing its own interest rate, formerly delegated to {former_manager}.
      leave.what_plain:
        when: |-
          the batch manager is not known
        text: |-
          This trove left its batch manager and returned to managing its own interest rate.
      leave.fees:
        when: |-
          more than 0.01 of management fee accrued since the previous event
        text: |-
          About {accrued_fee} {debt_symbol} of batch management fees had accrued.
      leave.fee:
        when: |-
          leaving charged an upfront fee
        text: |-
          An upfront fee of {upfront_fee} {debt_symbol} was added to the debt, because leaving a delegate within 7 days of the trove’s previous rate change counts as a rate change; the fee equals 7 days of average interest.
      leave.coll:
        when: |-
          the trove holds priced collateral
        text: |-
          The collateral is {coll_after} {coll_symbol} ({coll_after_usd}).
      leave.rate:
        when: |-
          the rate moved
        text: |-
          The rate moved from {rate_before} to a self-set {rate_after}.
    order:
      - leave.what
      - leave.what_plain
      - leave.fees
      - leave.fee
      - state.debt_now
      - leave.coll
      - leave.rate
      - state.cr
      - same_block

  - id: liquity2.delegation.rate_update
    title: |-
      Batch manager rate change
    when: |-
      setBatchManagerAnnualInterestRate: the trove's batch manager set the batch's rate
    L5: delegation
    variants:
      raised: |-
        the rate rose
      lowered: |-
        the rate fell
      kept: |-
        the rate held
    L1:
      - - figure: label
      - - figure: rate_after
          rounding: rate
      - - figure: rate_setter
      - - word: debt
        - figure: debt_move_abs
          sign: true
          symbol: debt_symbol
    sentences:
      bru.raised:
        when: |-
          variant raised
        text: |-
          The batch manager raised the delegated interest rate from {rate_before|rate_step} to {rate_after|rate_step} APR.
      bru.lowered:
        when: |-
          variant lowered
        text: |-
          The batch manager lowered the delegated interest rate from {rate_before|rate_step} to {rate_after|rate_step} APR.
      bru.kept:
        when: |-
          variant kept
        text: |-
          The batch manager kept the delegated interest rate at {rate_after} APR.
      bru.move:
        when: |-
          the debt moved by 0.01 or more and the previous event and batch fee are known
        text: |-
          Debt {debt_move} {debt_symbol} since {prev_date}, the trove’s previous event.
      bru.interest:
        when: |-
          interest of 0.005 or more
        text: |-
          Interest {move_interest} {debt_symbol} at {move_rate} over {move_span}.
      bru.mgmt:
        when: |-
          management fee of 0.005 or more
        text: |-
          Management fee {move_fee} {debt_symbol} at the batch’s {move_fee_rate} a year.
      bru.upfront:
        when: |-
          the change fell inside the 7-day cooldown and left a remainder
        text: |-
          Upfront fee {move_upfront} {debt_symbol}: the manager changed the rate again within 7 days.
      bru.setter:
        when: |-
          the batch manager is known
        text: |-
          The rate is set by the delegate {manager_address}.
      bru.debt:
        when: |-
          the trove has debt
        text: |-
          The trove’s debt now stands at {debt_after} {debt_symbol}.
      bru.coll:
        when: |-
          the trove holds priced collateral
        text: |-
          Its collateral is {coll_after} {coll_symbol} ({coll_after_usd|usd_cents}).
      bru.cr:
        when: |-
          the trove has a ratio
        text: |-
          The collateral ratio is {cr_after|ratio}.
    order:
      - bru.raised
      - bru.lowered
      - bru.kept
      - bru.move
      - bru.interest
      - bru.mgmt
      - bru.upfront
      - bru.setter
      - bru.debt
      - bru.coll
      - bru.cr
      - same_block

  - id: liquity2.open
    title: |-
      Open trove
    when: |-
      openTrove or openTroveAndJoinBatch
    L5: open
    variants:
      self: |-
        the owner sets the rate
      join_batch: |-
        opened straight into a batch
    L1:
      - - figure: label
      - - word: supply
        - figure: coll_change
          symbol: coll_symbol
      - - word: borrow
        - figure: debt_change
          symbol: debt_symbol
      - - figure: rate_after
          rounding: rate
    sentences:
      open.what:
        when: |-
          always
        text: |-
          This trove opened, depositing {coll_after} {coll_symbol} as collateral and borrowing {principal} {debt_symbol} against it.
      open.fee:
        when: |-
          opening charged an upfront fee
        text: |-
          A one-time borrowing fee of {upfront_fee} {debt_symbol} was added to the debt, equivalent to 7 days of average interest.
      open.debt_fee:
        when: |-
          opening charged an upfront fee
        text: |-
          Its total initial debt stands at {debt_after} {debt_symbol}, including that fee.
      open.debt:
        when: |-
          no upfront fee
        text: |-
          Its total initial debt stands at {debt_after} {debt_symbol}.
      open.reserve:
        when: |-
          always
        text: |-
          A 0.0375 ETH liquidation reserve is set aside on open and returned when the trove closes.
      open.value:
        when: |-
          the event carries a price
        text: |-
          At the price at the time, that collateral is worth {coll_after_usd} ({coll_symbol} at {price_at_event}).
      open.cr:
        when: |-
          always
        text: |-
          The trove opened at a {cr_after|ratio_pair} collateral ratio.
      open.rate:
        when: |-
          always
        text: |-
          It accrues interest at {rate_after} a year, added to the debt as it accrues.
      open.join:
        when: |-
          variant join_batch, manager and fee known
        text: |-
          The trove joined a batch manager on open, delegating its rate to {manager} at {batch_rate} APR, with a {batch_fee_rate} management fee.
      open.join_no_fee:
        when: |-
          variant join_batch, no management fee
        text: |-
          The trove joined a batch manager on open, delegating its rate to {manager} at {batch_rate} APR.
      open.join_plain:
        when: |-
          variant join_batch, manager not known
        text: |-
          The trove joined a batch manager on open.
    order:
      - open.what
      - open.fee
      - open.debt_fee
      - open.debt
      - open.reserve
      - open.value
      - open.cr
      - liq.after
      - open.rate
      - open.join
      - open.join_no_fee
      - open.join_plain
      - same_block

  - id: liquity2.close
    title: |-
      Close trove
    when: |-
      closeTrove
    L5: close
    variants:
      repaid: |-
        the close repaid debt
      zero_debt: |-
        a redemption had already cleared the debt
    L1:
      - - figure: label
      - - figure: debt_change
          symbol: debt_symbol
      - - figure: coll_change
          symbol: coll_symbol
    sentences:
      close.repaid:
        when: |-
          variant repaid
        text: |-
          This transaction closed the trove, repaying its {debt_repaid} {debt_symbol} of debt in full.
      close.zero:
        when: |-
          variant zero_debt
        text: |-
          This transaction closed the trove; its debt was already zero, so nothing was repaid.
      close.coll:
        when: |-
          always
        text: |-
          The borrower retrieved all {coll_retrieved} {coll_symbol} of collateral.
      close.reserve:
        when: |-
          always
        text: |-
          The 0.0375 ETH liquidation reserve was returned.
      close.rate:
        when: |-
          variant repaid, a rate before
        text: |-
          Before closing, the trove was paying {rate_before} annual interest.
      close.cr:
        when: |-
          variant repaid, a ratio before
        text: |-
          It closed at a {cr_before} collateral ratio.
      close.nft:
        when: |-
          always
        text: |-
          The trove NFT was sent to the burn address, ending its ownership.
      close.nothing:
        when: |-
          always
        text: |-
          Nothing remains on either side.
    order:
      - close.repaid
      - close.zero
      - close.coll
      - close.reserve
      - close.rate
      - close.cr
      - close.nft
      - close.nothing
      - same_block

  - id: liquity2.liquidation
    title: |-
      Liquidation
    when: |-
      liquidate
    L5: liquidation
    variants:
      destructive: |-
        this trove was liquidated
      redistribution_gain: |-
        another trove's liquidation redistributed collateral and debt onto this one
      no_detail: |-
        the event carries no liquidation log
    L1:
      - - figure: label
      - - word: liquidated
        - figure: coll_change
          symbol: coll_symbol
      - - word: cleared
        - figure: debt_change
          symbol: debt_symbol
      - - figure: surplus_l1
    sentences:
      liq.no_detail:
        when: |-
          variant no_detail
        text: |-
          The {coll_symbol} trove was liquidated.
      liq.gain.what:
        when: |-
          variant redistribution_gain
        text: |-
          Another trove’s liquidation redistributed part of its collateral and debt onto this one.
      liq.gain.received:
        when: |-
          variant redistribution_gain, priced
        text: |-
          This trove received {redist_coll} {coll_symbol} from the liquidated trove (about {redist_coll_usd} at the price at the time).
      liq.gain.received_unpriced:
        when: |-
          variant redistribution_gain, no price
        text: |-
          This trove received {redist_coll} {coll_symbol} from the liquidated trove.
      liq.gain.inherited:
        when: |-
          variant redistribution_gain
        text: |-
          It inherited {redist_debt} {debt_symbol} of debt in proportion to its collateral.
      liq.gain.net_pos:
        when: |-
          variant redistribution_gain, the collateral outweighed the debt
        text: |-
          The net effect was +{net_benefit}, the redistribution penalty working in this trove’s favour.
      liq.gain.net_neg:
        when: |-
          variant redistribution_gain, the debt outweighed the collateral
        text: |-
          The net effect was −{net_benefit}, a small cost.
      liq.gain.why:
        when: |-
          variant redistribution_gain
        text: |-
          The redistribution happened because the Stability Pool could not fully cover the liquidation.
      liq.gain.cr:
        when: |-
          variant redistribution_gain, both ratios known
        text: |-
          Its collateral ratio moved from {cr_before} to {cr_after|ratio_pair}.
      liq.gain.open:
        when: |-
          variant redistribution_gain
        text: |-
          The trove remains open, now carrying the inherited debt.
      liq.what:
        when: |-
          variant destructive
        text: |-
          This trove was liquidated: its collateral ratio had dropped to {cr_at_liquidation}, below the {mcr} liquidation line for {coll_symbol}.
      liq.debt:
        when: |-
          variant destructive
        text: |-
          Its {debt_cleared} {debt_symbol} of debt was cleared.
      liq.coll:
        when: |-
          variant destructive
        text: |-
          {coll_liquidated} {coll_symbol} of collateral was liquidated, worth {coll_liquidated_usd} at the price at the time.
      liq.surplus:
        when: |-
          variant destructive, a surplus, not claimed yet
        text: |-
          The collateral’s value exceeded the debt, so {coll_surplus} {coll_symbol} of surplus ({coll_surplus_usd}) remains claimable by the borrower.
      liq.surplus_claimed:
        when: |-
          variant destructive, the surplus since claimed
        text: |-
          The collateral’s value exceeded the debt, so {coll_surplus} {coll_symbol} of surplus ({coll_surplus_usd}) was left claimable by the borrower, who claimed it on {claimed_at}.
      liq.surplus_claimed_undated:
        when: |-
          variant destructive, the surplus since claimed, date unknown
        text: |-
          The collateral’s value exceeded the debt, so {coll_surplus} {coll_symbol} of surplus ({coll_surplus_usd}) was left claimable by the borrower, who claimed it.
      liq.loss:
        when: |-
          variant destructive, the collateral was worth more than the debt
        text: |-
          After that surplus, the borrower’s estimated loss was about {est_loss}.
      liq.partial:
        when: |-
          variant destructive, the pool covered part
        text: |-
          The Stability Pool could not fully cover the liquidation, so part of the debt was redistributed to other troves.
      liq.leg.sp:
        when: |-
          variant destructive, collateral went to the pool
        text: |-
          The Stability Pool received {coll_to_sp} {coll_symbol} ({coll_to_sp_usd}).
      liq.leg.gas_comp:
        when: |-
          variant destructive, collateral gas compensation
        text: |-
          The liquidator received {coll_gas_comp} {coll_symbol} in gas compensation.
      liq.leg.gas_weth:
        when: |-
          variant destructive
        text: |-
          The liquidator received 0.0375 WETH in gas compensation.
      liq.leg.incentive:
        when: |-
          variant destructive, debt cleared
        text: |-
          The liquidator received {incentive_coll} {coll_symbol} ({incentive_usd}) as the 5% liquidation incentive.
      liq.leg.nft:
        when: |-
          variant destructive
        text: |-
          The trove NFT was burned in the liquidation.
    order:
      - liq.no_detail
      - liq.gain.what
      - liq.gain.received
      - liq.gain.received_unpriced
      - liq.gain.inherited
      - liq.gain.net_pos
      - liq.gain.net_neg
      - liq.gain.why
      - liq.gain.cr
      - liq.gain.open
      - liq.what
      - liq.debt
      - liq.coll
      - liq.surplus
      - liq.surplus_claimed
      - liq.surplus_claimed_undated
      - liq.loss
      - liq.partial
      - same_block
    list:
      - liq.leg.sp
      - liq.leg.gas_comp
      - liq.leg.gas_weth
      - liq.leg.incentive
      - liq.leg.nft

  - id: liquity2.apply_pending_debt
    title: |-
      Apply pending debt
    when: |-
      applyPendingDebt
    L5: interest_rate
    variants:
      default: |-
        always
    L1:
      - - figure: label
      - - figure: debt_change
          symbol: debt_symbol
      - - figure: coll_change
          symbol: coll_symbol
    sentences:
      apply.what:
        when: |-
          no collateral arrived
        text: |-
          This event applied {redist_debt} {debt_symbol} of pending redistribution debt to the trove.
      apply.what_coll:
        when: |-
          collateral arrived too
        text: |-
          This event applied {redist_debt} {debt_symbol} of pending redistribution debt to the trove, along with {redist_coll} {coll_symbol} of redistributed collateral.
      apply.batch:
        when: |-
          a batch update rode with it
        text: |-
          A batch manager applied the trove’s accrued interest at the same time.
      apply.coll:
        when: |-
          the trove holds priced collateral
        text: |-
          The collateral is unchanged at {coll_after} {coll_symbol} ({coll_after_usd}).
      apply.coll_unpriced:
        when: |-
          the trove holds collateral, no price
        text: |-
          The collateral is unchanged at {coll_after} {coll_symbol}.
      apply.rate:
        when: |-
          always
        text: |-
          Interest accrues at {rate_after} a year.
    order:
      - apply.what
      - apply.what_coll
      - apply.batch
      - state.debt_now
      - apply.coll
      - apply.coll_unpriced
      - apply.rate
      - state.cr
      - same_block

  - id: liquity2.transfer
    title: |-
      Transfer
    when: |-
      transferTrove: the trove NFT changed hands
    L5: transfer
    variants:
      transfer: |-
        a transfer between wallets
      mint: |-
        the NFT's mint
      burn: |-
        the NFT's burn
      no_detail: |-
        no transfer log
    L1:
      - - figure: label
    sentences:
      transfer.no_detail:
        when: |-
          variant no_detail
        text: |-
          The {coll_symbol} trove’s ownership was transferred.
      transfer.mint:
        when: |-
          variant mint
        text: |-
          The trove NFT was minted to {to_address}.
      transfer.burn:
        when: |-
          variant burn
        text: |-
          The trove NFT was burned from {from_address}.
      transfer.move:
        when: |-
          variant transfer
        text: |-
          The trove NFT moved from {from_address} to {to_address}.
      transfer.state:
        when: |-
          variant transfer, the trove holds something, priced
        text: |-
          The transferred trove holds {debt_after} {debt_symbol} of debt against {coll_after} {coll_symbol} of collateral, at a {cr_after|ratio_pair} ratio and a {rate_after} interest rate ({coll_symbol} at {price_at_event}).
      transfer.state_unpriced:
        when: |-
          variant transfer, the trove holds something, no price
        text: |-
          The transferred trove holds {debt_after} {debt_symbol} of debt against {coll_after} {coll_symbol} of collateral, at a {cr_after|ratio_pair} ratio and a {rate_after} interest rate.
      transfer.unchanged:
        when: |-
          variant transfer
        text: |-
          The trove’s debt and collateral balances are unchanged by the transfer.
    order:
      - transfer.no_detail
      - transfer.mint
      - transfer.burn
      - transfer.move
      - transfer.state
      - transfer.state_unpriced
      - transfer.unchanged
      - same_block

  - id: liquity2.fallback
    title: |-
      Trove event
    when: |-
      any operation no other template takes
    L5: fallback
    variants:
      default: |-
        always
    L1:
      - - figure: label
    sentences:
      fallback.what:
        when: |-
          always
        text: |-
          This was a {operation} on the {coll_symbol} trove.
    order:
      - fallback.what
      - same_block

# ── L5: the "?" modal, one per kind of event ──
#   title, intro           the heading and first paragraph
#   extraParagraphs        further paragraphs
#   detailsHeading,        a heading and its bullets, each a bold lead and its
#   details                text
#   video                  a video's label, link and description
#   links                  each a label and either `faq` (an id the code resolves
#                          to Liquity's FAQ) or `url`
# The interest-rate modal has `intro_delegated` and, on its first detail,
# `text_delegated`: what it says when a batch manager sets the trove's rate.
# The liquidation modal's intro reads {min_cr}, {max_ltv} and {coll_type}.
L5:
  adjust:
    title: |-
      How adjusting a trove works
    intro: |-
      An adjustment changes a trove without closing it. The owner can add or withdraw collateral, borrow more BOLD, or repay some of the debt.
    extraParagraphs:
      - |-
        Adding collateral or repaying makes the trove safer. Withdrawing collateral or borrowing more brings it closer to liquidation, and borrowing more adds a one-time fee. Every adjustment must leave the collateral ratio above the branch minimum (110% for WETH), or the transaction is rejected.
      - |-
        Adjusting doesn't change the interest rate, which is a separate action. The rate matters because it decides how early the trove is redeemed against.
    links:
      - label: |-
          How do I decide on my collateral ratio?
        faq: LTV_COLLATERAL_RATIO
      - label: |-
          Are there other borrowing fees?
        faq: BORROWING_FEES
      - label: |-
          What is a Trove?
        faq: WHAT_IS_TROVE

  redemption:
    title: |-
      How redemptions work
    intro: |-
      Anyone holding BOLD can exchange it for $1 of collateral per BOLD. Because the swap happens at face value, bots redeem whenever BOLD trades below $1, which helps hold BOLD at its peg.
    extraParagraphs:
      - |-
        For the borrower, a redemption works like selling some collateral at the current price to repay the same amount of debt, plus a small fee kept in the trove. It isn't a loss at the time, but it leaves the owner with less exposure to the collateral's price.
      - |-
        Troves are redeemed in order of interest rate, lowest first, so a higher rate pushes a trove further back in the queue.
    video:
      label: |-
        9 min video
      url: https://www.youtube.com/watch?v=CQVmjFx987A
      description: |-
        Watch this video on redemptions from Liquity to understand how they work and how to manage redemption risk.
    links:
      - label: |-
          What are redemptions?
        faq: REDEMPTIONS
      - label: |-
          What happens if my Trove gets redeemed?
        faq: REDEMPTION_SELECTION
      - label: |-
          How can I stay protected?
        url: https://docs.liquity.org/v2-faq/redemptions-and-delegation#how-can-i-stay-protected
      - label: |-
          Is there a redemption fee?
        url: https://docs.liquity.org/v2-faq/redemptions-and-delegation#is-there-a-redemption-fee

  liquidation:
    title: |-
      How Liquidations Work
    intro: |-
      Troves become eligible for liquidation when the collateral ratio falls below the minimum threshold ({min_cr} for {coll_type}, equivalent to a maximum {max_ltv} LTV). Once eligible, anyone can trigger a liquidation transaction.
    extraParagraphs:
      - |-
        If the Stability Pool has sufficient BOLD, it absorbs the debt and receives the collateral. Otherwise, debt and collateral are redistributed proportionally to other active borrowers in the same market.
      - |-
        Liquidators receive a 5% incentive on the debt cleared, plus a gas compensation of 0.0375 WETH. Any remaining collateral above what is needed to cover debt + penalty is claimable by the original borrower as surplus.
    links:
      - label: |-
          How do liquidations work?
        faq: LIQUIDATIONS
      - label: |-
          What is the liquidation threshold?
        faq: LIQUIDATIONS
      - label: |-
          How does the Stability Pool work?
        faq: LIQUIDATIONS

  open:
    title: |-
      How Borrowing Works
    intro: |-
      Liquity V2 allows users to borrow BOLD (a decentralized stablecoin) by depositing collateral into a Trove. The Trove is represented by an NFT that provides full control over the position. The interest rate set at opening determines redemption risk — higher rates provide better protection against redemptions but cost more over time.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Collateral ratio
        text: |-
          the value of the collateral relative to the debt. Must stay above the liquidation threshold.
      - bold: |-
          Interest rate
        text: |-
          the borrower sets the rate, or delegates it to a batch manager. Lower rates save money but increase redemption risk.
      - bold: |-
          Upfront fee
        text: |-
          a one-time borrowing fee equivalent to 7 days of average interest, added to the Trove's debt.
      - bold: |-
          Liquidation reserve
        text: |-
          0.0375 ETH set aside to incentivise liquidators. Refunded when the Trove is closed.
    video:
      label: |-
        video guide
      url: https://www.youtube.com/watch?v=o1miCKLIPYs
      description: |-
        Learn how to borrow on Liquity and manage a Trove effectively.
    links:
      - label: |-
          What is a Trove?
        faq: WHAT_IS_TROVE
      - label: |-
          Understanding borrowing fees
        faq: BORROWING_FEES
      - label: |-
          What is the liquidation reserve?
        faq: LIQUIDATION_RESERVE
      - label: |-
          How user-set interest rates work
        faq: USER_SET_RATES

  close:
    title: |-
      How Closing a Trove Works
    intro: |-
      Closing a trove repays its entire debt and returns the collateral, ending the position. The trove's NFT is burned once it closes.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Full repayment
        text: |-
          closing requires repaying the whole debt — principal plus accrued interest — in BOLD.
      - bold: |-
          Liquidation reserve
        text: |-
          the 0.0375 ETH gas reserve set aside when the trove opened is refunded on close.
      - bold: |-
          Trove NFT
        text: |-
          the NFT representing the position is burned when the trove closes, freeing the slot.
    links:
      - label: |-
          What is a Trove?
        faq: WHAT_IS_TROVE
      - label: |-
          What is the liquidation reserve?
        faq: LIQUIDATION_RESERVE
      - label: |-
          How many troves can I open with the same address?
        faq: NFT_TROVES

  interest_rate:
    title: |-
      How Interest Rates Work
    intro: |-
      Each trove carries an annual interest rate that accrues continuously to its debt. The borrower can change the rate at any time, or delegate that to a batch manager that runs one shared rate for a group of troves.
    intro_delegated: |-
      Each trove carries an annual interest rate that accrues continuously to its debt. This trove's rate is managed by {delegate} the borrower appointed, which sets one shared rate across a group of troves; the borrower can take back direct control by removing the trove from the batch.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Who sets the rate
        text: |-
          the borrower sets the rate, or delegates it to a batch manager. Lower rates cost less but sit earlier in the redemption queue.
        text_delegated: |-
          the appointed delegate sets the rate on the borrower's behalf, until the borrower leaves the batch. Lower rates cost less but sit earlier in the redemption queue.
      - bold: |-
          Continuous accrual
        text: |-
          interest compounds onto the principal over time rather than being charged upfront.
      - bold: |-
          Premium on change
        text: |-
          changing the rate soon after the last adjustment can incur an upfront premium, discouraging rate-gaming.
    links:
      - label: |-
          How do user-set interest rates work?
        faq: USER_SET_RATES
      - label: |-
          What are redemptions?
        faq: REDEMPTIONS

  delegation:
    title: |-
      How Interest Delegation Works
    intro: |-
      A trove can delegate interest-rate management to a batch manager — a delegate that sets one shared rate for a group of troves and charges a management fee.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Batch manager
        text: |-
          a delegate that sets a single interest rate applied to every trove in its batch.
      - bold: |-
          Management fee
        text: |-
          an annual fee, on top of the interest, that accrues to the debt as the delegate's compensation.
      - bold: |-
          Joining & leaving
        text: |-
          a trove can join or exit a batch at any time; leaving returns rate control to the owner.
    links:
      - label: |-
          What is interest-rate delegation?
        faq: DELEGATION
      - label: |-
          How do user-set interest rates work?
        faq: USER_SET_RATES

  transfer:
    title: |-
      How Trove Transfers Work
    intro: |-
      A trove is an ERC-721 NFT, so its ownership can be transferred to another wallet like any other token.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Trove NFT
        text: |-
          ownership of the position is a transferable NFT — whoever holds it controls the trove.
      - bold: |-
          Transfer effects
        text: |-
          transferring the NFT hands full control of the collateral and debt to the new owner.
      - bold: |-
          Multiple troves
        text: |-
          one address can hold many troves, each a separate NFT and position.
    links:
      - label: |-
          How many troves can I open with the same address?
        faq: NFT_TROVES
      - label: |-
          What is a Trove?
        faq: WHAT_IS_TROVE

  fallback:
    title: |-
      How Liquity V2 Troves Work
    intro: |-
      Liquity V2 lets a borrower take out BOLD against collateral in a trove — a self-custodied position represented by an NFT.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Trove
        text: |-
          the borrowing position — collateral in, BOLD out, with a collateral ratio to keep above the threshold.
      - bold: |-
          Interest rate
        text: |-
          a user-set rate that accrues to the debt and sets the trove's place in the redemption queue.
      - bold: |-
          Redemptions
        text: |-
          BOLD can be redeemed for collateral at face value, starting with the lowest-rate troves.
    links:
      - label: |-
          What is a Trove?
        faq: WHAT_IS_TROVE
      - label: |-
          How do user-set interest rates work?
        faq: USER_SET_RATES
      - label: |-
          What are redemptions?
        faq: REDEMPTIONS
