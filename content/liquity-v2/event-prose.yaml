# Liquity V2 event prose: every string an event prints on the trove page and in
# its Copy for LLM block. The page, the Copy for LLM block and the test exports
# read this file and nothing else; the code chooses which strings to say and
# fills their figures (lib/liquity/event-prose.ts).
#
# How to edit
#   Each string sits on the line below its `|-`, indented. Write it as it should
#   read: colons, apostrophes, quotes, percent signs and dashes need no escaping.
#   Keep each string on one line, keep its indentation, and leave the ids (the
#   words before a colon) as they are.
#
# Placeholders
#   {name} is a figure the code fills in, printed at the rounding the
#   `placeholders` section gives it; {name|rounding} prints it at another
#   rounding for that string alone (the `roundings` section lists them). Keep the
#   braces and the name; move a placeholder anywhere in its string.
#
# After an edit, `pnpm check:prose` confirms the file parses, every id the code
# reads is here, and every placeholder is one the code supplies.

# ── Roundings: how a placeholder's figure is printed ──
roundings:
  coll: |-
    collateral at the decimals the card's ledger prints (772.334); four places where the page has no ledger
  coll_trim: |-
    the same, trailing zeros dropped (125, 0.497)
  debt: |-
    whole units from 1,000 up (1,056,120), up to two places below (843.5)
  accrued: |-
    two places, grouped (2.20)
  accrued_signed: |-
    two places with a + or − sign (+258.54)
  amount: |-
    whole units from 1,000 up, four places from 1, more below 1 so the figure never reads 0
  usd: |-
    whole dollars ($4,490); under $0.01 reads < $0.01
  usd_about: |-
    from $10,000: 'about' and the nearest thousand (about $561,000); below, whole dollars ($2,222)
  usd_cents: |-
    dollars and cents ($2,221.83); under $0.01 reads < $0.01
  ratio: |-
    two places (328.34%)
  ratio_whole: |-
    whole percent (328%); two places where before and after would read alike
  ratio_pair: |-
    the collateral ratio and its LTV at two places (328.34% (LTV 30.46%)); the viewer's ratio setting bolds one
  rate: |-
    an annual rate at the protocol's two places (1.71%)
  rate_step: |-
    a rate change at two places, widened until before and after read apart (4.12% → 4.115%)
  pct_whole: |-
    whole percent of a fraction (0.665 → 66%), unsigned
  pct3: |-
    three places (0.512%)
  count: |-
    a whole number, grouped (23,267,256)
  compact: |-
    the header's compact form (125, 2.2K, 1.1M, 0.4974)
  date: |-
    a UTC day (1 Sep 2025)
  day_short: |-
    a short UTC day (Sep 1; with the year when not this year)
  span: |-
    hours under a day (5 hours), else days at one place (3.2 days)
  manager: |-
    the batch manager's name and short address (ARM (0xe507…b60a)), linked to the explorer
  address: |-
    a short address (0xf060…45f8), linked to the explorer
  text: |-
    a word or name as given

# ── Placeholders: each name, its default rounding and what it stands for ──
placeholders:
  coll_symbol:
    rounding: text
    means: |-
      the branch's collateral token (WETH, wstETH, rETH)
  debt_symbol:
    rounding: text
    means: |-
      the debt token (BOLD)
  label:
    rounding: text
    means: |-
      the header's event label
  coll_change:
    rounding: compact
    means: |-
      the collateral the event moved, as the header prints it
  debt_change:
    rounding: compact
    means: |-
      the debt the event moved, as the header prints it
  coll_label:
    rounding: text
    means: |-
      Add or Withdraw, on a row that moved both sides
  debt_label:
    rounding: text
    means: |-
      Borrow or Repay, on a row that moved both sides
  redist_l1:
    rounding: text
    means: |-
      a redistribution the touch applied, as the header prints it
  surplus_l1:
    rounding: text
    means: |-
      a liquidation's claimable surplus, as the header prints it
  debt_move_abs:
    rounding: compact
    means: |-
      the debt's move on a batch rate change, as the header prints it
  mcr:
    rounding: pct_whole
    means: |-
      the branch's minimum collateral ratio (110% for WETH)
  min_debt:
    rounding: count
    means: |-
      Liquity V2's minimum debt (2,000 BOLD)
  price_at_event:
    rounding: usd
    means: |-
      the collateral's oracle price at the event's block
  price_prev:
    rounding: usd
    means: |-
      the collateral's oracle price at the trove's previous event
  price_change:
    rounding: pct_whole
    means: |-
      the price's move since the previous event, as a fraction
  price_today:
    rounding: usd
    means: |-
      the collateral's oracle price today (redemption only)
  cr_before:
    rounding: ratio_pair
    means: |-
      collateral ratio before the event, percent
  cr_before_same_price:
    rounding: ratio_whole
    means: |-
      collateral ratio before the event at this event's price, percent
  cr_after:
    rounding: ratio_whole
    means: |-
      collateral ratio after the event, percent
  cr_at_liquidation:
    rounding: ratio_pair
    means: |-
      collateral ratio at the liquidation's price, percent
  liq_price_before:
    rounding: usd
    means: |-
      the price at which the trove would reach the minimum, before
  liq_price_after:
    rounding: usd
    means: |-
      the price at which the trove would reach the minimum, after
  liq_distance_before:
    rounding: pct_whole
    means: |-
      how far the price would have to fall to liquidation, before
  liq_distance_after:
    rounding: pct_whole
    means: |-
      how far the price would have to fall to liquidation, after
  added:
    rounding: coll_trim
    means: |-
      collateral the owner added
  added_usd:
    rounding: usd_about
    means: |-
      that collateral at the event's price
  withdrawn:
    rounding: coll_trim
    means: |-
      collateral the owner withdrew
  withdrawn_usd:
    rounding: usd_about
    means: |-
      that collateral at the event's price
  borrowed:
    rounding: debt
    means: |-
      debt the owner borrowed
  repaid:
    rounding: debt
    means: |-
      debt the owner repaid
  upfront_fee:
    rounding: debt
    means: |-
      the upfront fee added to the debt
  accrued_total:
    rounding: accrued
    means: |-
      interest and any management fee accrued since the previous event
  accrued_fee:
    rounding: accrued
    means: |-
      the management fee part of it
  debt_before:
    rounding: debt
    means: |-
      the trove's debt before the event
  debt_after:
    rounding: debt
    means: |-
      the trove's debt after the event
  coll_after:
    rounding: coll
    means: |-
      the trove's collateral after the event
  coll_after_usd:
    rounding: usd
    means: |-
      that collateral at the event's price
  rate_before:
    rounding: rate
    means: |-
      the annual interest rate before the event
  rate_after:
    rounding: rate
    means: |-
      the annual interest rate after the event
  rate_setter:
    rounding: text
    means: |-
      the batch manager's name, where a batch manager sets the rate
  manager:
    rounding: manager
    means: |-
      the batch manager
  former_manager:
    rounding: address
    means: |-
      the batch manager the trove left
  manager_address:
    rounding: address
    means: |-
      the batch manager
  batch_rate:
    rounding: rate
    means: |-
      the batch's rate on joining
  batch_fee_rate:
    rounding: rate
    means: |-
      the batch's annual management fee on joining
  redist_debt:
    rounding: debt
    means: |-
      debt a liquidated trove's redistribution passed to this one
  redist_coll:
    rounding: coll
    means: |-
      collateral a liquidated trove's redistribution passed to this one
  redist_coll_usd:
    rounding: usd_cents
    means: |-
      that collateral at the event's price
  debt_terms:
    rounding: text
    means: |-
      the debt's move, term by term (FRAGMENTS)
  net_benefit:
    rounding: usd_cents
    means: |-
      redistributed collateral at the price less the debt inherited, unsigned
  debt_cleared:
    rounding: debt
    means: |-
      debt the event cleared
  coll_taken:
    rounding: coll_trim
    means: |-
      collateral a redemption took
  coll_taken_usd:
    rounding: usd
    means: |-
      that collateral at the redemption's price
  redemption_result_usd:
    rounding: usd
    means: |-
      debt cleared less the collateral taken at the redemption's price: the fee the trove kept
  redemption_vs_today_usd:
    rounding: usd
    means: |-
      debt cleared less the collateral taken at today's price, unsigned
  coll_liquidated:
    rounding: coll
    means: |-
      collateral the liquidation took
  coll_liquidated_usd:
    rounding: usd
    means: |-
      that collateral at the liquidation's price
  coll_surplus:
    rounding: coll
    means: |-
      collateral left to the borrower above the debt and penalty
  coll_surplus_usd:
    rounding: usd_cents
    means: |-
      that surplus at the liquidation's price
  claimed_at:
    rounding: date
    means: |-
      when the borrower claimed the surplus
  est_loss:
    rounding: usd_cents
    means: |-
      the borrower's estimated loss after the surplus
  coll_to_sp:
    rounding: coll
    means: |-
      collateral sent to the Stability Pool
  coll_to_sp_usd:
    rounding: usd_cents
    means: |-
      that collateral at the liquidation's price
  coll_gas_comp:
    rounding: coll
    means: |-
      collateral paid to the liquidator as gas compensation
  incentive_coll:
    rounding: coll
    means: |-
      the 5% liquidation incentive, in collateral
  incentive_usd:
    rounding: usd_cents
    means: |-
      that incentive in dollars
  principal:
    rounding: debt
    means: |-
      debt borrowed on open, before the upfront fee
  debt_repaid:
    rounding: debt
    means: |-
      debt a close repaid
  coll_retrieved:
    rounding: coll
    means: |-
      collateral a close returned
  dust:
    rounding: amount
    means: |-
      the debt a no-change adjustment repaid
  run_count:
    rounding: count
    means: |-
      how many no-change adjustments the row stands for
  run_first:
    rounding: day_short
    means: |-
      the first of them
  run_last:
    rounding: day_short
    means: |-
      the last of them
  debt_move:
    rounding: accrued_signed
    means: |-
      the debt's move since the trove's previous event
  prev_date:
    rounding: date
    means: |-
      the trove's previous event
  move_interest:
    rounding: accrued
    means: |-
      interest over that span
  move_rate:
    rounding: rate
    means: |-
      the rate in force over that span
  move_span:
    rounding: span
    means: |-
      the time since the previous event
  move_fee:
    rounding: accrued
    means: |-
      management fee over that span
  move_fee_rate:
    rounding: rate
    means: |-
      the batch's management fee in force over that span
  move_upfront:
    rounding: accrued
    means: |-
      the upfront fee: the rest of the move
  block:
    rounding: count
    means: |-
      the event's block
  block_events:
    rounding: count
    means: |-
      how many of this trove's events the block holds
  block_position:
    rounding: text
    means: |-
      this event's place among them (1 of 2)
  from_address:
    rounding: address
    means: |-
      the NFT's previous holder
  to_address:
    rounding: address
    means: |-
      the NFT's new holder
  operation:
    rounding: text
    means: |-
      the contract operation's name

