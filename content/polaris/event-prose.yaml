# Polaris prose: every string an event's explanation, the position card's
# explanation and the "?" modals print on a Polaris page. The page reads this
# file and nothing else; the code chooses which strings to say and fills their
# figures (lib/polaris/event-prose.ts for an event,
# components/protocol/polaris/polaris-position-explanation.tsx for the position
# card).
#
# How to edit
#   Each string sits on the line below its `|-`, indented. Write it as it should
#   read: colons, apostrophes, quotes, percent signs and dashes need no escaping.
#   Keep each string on one line, keep its indentation, and leave the ids (the
#   words before a colon) as they are.
#
# Placeholders
#   {name} is a figure the code fills in, printed at the rounding the
#   `placeholders` section gives it; {name|rounding} prints it at another
#   rounding for that string alone. Keep the braces and the name; move a
#   placeholder anywhere in its string.
#
# Limits
#   Every string here is held to rails-ops standards/prose-limits-and-zones.md:
#   `pnpm check:prose-limits` fails a bullet over 20 words or 2 figures, a modal
#   over 200 words, and the rest of the standard's section 2. `pnpm check:prose`
#   confirms the file parses, every id the code reads is here, and every
#   placeholder is one the code supplies.

# ── Roundings: how a placeholder's figure is printed ──
roundings:
  token: |-
    three places, grouped, never a false zero (6,500.123, <0.000001)
  units4: |-
    up to four places (0.0375)
  number: |-
    three places, grouped, signed (6,500.123)
  token_signed: |-
    three places, grouped, with its sign (+6,500.123, −6,098.142)
  units4_signed: |-
    up to four places, with its sign (+0.0375, −1.6499)
  pct_whole: |-
    whole percent of a fraction (0.32 → 32%), unsigned
  ratio_frac: |-
    a ratio given as a fraction, as a percent at two places (0.0258 → 2.58%)
  count: |-
    a whole number, grouped (1,204)
  address: |-
    a shortened address linked to the explorer
  tx_hash: |-
    a shortened transaction hash linked to the explorer
  date_time: |-
    a UTC date and time (5 Sep 2026, 09:30 UTC)
  text: |-
    a word or name as given

# ── Placeholders: each name, its default rounding and what it stands for ──
placeholders:
  coll_change:
    rounding: token
    means: |-
      the pETH the event moved, as the header prints it
  debt_change:
    rounding: token
    means: |-
      the debt the event moved, as the header prints it
  stable:
    rounding: text
    means: |-
      the market's stablecoin (USDp or GOLDp)
  zero_mint:
    rounding: token
    means: |-
      the debt the protocol added so the debt settled at zero
  escrow:
    rounding: units4
    means: |-
      the fixed gas compensation a CDP escrows at its open
  legs:
    rounding: text
    means: |-
      the legs written in at this touch, named (interest, stability gains, reward pETH)
  mcr:
    rounding: pct_whole
    means: |-
      the market's normal-mode minimum collateral ratio
  penalty:
    rounding: pct_whole
    means: |-
      the liquidation penalty the protocol applied on this path
  from_addr:
    rounding: address
    means: |-
      the address that held the CDP before a transfer
  to_addr:
    rounding: address
    means: |-
      the address that holds it after
  event_type:
    rounding: text
    means: |-
      the event's type as the index names it
  surplus:
    rounding: units4
    means: |-
      the pETH the liquidation credited to the owner in the market's surplus pool
  claimed_at:
    rounding: date_time
    means: |-
      when the owner claimed the surplus, in UTC
  claim_tx:
    rounding: tx_hash
    means: |-
      the transaction of the owner's claim, linked to the explorer
  # The position card's figures, drawn by the card with their receipts.
  coll:
    rounding: token
    means: |-
      the pETH the CDP holds now
  debt:
    rounding: token
    means: |-
      the debt the CDP owes now
  price:
    rounding: token
    means: |-
      the feed's price of one pETH, in the market's stablecoin
  worth:
    rounding: token
    means: |-
      the collateral at that price
  equity:
    rounding: number
    means: |-
      the collateral at the feed's price less the debt
  drop:
    rounding: pct_whole
    means: |-
      how far pETH's price can fall before the CDP reaches the minimum
  defensive:
    rounding: pct_whole
    means: |-
      the minimum collateral ratio in defensive mode
  primary:
    rounding: ratio_frac
    means: |-
      the market's primary rate now, a yearly figure
  secondary:
    rounding: ratio_frac
    means: |-
      the market's secondary rate now, a yearly figure
  transfers:
    rounding: count
    means: |-
      the transfers of the CDP's NFT since it opened
  deposited:
    rounding: token
    means: |-
      the pETH the holder deposited over the CDP's life
  withdrawn:
    rounding: token
    means: |-
      the pETH the holder withdrew over its life
  borrowed:
    rounding: token
    means: |-
      the stablecoin the holder borrowed over its life
  repaid:
    rounding: token
    means: |-
      the stablecoin the holder repaid over its life
  interest:
    rounding: token
    means: |-
      the interest charged over its life
  seized:
    rounding: token
    means: |-
      the pETH the liquidation seized
  cleared:
    rounding: token
    means: |-
      the debt the liquidation cleared
  psm_coll_in:
    rounding: token
    means: |-
      the pETH the CDP's PSM shares added to its collateral over its life
  psm_debt_in:
    rounding: token
    means: |-
      the stablecoin the CDP's PSM shares added to its debt over its life
  psm_coll_out:
    rounding: token
    means: |-
      the pETH the CDP's PSM shares removed from its collateral over its life
  psm_debt_out:
    rounding: token
    means: |-
      the stablecoin the CDP's PSM shares removed from its debt over its life
  psm_coll:
    rounding: units4_signed
    means: |-
      the pETH the PSM share settled at this touch, signed as it moved the collateral
  psm_debt:
    rounding: token_signed
    means: |-
      the stablecoin the PSM share settled at this touch, signed as it moved the debt
  psm_net:
    rounding: token
    means: |-
      the PSM share's two legs netted in the stablecoin at this block's pETH price, unsigned

# ── The event explanation's group headings, in the order the pane shows them ──
group_words:
  happened: |-
    What happened
  adds_up: |-
    How it adds up
  leaves: |-
    Where it leaves the position

# ── Words the code puts into a sentence or between a list's items ──
words:
  and: |-
    and
  # The official docs' names beside ours (docs.polaris.finance, pAsset
  # Minting): our label names the chain leg, the docs' name the mechanism a
  # reader arriving from the Polaris app looks for. Drawn after the leg's
  # label in the live window's lines and the card's tips.
  docs_psm: |-
    (the peg-defence fees, in the docs)
  docs_gain: |-
    (from the Protocol Safety Rate, in the docs)
  docs_reward: |-
    (the pETH yield to minters, in the docs)
  # The timeline head (rails-ops decision 0045, TO-DO-ui-jobs 367): the kind as
  # a past participle, then at most one present-tense clause for what the
  # spine cannot show, each after the middle dot. The spine carries the
  # figures. A touch that moved neither collateral nor debt is the docs' touch.
  t1_sep: |-
    ·
  t1_opened: |-
    Opened CDP
  t1_closed: |-
    Closed CDP
  t1_added_coll: |-
    Added collateral
  t1_withdrew_coll: |-
    Withdrew collateral
  t1_borrowed: |-
    Borrowed
  t1_repaid: |-
    Repaid
  t1_touched: |-
    Touched CDP
  t1_liquidated: |-
    Liquidated
  t1_claimable: |-
    claimable
  t1_claimed: |-
    claimed
  t1_surplus: |-
    surplus
  t1_transferred: |-
    Transferred
  t1_to: |-
    to
  # A touch the holder did not send: its sender after the kind (ui-jobs 404).
  t1_by: |-
    by
  # The liquidation's notes: who liquidated the CDP.
  liquidated_by: |-
    Liquidated by
  leg_interest: |-
    interest
  leg_gain: |-
    stability gains
  leg_reward: |-
    reward pETH
  # T2's balance sheet (ui-jobs 330): the event's rows, the Risk and Limits
  # rows and the words for a figure the sheet cannot state.
  sheet_open: |-
    Open
  sheet_close: |-
    Close
  sheet_add: |-
    Add
  sheet_withdraw: |-
    Withdraw
  sheet_borrow: |-
    Borrow
  sheet_repay: |-
    Repay
  sheet_reward: |-
    Reward pETH
  sheet_psm: |-
    PSM share written
  sheet_stability_gain: |-
    Stability gain
  sheet_settled: |-
    Settled to zero
  sheet_liquidated_coll: |-
    Taken by the liquidation
  sheet_liquidated_debt: |-
    Cleared by the liquidation
  sheet_liquidated: |-
    Liquidated
  sheet_liq_coll_pool: |-
    Of which to the stability pool
  sheet_liq_coll_redistributed: |-
    Of which redistributed to other CDPs
  sheet_liq_coll_liquidator: |-
    Of which to the liquidator (0.5%)
  sheet_liq_coll_surplus: |-
    Of which surplus for the owner to claim
  sheet_liq_debt_pool: |-
    Debt absorbed by the pool
  sheet_liq_debt_redistributed: |-
    Debt redistributed
  sheet_closed: |-
    Closed
  sheet_no_debt: |-
    No debt
  sheet_no_price: |-
    No price read at this block
  sheet_no_rate: |-
    No rate set yet
  sheet_not_read: |-
    Not read on this page
  collateral_ratio: |-
    Collateral ratio
  liquidates_at: |-
    Liquidates at
  primary_rate: |-
    Primary rate
  reserve_to_debt: |-
    Reserve-to-debt ratio
  minimum_ratio: |-
    Minimum ratio
  liquidation_penalty: |-
    Liquidation penalty, stability pool
  # The sheet's read-more, one per row: what the figure is and where it is read.
  tip_coll_last: |-
    The CDP's pETH after its previous event, from the CDPManager's log, in dollars at that event's pETH price.
  tip_coll_market: |-
    The change the pETH price made to the dollar value of the CDP's pETH between its previous event and this one.
  tip_coll_before: |-
    The CDP's pETH just before this event: what the previous event left, at this block's pETH price.
  tip_coll_event: |-
    The pETH the holder moved at this event, from the CDPManager's log, at this block's pETH price.
  tip_coll_liquidated: |-
    The pETH the liquidation took from the CDP, from the CDPManager's log. What it left over the debt's value, less the penalty, is the holder's to claim.
  tip_coll_reward: |-
    The reward pETH the CDP's share of the bonding curve's rewards added to its collateral at this event, from the CDPManager's log.
  tip_coll_psm: |-
    This touch wrote the CDP's share of the pETH the market's PSM moved since the previous event, from the CDPManager's log; the row beneath it sets out the gap.
  tip_coll_total: |-
    The CDP's pETH after this event, from the CDPManager's log, in dollars at this block's pETH price.
  tip_debt_last: |-
    The CDP's debt after its previous event, from the CDPManager's log, in dollars at the stablecoin's price then.
  tip_debt_market: |-
    The change the stablecoin's dollar price made to the debt's value between the previous event and this one. A USDp is $1 at every block; a GOLDp follows XAU/USD.
  tip_debt_interest: |-
    The interest charged into the debt since the previous event, from the CDPManager's log.
  tip_debt_interest_asset: |-
    The interest in the market's stablecoin, valued at its price at this block.
  tip_debt_before: |-
    The debt just before this event: the previous event's debt plus the interest charged since.
  tip_debt_event: |-
    The stablecoin the holder borrowed or repaid at this event, from the CDPManager's log.
  tip_debt_liquidated: |-
    The debt the liquidation cleared from the CDP, from the CDPManager's log.
  tip_debt_gain: |-
    The CDP's share of the market's revenue, credited against the debt at this event, from the CDPManager's log.
  tip_debt_psm: |-
    This touch wrote the CDP's share of the debt the market's PSM moved since the previous event, from the CDPManager's log; the row beneath it sets out the gap.
  tip_debt_settled: |-
    The stablecoin added so the debt lands on zero when the gains and the PSM share clear more than was owed, from the CDPManager's log.
  tip_debt_total: |-
    The CDP's debt after this event, from the CDPManager's log, in dollars at the stablecoin's price at this block.
  tip_cr: |-
    The collateral's value divided by the debt after this event, both in the market's stablecoin, at the market's pETH price at this block.
  tip_cr_liquidated: |-
    The collateral's value divided by the debt when the liquidation fired, both in the market's stablecoin, at the market's pETH price at this block: below the minimum.
  tip_liq_coll_pool: |-
    The seized pETH the stability pool received: the seizure less the liquidator's share and the owner's surplus, from the CDPManager's log.
  tip_liq_coll_redistributed: |-
    The seized pETH shared out to the market's other CDPs, from the CDPManager's log.
  tip_liq_coll_liquidator: |-
    The liquidator's 0.5% of the seized pETH, from the CDPManager's log.
  tip_liq_coll_surplus: |-
    The pETH left over the debt's value and the penalty, set aside for the owner to claim, from the CDPManager's log.
  # The gas-compensation escrow: its own spine row, held apart from the
  # collateral (rails-ops TO-DO-ui-jobs 363). Its footnote under Risk and Limits (TO-DO-ui-jobs 388).
  tip_escrow_note: |-
    The gas compensation escrow: the 0.0375 pETH every CDP sends at its open, held apart from its collateral and outside the collateral ratio. It returns on close and goes to the liquidator on a liquidation.
  spine_escrow_sent: |-
    gas compensation escrow sent
  spine_escrow_returned: |-
    gas compensation escrow returned
  ledger_escrow: |-
    Gas compensation escrow, held apart from the collateral
  ledger_escrow_sent: |-
    Sent at the open
  ledger_escrow_returned: |-
    Returned at the close
  ledger_escrow_paid: |-
    Paid to the liquidator
  ledger_escrow_held: |-
    Held
  tip_liq_debt_pool: |-
    The debt the stability pool absorbed, from the CDPManager's log.
  tip_liq_debt_redistributed: |-
    The debt shared out to the market's other CDPs, from the CDPManager's log.
  tip_liquidates_at: |-
    The pETH price, in the market's stablecoin, at which the CDP's collateral ratio meets the minimum: the debt times the minimum ratio, divided by the collateral.
  tip_primary_rate: |-
    The part of the market's interest rate that follows its stablecoin's peg, set by the market and read from its last rate event at this block.
  tip_reserve_to_debt: |-
    The market's reserve divided by its debt, which sets the secondary interest rate and the market's defensive mode.
  tip_minimum_ratio: |-
    The collateral ratio below which the CDP can be liquidated, in the market's normal mode.
  tip_liquidation_penalty: |-
    The share of the seized collateral that goes as a penalty when the stability pool absorbs a liquidation, a constant of the market's contracts.
  # The PSM's trades in one closed gap between touches, as one row (ui-jobs 402).
  psm_gap_head: |-
    Peg defence moved the market
  psm_gap_head_short: |-
    Peg defence
  psm_gap_coll: |-
    Collateral share
  psm_gap_debt: |-
    Debt share
  psm_gap_net: |-
    Net, at the touch's feed
  psm_gap_trades: |-
    PSM mints and redemptions in the gap
  psm_gap_trades_word: |-
    PSM mints and redemptions
  psm_pro_rata: |-
    A buy above the target upsizes the market, so every open CDP takes the new collateral, debt and fee pro rata; the touch that closes the gap writes this CDP's share into its stated figures.
  tip_psm_gap_coll: |-
    The pETH the closing touch added to the collateral as the CDP's share of the gap's PSM trades, from the CDPManager's log.
  tip_psm_gap_debt: |-
    The stablecoin the closing touch added to the debt as the CDP's share of the gap's PSM trades, from the CDPManager's log.
  tip_psm_gap_net: |-
    The two shares as one figure in the market's stablecoin, the pETH at the feed for the closing touch's block less the debt.
  tip_psm_gap_trades: |-
    The market's PrimaryRateSet count at the closing touch less the count at the earlier one: the primary rate is re-set at every PSM mint and redemption.
  # The live window's sheet (ui-jobs 396): the figures as the last touch wrote
  # them, what is pending until the next touch, and the figures at the feed,
  # each a view call on the cdpManager at the head block.
  live_stated_open: |-
    Stated at its open
  live_stated_touch: |-
    Stated at its last touch
  live_pending: |-
    Pending until the next touch
  live_at_feed: |-
    At the feed
  live_cr_stated: |-
    Collateral ratio, as last written
  live_liq_stated: |-
    Liquidates at, as last written
  live_note_open: |-
    This CDP has had no touch since its open, and its stated collateral and debt change only at a touch, so the figures at the feed are what its open wrote plus what is pending, and the breakdown is the whole of what moved its equity at the feed over its life. Its first touch writes the pending legs into the stated figures.
  live_note_touch: |-
    A CDP's stated collateral and debt change only at a touch, so the figures at the feed are what its last touch wrote plus what is pending, and the breakdown is the whole of what moved its equity at the feed since then. The next touch writes the pending legs into the stated figures.
  live_legs: |-
    The protocol's legs, pending until the next touch:
  live_change: |-
    Change in equity at the feed
  tip_live_coll_stated: |-
    The pETH the CDP's last touch wrote to its collateral (getCDP), in dollars at the feed now. It moves only at a touch.
  tip_live_coll_pending: |-
    The pETH pending since the last touch, the net PSM collateral share and the pETH reward, read from the cdpManager at the head block. The next touch writes it into the collateral.
  tip_live_coll_total: |-
    The CDP's collateral at the feed, the stated pETH with the pending PSM share and reward (getCDPEntireColl at the head block), in dollars at the feed now.
  tip_live_debt_stated: |-
    The debt the CDP's last touch wrote (getCDP). It moves only at a touch.
  tip_live_debt_pending: |-
    The debt pending since the last touch: interest charged, less the stability gain, with the net PSM debt share, read from the cdpManager at the head block. The next touch writes it into the debt.
  tip_live_debt_total: |-
    The CDP's debt at the feed, the stated debt with the pending legs (getCDPEntireDebt at the head block), in dollars at the stablecoin's price now.
  tip_live_cr: |-
    The collateral at the feed divided by the debt at the feed, both in the market's stablecoin, at the pETH price read at the head block.
  tip_live_cr_stated: |-
    The ratio on the figures the last touch wrote, at the pETH price at that touch's block.
  tip_live_liq: |-
    The pETH price, in the market's stablecoin, at which the ratio on the figures at the feed meets the minimum.
  tip_live_liq_stated: |-
    The same price on the figures the last touch wrote.
  tip_live_rate: |-
    The part of the market's interest rate that follows its stablecoin's peg, read from the cdpManager at the head block.
  tip_live_reserve: |-
    The market's reserve divided by its debt, read at the head block; it sets the secondary interest rate and the market's defensive mode.

# ── The position card's explanation (zone Z1): an unheaded lead, then bullets
# under Holdings, Risk, Rate and History when two of them hold two or more
# bullets. An open CDP reads: Holdings (what the collateral is worth, the
# equity), Risk (the fall to the minimum, the market's mode), Rate, History
# (the NFT's holder). A closed or liquidated CDP reads History only, from the
# index. Read by positionWords / positionNodes (lib/polaris/event-templates.ts). ──
position_words:
  heading_holdings: |-
    Holdings
  heading_risk: |-
    Risk
  heading_rate: |-
    Rate
  heading_history: |-
    History
  # ── Leads ──
  lead_holds: |-
    This CDP holds {coll} pETH of collateral and owes {debt} {stable}:
  lead_settles: |-
    This CDP holds {coll} pETH of collateral and owes nothing at this block; its next touch settles the debt to zero:
  lead_no_debt: |-
    This CDP holds {coll} pETH of collateral and has no debt:
  lead_closed: |-
    This CDP is closed and holds nothing now.
  lead_liquidated: |-
    This CDP was liquidated and holds nothing now.
  # ── An open CDP ──
  worth: |-
    At the feed's price of {price} {stable} per pETH, the collateral is worth {worth} {stable}.
  equity: |-
    Less the debt, equity is {equity} {stable}: a valuation at this block that says nothing of profit.
  debt_sum: |-
    The debt is {recorded} {stable} recorded at the last touch{legs} pending since.
  debt_touch: |-
    A touch is any transaction on the CDP; the next one writes the pending amounts into its figures.
  sum_interest: |-
    interest
  sum_gain: |-
    stability gain (from the Protocol Safety Rate, in the docs)
  sum_psm: |-
    net PSM share (the peg-defence fees, in the docs)
  drop: |-
    pETH's price can fall {drop} before this CDP reaches the {mcr} minimum.
  drop_far: |-
    pETH's price would have to fall over 99% before this CDP reaches the {mcr} minimum.
  below: |-
    It is below the {mcr} minimum, so anyone may liquidate it.
  mode_normal: |-
    The market is in normal mode; in defensive mode the minimum would rise to {defensive}.
  mode_defensive: |-
    The market is in defensive mode, which has raised the minimum to {defensive}.
  rate: |-
    Interest is a primary rate of {primary} plus a secondary rate of {secondary}, both set by the market.
  holder: |-
    The CDP is an NFT held by the address on the card.
  holder_one: |-
    The CDP is an NFT held by the address on the card, after one transfer.
  holder_many: |-
    The CDP is an NFT held by the address on the card, after {transfers} transfers.
  # ── A closed or liquidated CDP: its life, from the index ──
  life_coll: |-
    Over its life the holder deposited {deposited} pETH and withdrew {withdrawn} pETH.
  life_coll_in: |-
    Over its life the holder deposited {deposited} pETH.
  life_coll_out: |-
    Over its life the holder withdrew {withdrawn} pETH.
  life_debt: |-
    The holder borrowed {borrowed} {stable} and repaid {repaid} {stable}.
  life_debt_in: |-
    The holder borrowed {borrowed} {stable}.
  life_debt_out: |-
    The holder repaid {repaid} {stable}.
  life_interest: |-
    {interest} {stable} of interest was charged on the debt.
  life_psm_in: |-
    Its PSM shares, from the market's peg defence, added {psm_coll_in} pETH to the collateral and {psm_debt_in} {stable} to the debt.
  life_psm_out: |-
    Its PSM shares, from the market's peg defence, removed {psm_coll_out} pETH from the collateral and {psm_debt_out} {stable} from the debt.
  life_liq: |-
    The liquidation seized {seized} pETH and cleared {cleared} {stable} of debt.

# ── Sentences more than one template says ──
shared_sentences:
  legs.written:
    when: |-
      interest, stability gains or reward pETH were written in at this touch
    text: |-
      The touch also wrote in the {legs} built up since the previous one.
  psm.share_pos:
    when: |-
      a PSM share was written in at this touch, priced at its block, its net in the holder's favour
    text: |-
      PSM trades, the market's peg defence, netted {psm_net} {stable} for the holder since the previous touch at this block's price.
  psm.share_neg:
    when: |-
      a PSM share was written in at this touch, priced at its block, its net against the holder
    text: |-
      PSM trades, the market's peg defence, netted {psm_net} {stable} against the holder since the previous touch at this block's price.
  psm.share_unpriced:
    when: |-
      a PSM share was written in at this touch and its block has no price
    text: |-
      PSM trades, the market's peg defence, moved {psm_coll} pETH and {psm_debt} {stable} through this CDP since the previous touch.
  zero.settled:
    when: |-
      the protocol added debt so it settled at zero
    text: |-
      The protocol added {zero_mint} {stable} to the debt so it settled at zero.

# ── Templates: one per kind of event ──
#   id          the template's id
#   title       the event's label in the template list
#   when        the event and state that select it
#   L5          the modal it opens (see L5 below)
#   variants    each variant's id and when it applies
#   sentences   its sentences, each with `when` and `text`
#   order       the order the explanation says them in, shared sentences included
#   groups      which group (group_words) each sentence of order sits in
#   alternates  lists of sentences the code says at most one of
# A figure the card's cells, notes or price row show stays out of a sentence
# unless the sentence says what it means (rails-ops
# standards/prose-limits-and-zones.md).
templates:
  - id: polaris.open
    title: |-
      Open
    when: |-
      the CDP's first touch
    L5: open
    variants:
      with_debt: |-
        the holder deposited collateral and borrowed
      no_debt: |-
        the holder deposited collateral and borrowed nothing
      bare: |-
        the open moved neither
    sentences:
      open.what_debt:
        when: |-
          with_debt
        text: |-
          The holder opened this CDP with {coll_change} pETH of collateral and borrowed {debt_change} {stable}.
      open.what_no_debt:
        when: |-
          no_debt
        text: |-
          The holder opened this CDP with {coll_change} pETH of collateral and no debt.
      open.what_bare:
        when: |-
          bare
        text: |-
          This CDP opened.
      open.escrow:
        when: |-
          with_debt, no_debt
        text: |-
          The {escrow} pETH gas compensation escrow is held apart from the collateral and comes back when the CDP closes.
    order:
      - open.what_debt
      - open.what_no_debt
      - open.what_bare
      - open.escrow
    groups:
      happened:
        - open.what_debt
        - open.what_no_debt
        - open.what_bare
      adds_up:
        - open.escrow
    alternates:
      - [open.what_debt, open.what_no_debt, open.what_bare]

  - id: polaris.adjust
    title: |-
      Adjust
    when: |-
      a touch that is not the open, the close or a liquidation
    L5: adjust
    variants:
      moved: |-
        the holder moved collateral or debt
      unmoved: |-
        the touch moved neither
    sentences:
      adj.deposit:
        when: |-
          moved, where collateral went in
        text: |-
          The holder deposited {coll_change} pETH.
      adj.withdraw:
        when: |-
          moved, where collateral came out
        text: |-
          The holder withdrew {coll_change} pETH.
      adj.borrow:
        when: |-
          moved, where debt went up
        text: |-
          The holder borrowed {debt_change} {stable}.
      adj.repay:
        when: |-
          moved, where debt went down
        text: |-
          The holder repaid {debt_change} {stable}.
      adj.none:
        when: |-
          unmoved
        text: |-
          The holder touched this CDP without moving collateral or debt.
      adj.none_keeper:
        when: |-
          unmoved, sent by an account that is not the holder
        text: |-
          An account other than the holder touched this CDP without moving collateral or debt.
    order:
      - adj.deposit
      - adj.withdraw
      - adj.borrow
      - adj.repay
      - adj.none
      - adj.none_keeper
      - legs.written
      - psm.share_pos
      - psm.share_neg
      - psm.share_unpriced
      - zero.settled
    groups:
      happened:
        - adj.deposit
        - adj.withdraw
        - adj.borrow
        - adj.repay
        - adj.none
        - adj.none_keeper
      adds_up:
        - legs.written
        - psm.share_pos
        - psm.share_neg
        - psm.share_unpriced
        - zero.settled
    alternates:
      - [adj.deposit, adj.withdraw]
      - [adj.borrow, adj.repay]

  - id: polaris.close
    title: |-
      Close
    when: |-
      the touch that closed the CDP
    L5: close
    variants:
      both: |-
        the holder repaid debt and withdrew collateral
      repay_only: |-
        the holder repaid debt
      withdraw_only: |-
        the holder withdrew collateral
      bare: |-
        the close moved neither
    sentences:
      close.both:
        when: |-
          both
        text: |-
          The holder closed this CDP, repaying {debt_change} {stable} and withdrawing {coll_change} pETH.
      close.repay:
        when: |-
          repay_only
        text: |-
          The holder closed this CDP, repaying {debt_change} {stable}.
      close.withdraw:
        when: |-
          withdraw_only
        text: |-
          The holder closed this CDP, withdrawing {coll_change} pETH.
      close.bare:
        when: |-
          bare
        text: |-
          The holder closed this CDP.
      close.ended:
        when: |-
          always
        text: |-
          Its NFT was burned and the escrowed gas compensation returned to the holder.
    order:
      - close.both
      - close.repay
      - close.withdraw
      - close.bare
      - legs.written
      - psm.share_pos
      - psm.share_neg
      - psm.share_unpriced
      - zero.settled
      - close.ended
    groups:
      happened:
        - close.both
        - close.repay
        - close.withdraw
        - close.bare
      adds_up:
        - legs.written
        - psm.share_pos
        - psm.share_neg
        - psm.share_unpriced
        - zero.settled
      leaves:
        - close.ended
    alternates:
      - [close.both, close.repay, close.withdraw, close.bare]

  - id: polaris.liquidation
    title: |-
      Liquidation
    when: |-
      the touch that liquidated the CDP
    L5: liquidation
    variants:
      pool: |-
        the stability pool absorbed the whole debt
      pool_priced: |-
        the same, with the block's price read
      redistributed: |-
        the pool covered part and the rest was redistributed
      redistributed_priced: |-
        the same, with the block's price read
    sentences:
      liq.what:
        when: |-
          pool, redistributed
        text: |-
          This CDP was liquidated because its collateral ratio fell below the market's minimum.
      liq.what_priced:
        when: |-
          pool_priced, redistributed_priced
        text: |-
          This CDP was liquidated: its collateral ratio at the feed's price was below the normal-mode minimum of {mcr}.
      liq.pool:
        when: |-
          pool, pool_priced
        text: |-
          The stability pool repaid the debt and received the collateral.
      liq.redistributed:
        when: |-
          redistributed, redistributed_priced
        text: |-
          The pool covered part of the debt; the market's other CDPs took the rest of the debt and collateral.
      liq.penalty_pool:
        when: |-
          pool_priced
        text: |-
          The pool's premium is the {penalty} liquidation penalty, which comes out of what the owner could have kept.
      liq.penalty_redist:
        when: |-
          redistributed_priced
        text: |-
          The other CDPs' premium is the {penalty} liquidation penalty, which comes out of what the owner could have kept.
      liq.surplus:
        when: |-
          the liquidation left a surplus and the pool has been read past it with no claim
        text: |-
          The {surplus} pETH surplus is unclaimed and claimable by the owner.
      liq.surplus_claimed:
        when: |-
          the owner has claimed the surplus
        text: |-
          The owner claimed the {surplus} pETH surplus on {claimed_at}, in {claim_tx}.
      liq.surplus_claimed_all:
        when: |-
          the owner has claimed, and the claim paid more than this credit
        text: |-
          The owner claimed the {surplus} pETH surplus on {claimed_at} in {claim_tx}; the claim paid the owner's whole balance.
      liq.surplus_unread:
        when: |-
          the pool's claims have not been read to this liquidation
        text: |-
          The surplus's claim state has not been read yet.
    order:
      - liq.what
      - liq.what_priced
      - liq.pool
      - liq.redistributed
      - liq.penalty_pool
      - liq.penalty_redist
      - legs.written
      - liq.surplus
      - liq.surplus_claimed
      - liq.surplus_claimed_all
      - liq.surplus_unread
    groups:
      happened:
        - liq.what
        - liq.what_priced
        - liq.pool
        - liq.redistributed
      adds_up:
        - liq.penalty_pool
        - liq.penalty_redist
        - legs.written
      leaves:
        - liq.surplus
        - liq.surplus_claimed
        - liq.surplus_claimed_all
        - liq.surplus_unread
    alternates:
      - [liq.surplus, liq.surplus_claimed, liq.surplus_claimed_all, liq.surplus_unread]
      - [liq.what, liq.what_priced]
      - [liq.pool, liq.redistributed]
      - [liq.penalty_pool, liq.penalty_redist]

  - id: polaris.transfer
    title: |-
      Transfer
    when: |-
      the CDP's NFT moved between two holders
    L5: transfer
    variants:
      both: |-
        the transfer names both addresses
      none: |-
        it names neither
    sentences:
      xfer.what:
        when: |-
          both
        text: |-
          This CDP changed hands, from {from_addr} to {to_addr}.
      xfer.what_none:
        when: |-
          none
        text: |-
          This CDP changed hands.
      xfer.holder:
        when: |-
          always
        text: |-
          The new holder can now act on the CDP and the previous holder cannot.
    order:
      - xfer.what
      - xfer.what_none
      - xfer.holder
    groups:
      happened:
        - xfer.what
        - xfer.what_none
      leaves:
        - xfer.holder
    alternates:
      - [xfer.what, xfer.what_none]

  - id: polaris.fallback
    title: |-
      Event
    when: |-
      an event type the generator does not know
    L5: fallback
    variants:
      default: |-
        always
    sentences:
      fallback.what:
        when: |-
          always
        text: |-
          The CDP recorded a {event_type} event.
    order:
      - fallback.what
    groups:
      happened:
        - fallback.what

# ── The documentation pages the modals link, by id ──
doc_urls:
  OPEN_POSITION: |-
    https://docs.polaris.finance/architecture/passet-minting#opening-a-mint-position
  WHY_MINT: |-
    https://docs.polaris.finance/architecture/passet-minting#why-mint-passets
  PEG_EFFECTS: |-
    https://docs.polaris.finance/architecture/passet-minting#adaptive-peg-defense-and-position-effects
  PEG_RATE: |-
    https://docs.polaris.finance/design/interest-rates#peg-stability-rate
  SAFETY_RATE: |-
    https://docs.polaris.finance/design/interest-rates#protocol-safety-rate
  DEFENSIVE_RESTRICTIONS: |-
    https://docs.polaris.finance/design/defensive-mode#restrictions
  LIQUIDATION_PROCESS: |-
    https://docs.polaris.finance/design/liquidations#liquidation-process
  REDISTRIBUTION: |-
    https://docs.polaris.finance/design/liquidations#fallback-redistribution
  RECOVERY_LIQUIDATIONS: |-
    https://docs.polaris.finance/design/recovery-mode#liquidations
  MEDIANIZER: |-
    https://docs.polaris.finance/design/oracles#the-medianizer
  PETH_NATIVE: |-
    https://docs.polaris.finance/core-assets/peth#a-native-market
  USDP_USING: |-
    https://docs.polaris.finance/core-assets/usdp#using-usdp
  GOLDP_USING: |-
    https://docs.polaris.finance/core-assets/goldp#using-goldp

# ── The "?" modals ──
L5:
  open:
    title: |-
      How Opening a CDP Works
    intro: |-
      Opening a CDP deposits pETH as collateral and can borrow the market's stablecoin against it. The CDP is an NFT, so it can change hands without being closed.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          pETH
        text: |-
          the protocol's collateral token, minted when ETH enters its bonding curve and burned when pETH goes back.
      - bold: |-
          Gas compensation
        text: |-
          a fixed 0.0375 pETH the CDP escrows beside its collateral; it returns on close and goes to a liquidator on liquidation.
      - bold: |-
          Minimum ratio
        text: |-
          collateral must be worth 115% of the debt; in defensive mode, borrowing more or withdrawing needs 150%.
      - bold: |-
          Two rates
        text: |-
          a primary rate that moves with the market's PSM mints and redemptions, and a secondary rate that makes leverage dearer; nobody chooses either.
    links:
      - label: |-
          Opening a mint position
        doc: OPEN_POSITION
      - label: |-
          pETH, a native market
        doc: PETH_NATIVE
      - label: |-
          The Peg Stability Rate
        doc: PEG_RATE
      - label: |-
          The Protocol Safety Rate
        doc: SAFETY_RATE

  adjust:
    title: |-
      How Adjusting a CDP Works
    intro: |-
      An adjustment adds or removes collateral, or borrows or repays debt, on an open CDP. Each one is a touch, which also writes in what built up since the previous touch.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Touch
        text: |-
          any transaction on the CDP, which writes the interest, stability gains, reward pETH and PSM share that built up into its figures.
      - bold: |-
          Stability gain
        text: |-
          a share of the secondary-rate payments, credited against the debt (Protocol Safety Rate, in the docs); CDPs with less leverage receive more than they pay.
      - bold: |-
          Reward pETH
        text: |-
          pETH the protocol distributes to borrowers in proportion to their debt, added to the collateral (the pETH yield to minters, in the docs).
      - bold: |-
          The PSM
        text: |-
          the market's peg defence: a buy above the target upsizes the market, so every open CDP takes the new collateral, debt and fee pro rata.
      - bold: |-
          Settled to zero
        text: |-
          when a net PSM share clears more debt than a CDP owes, the protocol adds the difference so the debt lands on zero.
    links:
      - label: |-
          Adaptive Peg Defense and position effects
        doc: PEG_EFFECTS
      - label: |-
          The Protocol Safety Rate
        doc: SAFETY_RATE
      - label: |-
          Why mint pAssets
        doc: WHY_MINT

  close:
    title: |-
      How Closing a CDP Works
    intro: |-
      Closing repays the whole debt and takes back the collateral. The CDP's NFT is burned and its escrowed gas compensation returns to the holder.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Interest at the close
        text: |-
          interest accrued since the last touch is written into the debt at the close, so the amount repaid includes it.
      - bold: |-
          Settled to zero
        text: |-
          when a net PSM share clears more debt than the CDP owes, the protocol adds the difference so the debt lands on zero.
      - bold: |-
          Defensive mode
        text: |-
          while a market is in defensive mode, closing a CDP is restricted because it would lower the market's backing.
      - bold: |-
          The NFT
        text: |-
          burned at the close, so the CDP's number is never reused.
    links:
      - label: |-
          Defensive mode restrictions
        doc: DEFENSIVE_RESTRICTIONS
      - label: |-
          The Peg Stability Rate
        doc: PEG_RATE
      - label: |-
          Adaptive Peg Defense and position effects
        doc: PEG_EFFECTS

  liquidation:
    title: |-
      How Liquidations Work
    intro: |-
      A CDP whose collateral ratio falls below the market's minimum can be liquidated by anyone. The stability pool, called the Earn Pool in the docs, repays the debt first.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Stability pool
        text: |-
          its deposits repay the liquidated debt and the pool receives the collateral, worth the debt plus a 5% penalty at the feed's price.
      - bold: |-
          Redistribution
        text: |-
          if the pool cannot cover it all, the rest of the debt and collateral is shared across the market's other open CDPs.
      - bold: |-
          Liquidator's pay
        text: |-
          a fixed 0.0375 pETH gas compensation from the CDP's escrow, plus 0.5% of the seized collateral.
      - bold: |-
          Surplus
        text: |-
          collateral left after the pool's take and the liquidator's share is set aside for the owner to claim.
      - bold: |-
          Recovery mode
        text: |-
          below full backing, a market disables liquidation by redistribution.
    links:
      - label: |-
          The liquidation process
        doc: LIQUIDATION_PROCESS
      - label: |-
          Fallback redistribution
        doc: REDISTRIBUTION
      - label: |-
          Liquidations in recovery mode
        doc: RECOVERY_LIQUIDATIONS

  transfer:
    title: |-
      Transferring a CDP
    intro: |-
      A Polaris CDP is an NFT, so transferring it hands the whole position to a new holder without opening or closing anything.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Control
        text: |-
          whoever holds the NFT can act on the CDP, and its collateral, debt and pending legs go with it.
      - bold: |-
          Mint and burn
        text: |-
          the NFT is minted when the CDP opens and burned when it closes or is liquidated; those two moves are the open and the close.
    links:
      - label: |-
          Opening a mint position
        doc: OPEN_POSITION

  fallback:
    title: |-
      How a CDP Changes
    intro: |-
      A Polaris CDP changes through a touch: an open, an adjustment, a close or a liquidation. Moving its NFT to another holder changes only who can act on it.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Touch
        text: |-
          any transaction on the CDP; it writes in the interest, stability gains, reward pETH and PSM share that built up before it.
      - bold: |-
          The NFT
        text: |-
          whoever holds the token holds the position, which closing or liquidation burns.
    links:
      - label: |-
          Opening a mint position
        doc: OPEN_POSITION
      - label: |-
          Adaptive Peg Defense and position effects
        doc: PEG_EFFECTS

  position_open:
    title: |-
      About This CDP
    intro: |-
      The lead says what the CDP holds and owes now. The bullets say what the figures mean for it.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Collateral ratio
        text: |-
          collateral at the feed's price divided by the debt; below the market's minimum, 115% or 150% in defensive mode, a CDP can be liquidated.
      - bold: |-
          The feed
        text: |-
          the protocol's price for pETH: the bonding curve's price in ETH times an ETH/USD price from the Medianizer, which aggregates up to three oracles.
      - bold: |-
          Equity
        text: |-
          the collateral at the feed's price less the debt; a profit would need a price for each deposit, which the chain does not state.
      - bold: |-
          Pending legs
        text: |-
          interest, stability gains, reward pETH and PSM share built up since the last touch, all written in at the next one.
      - bold: |-
          Two rates
        text: |-
          a primary rate that moves with the PSM's mints and redemptions plus a secondary rate on leverage; the holder chooses neither.
    links:
      - label: |-
          Defensive mode restrictions
        doc: DEFENSIVE_RESTRICTIONS
      - label: |-
          The Medianizer
        doc: MEDIANIZER
      - label: |-
          The Peg Stability Rate
        doc: PEG_RATE
      - label: |-
          The Protocol Safety Rate
        doc: SAFETY_RATE

  position_closed:
    title: |-
      About This CDP
    intro: |-
      This CDP is closed and its debt repaid. The card shows the most it ever held, and its NFT is burned.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Highest recorded
        text: |-
          the most pETH and debt the CDP held after any touch, once the legs that had built up were written in.
      - bold: |-
          Interest at each touch
        text: |-
          interest accrued at the market's rate is written into the debt at every touch, the close included.
      - bold: |-
          The PSM share
        text: |-
          traders' PSM mints and redemptions add or remove collateral and debt from every open CDP at a touch (the peg-defence fees, in the docs).
      - bold: |-
          Settled to zero
        text: |-
          when a net PSM share clears more debt than the CDP owes, the protocol adds the difference so the close lands on zero.
    links:
      - label: |-
          The Peg Stability Rate
        doc: PEG_RATE
      - label: |-
          Adaptive Peg Defense and position effects
        doc: PEG_EFFECTS

  position_liquidated:
    title: |-
      About This CDP
    intro: |-
      This CDP was liquidated: its collateral ratio fell below the market's minimum and a liquidator closed it. Its NFT is burned.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Stability pool
        text: |-
          it repaid the debt and received the collateral; any debt it could not cover was redistributed across other CDPs.
      - bold: |-
          Liquidator's pay
        text: |-
          a fixed 0.0375 pETH gas compensation from the CDP's escrow, plus 0.5% of the seized collateral.
      - bold: |-
          Surplus
        text: |-
          collateral left after the pool's take and the liquidator's share is set aside for the owner to claim.
      - bold: |-
          Highest recorded
        text: |-
          the most pETH and debt the CDP held after any touch, the liquidation's included.
    links:
      - label: |-
          The liquidation process
        doc: LIQUIDATION_PROCESS
      - label: |-
          Fallback redistribution
        doc: REDISTRIBUTION
      - label: |-
          Liquidations in recovery mode
        doc: RECOVERY_LIQUIDATIONS

  market:
    title: |-
      How a Polaris Market Works
    intro: |-
      Polaris has one market per pAsset, each minted against pETH: USDp tracks the dollar and GOLDp tracks gold. Each market keeps separate accounting, an oracle feed and a stability pool.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          pETH
        text: |-
          the shared collateral: ETH paid into the bonding curve mints it, and returning it to the curve burns it for ETH.
      - bold: |-
          The PSM
        text: |-
          anyone can buy a pAsset with pETH or redeem it at its target value; each trade changes every open CDP pro rata.
      - bold: |-
          Two rates
        text: |-
          the primary rate moves with the PSM's mints and redemptions; the secondary rate charges leverage, more so as collateral health weakens.
      - bold: |-
          Market modes
        text: |-
          below a reserve-to-debt ratio of 1.10 a market enters defensive mode, which restricts actions that would weaken it.
    links:
      - label: |-
          USDp, the Polaris dollar
        doc: USDP_USING
      - label: |-
          GOLDp, Polaris gold
        doc: GOLDP_USING
      - label: |-
          Adaptive Peg Defense and position effects
        doc: PEG_EFFECTS
      - label: |-
          Defensive mode restrictions
        doc: DEFENSIVE_RESTRICTIONS

  price_gap:
    title: |-
      How a Price Move Reaches a CDP
    intro: |-
      A market note states something the market did while this CDP transacted nothing, and no count moves because of it. This kind states how the price feed moved between two touches.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Oracle price
        text: |-
          the market's price feed at each touch's block, in the market's unit (USDp or GOLDp).
      - bold: |-
          Collateral ratio
        text: |-
          the collateral's value at that price divided by the debt; a lower price lowers the ratio with nothing else moving.
      - bold: |-
          The liquidation line
        text: |-
          the normal-mode minimum of 115%; a defensive-mode minimum at a past block is not indexed.
      - bold: |-
          Runway
        text: |-
          how far the price could fall from the earlier touch before the ratio reached that line.
      - bold: |-
          Which stretches are stated
        text: |-
          one where the move used a quarter of the runway or ended in a liquidation; a live note runs to now.
    links:
      - label: |-
          The Medianizer
        doc: MEDIANIZER
      - label: |-
          The liquidation process
        doc: LIQUIDATION_PROCESS
      - label: |-
          Defensive mode restrictions
        doc: DEFENSIVE_RESTRICTIONS

  rate_step:
    title: |-
      How the Primary Rate Moves a CDP
    intro: |-
      A market note states something the market did while this CDP transacted nothing, and no count moves because of it. This kind states a step in the primary rate between two touches.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Primary rate
        text: |-
          the Peg Stability Rate, set by the market's mints and redemptions; every touch carries the rate in force at its block.
      - bold: |-
          Which stretches are stated
        text: |-
          one where the rate moved a percentage point or more; consecutive moves the same way are one note, and a live note runs to now.
      - bold: |-
          The header figure
        text: |-
          the rate at the later end: what the market charged by the end of the stretch, or charges now.
      - bold: |-
          The interest figure
        text: |-
