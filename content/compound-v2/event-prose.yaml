# ── The "?" modals (zone Z4): the event modals and the position card's. Each
# stops at the mechanism and hands it to a Quick Link; no figure of one
# account appears here. ──
L5:
  supply:
    title: |-
      How Supplying Works
    intro: |-
      Supplying deposits an asset into a Compound V2 market and mints cTokens, a transferable receipt, in exchange. The deposit earns the supply rate and, once the market is entered, backs borrowing.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          cTokens and the exchange rate
        text: |-
          a cToken balance times the market's exchange rate is the underlying claim, and interest raises the rate.
      - bold: |-
          Entering a market
        text: |-
          supplying alone does not make a deposit collateral; the wallet enters the market in a separate call.
      - bold: |-
          Cross-collateralisation
        text: |-
          the Comptroller, Compound's risk contract, pools every entered market into one account, each weighted by its collateral factor.
      - bold: |-
          Transferable positions
        text: |-
          cTokens are ordinary ERC-20s, so transferring them moves the deposit and its collateral role without a mint or redeem.
    links:
      - label: |-
          Mint
        doc: MINT
      - label: |-
          Exchange rate
        doc: EXCHANGE_RATE
      - label: |-
          Enter markets
        doc: ENTER_MARKETS

  withdraw:
    title: |-
      How Withdrawing Works
    intro: |-
      Withdrawing burns cTokens and returns the underlying asset to the wallet. It goes only as far as the account's liquidity and the market's cash allow.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          cTokens and the exchange rate
        text: |-
          the cTokens burned times the market's exchange rate is the underlying asset returned.
      - bold: |-
          Effect on liquidity
        text: |-
          withdrawing removes collateral, so the account's borrowing room falls; the market blocks a withdrawal that would leave debt uncovered.
      - bold: |-
          Entered markets only
        text: |-
          only entered markets count toward the borrow limit, so withdrawing from one that is not entered changes no limit.
    links:
      - label: |-
          Redeem
        doc: REDEEM
      - label: |-
          Account liquidity
        doc: ACCOUNT_LIQUIDITY

  borrow:
    title: |-
      How Borrowing Works
    intro: |-
      Borrowing draws an asset against the account's supplied collateral and accrues interest at the market's borrow rate. The amount must stay within the account's liquidity and the market's cash.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Borrowing power
        text: |-
          the supplied value in entered markets, weighted by each market's collateral factor, sets how much can be borrowed.
      - bold: |-
          Account liquidity
        text: |-
          the borrow limit minus the debt; below zero it is a shortfall, and the account can be liquidated.
      - bold: |-
          The emitted debt figure
        text: |-
          each borrow and repay carries the debt after it, with interest to that moment, so the gap to the next event is interest.
    links:
      - label: |-
          Borrow
        doc: BORROW
      - label: |-
          Collateral factor
        doc: COLLATERAL_FACTOR
      - label: |-
          Account liquidity
        doc: ACCOUNT_LIQUIDITY

  repay:
    title: |-
      How Repaying Works
    intro: |-
      Repaying returns borrowed assets to the market, clearing debt and restoring the account's borrowing room.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Repaying for others
        text: |-
          any address can repay another account's borrow, in full or in part.
      - bold: |-
          Account liquidity
        text: |-
          the borrow limit minus the debt; repaying lowers the debt, so the room to borrow grows.
      - bold: |-
          The emitted debt figure
        text: |-
          each borrow and repay carries the debt after it, with interest to that moment, so the gap to the next event is interest.
    links:
      - label: |-
          Repay borrow
        doc: REPAY_BORROW
      - label: |-
          Repay borrow behalf
        doc: REPAY_BEHALF
      - label: |-
          Account liquidity
        doc: ACCOUNT_LIQUIDITY

  transfer_in:
    title: |-
      How Receiving cTokens Works
    intro: |-
      cTokens are ordinary ERC-20 tokens, so a Compound V2 deposit can change hands without touching the market. Transferring cTokens transfers the underlying claim and its collateral role.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          The claim moves with the token
        text: |-
          the recipient's cToken balance times the exchange rate becomes their claim; the sender gives it up and no mint or redeem fires.
      - bold: |-
          Collateral implications
        text: |-
          the market blocks a transfer that would leave the sender's debt uncovered.
      - bold: |-
          Positions can start here
        text: |-
          a wallet that never supplied can still hold a position; received cTokens are a deposit like any other.
    links:
      - label: |-
          Transfer
        doc: TRANSFER
      - label: |-
          Exchange rate
        doc: EXCHANGE_RATE

  transfer_out:
    title: |-
      How Sending cTokens Works
    intro: |-
      cTokens are ordinary ERC-20 tokens, so a Compound V2 deposit can change hands without touching the market. Transferring cTokens transfers the underlying claim and its collateral role.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          The claim moves with the token
        text: |-
          the recipient's cToken balance times the exchange rate becomes their claim; the sender gives it up and no mint or redeem fires.
      - bold: |-
          Collateral implications
        text: |-
          the market blocks a transfer that would leave the sender's debt uncovered.
      - bold: |-
          Positions can end here
        text: |-
          a wallet can exit by sending its cTokens, and the position continues under the new owner.
    links:
      - label: |-
          Transfer
        doc: TRANSFER
      - label: |-
          Exchange rate
        doc: EXCHANGE_RATE

  liquidation:
    title: |-
      How Liquidations Work
    intro: |-
      A Compound V2 account can be liquidated when its liquidity turns into a shortfall: its debt is worth more than its collateral counts for. Anyone may then repay part of the debt for collateral.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Close factor
        text: |-
          a liquidator repays at most the close factor, 50%, of one borrowed market per call.
      - bold: |-
          Liquidation incentive
        text: |-
          the liquidator seizes cTokens worth the repaid debt plus the 8% incentive, in a collateral market it chooses.
      - bold: |-
          The protocol's share
        text: |-
          most markets keep 2.8% of the seized cTokens for the protocol, and a few take none.
      - bold: |-
          Deprecated markets
        text: |-
          a market with collateral factor 0, borrowing paused and reserve factor 100% is deprecated: any borrow in it can be liquidated in full.
      - bold: |-
          Partial and repeatable
        text: |-
          otherwise a liquidation is partial and repeatable, so borrowers often survive one.
    links:
      - label: |-
          Liquidate borrow
        doc: LIQUIDATE_BORROW
      - label: |-
          Close factor
        doc: CLOSE_FACTOR
      - label: |-
          Liquidation incentive
        doc: LIQUIDATION_INCENTIVE

  seize_out:
    title: |-
      How Collateral Seizure Works
    intro: |-
      When a liquidator repays part of an account's debt, the protocol moves cTokens in a collateral market out of the borrower's balance. The borrower did not send them.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One seizure, two parts
        text: |-
          the seized total is the liquidator's part plus the protocol's 2.8% share, so the liquidator's part alone understates the loss.
        text_no_share: |-
          this market takes no protocol share, so the liquidator receives every seized cToken.
      - bold: |-
          Receipt tokens move
        text: |-
          a seizure moves the receipt tokens, and their value follows the collateral market's exchange rate.
      - bold: |-
          Partial, outside deprecated markets
        text: |-
          the close factor caps a liquidation at half of one borrowed market, so accounts often survive; a deprecated one can go whole.
    links:
      - label: |-
          Liquidate borrow
        doc: LIQUIDATE_BORROW
      - label: |-
          Liquidation incentive
        doc: LIQUIDATION_INCENTIVE

  seize_in:
    title: |-
      How Seized Collateral Arrives
    intro: |-
      A liquidator receives these cTokens for repaying part of a liquidatable account's debt. They are its side of a seizure, worth the repaid debt plus the liquidation incentive.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One seizure, two parts
        text: |-
          the seized total is the liquidator's part plus the protocol's 2.8% share, so the liquidator's part alone understates the loss.
        text_no_share: |-
          this market takes no protocol share, so the liquidator receives every seized cToken.
      - bold: |-
          Receipt tokens move
        text: |-
          a seizure moves the receipt tokens, and their value follows the collateral market's exchange rate.
      - bold: |-
          Partial, outside deprecated markets
        text: |-
          the close factor caps a liquidation at half of one borrowed market, so accounts often survive; a deprecated one can go whole.
    links:
      - label: |-
          Liquidate borrow
        doc: LIQUIDATE_BORROW
      - label: |-
          Liquidation incentive
        doc: LIQUIDATION_INCENTIVE

  seize_burn:
    title: |-
      The Protocol's Seize Share
    intro: |-
      The protocol's share of a seizure: 2.8% of the seized cTokens are taken from the borrower and burned, and their underlying joins the market's reserves. No wallet receives them.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One seizure, two parts
        text: |-
          the seized total is the liquidator's part plus the protocol's 2.8% share, so the liquidator's part alone understates the loss.
      - bold: |-
          Receipt tokens move
        text: |-
          a seizure moves the receipt tokens, and their value follows the collateral market's exchange rate.
    links:
      - label: |-
          Liquidation incentive
        doc: LIQUIDATION_INCENTIVE
      - label: |-
          Liquidate borrow
        doc: LIQUIDATE_BORROW

  fallback:
    title: |-
      How Compound V2 Positions Work
    intro: |-
      Compound V2 is the original pooled-lending protocol. A wallet supplies assets into cToken markets, receiving transferable receipts, and borrows against them through one Comptroller.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          cTokens
        text: |-
          each market's receipt token: balance times exchange rate is the underlying claim, and the rate's growth is the supply interest.
      - bold: |-
          Borrowing and account liquidity
        text: |-
          borrowing draws against the supplied value in entered markets, weighted by collateral factors; a shortfall means liquidatable.
      - bold: |-
          Liquidation
        text: |-
          a liquidator repays part of a debt and seizes collateral worth the repayment plus an incentive.
    links:
      - label: |-
          Compound v2 documentation
        doc: OVERVIEW
      - label: |-
          cTokens
        doc: CTOKENS
      - label: |-
          Comptroller
        doc: COMPTROLLER

  # ── The position card's "?" (an open account with debt, an open account
  # without, a closed one, a liquidated one) ──
  position_borrowing:
    title: |-
      About This Position
    intro: |-
      This panel explains the account in plain words. It covers what is supplied in each Compound V2 market, what is borrowed against it, and the borrowing room the Comptroller leaves.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          cTokens and the exchange rate
        text: |-
          a cToken balance times the market's exchange rate is the underlying claim, and the rate rises with interest.
      - bold: |-
          Entering a market
        text: |-
          supplying alone does not enter a market; only entered markets count toward the borrow limit.
      - bold: |-
          Account liquidity
        text: |-
          the Comptroller adds each entered market's value times its collateral factor, then subtracts the debt; a shortfall can be liquidated.
      - bold: |-
          Reserve factor 100%
        text: |-
          governance has set every market to keep all borrower interest as reserves, so supplying earns nothing now.
      - bold: |-
          Constant prices
        text: |-
          a few markets are priced by a constant stored in the oracle, which nothing updates.
    links:
      - label: |-
          Comptroller
        doc: COMPTROLLER
      - label: |-
          Account liquidity
        doc: ACCOUNT_LIQUIDITY
      - label: |-
          Reserve factor
        doc: RESERVE_FACTOR
      - label: |-
          Price feed
        doc: PRICES

  position_supply:
    title: |-
      About This Position
    intro: |-
      This panel explains the account in plain words: what is supplied in each Compound V2 market, and whether any of it backs borrowing.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          cTokens and the exchange rate
        text: |-
          a cToken balance times the market's exchange rate is the underlying claim, and the rate rises with interest.
      - bold: |-
          Entering a market
        text: |-
          a supply is not collateral until its market is entered; with no debt there is nothing to liquidate.
      - bold: |-
          Reserve factor 100%
        text: |-
          governance has set every market to keep all borrower interest as reserves, so supplying earns nothing now.
      - bold: |-
          Constant prices
        text: |-
          a few markets are priced by a constant stored in the oracle, which nothing updates.
    links:
      - label: |-
          Comptroller
        doc: COMPTROLLER
      - label: |-
          Enter markets
        doc: ENTER_MARKETS
      - label: |-
          Reserve factor
        doc: RESERVE_FACTOR
      - label: |-
          Price feed
        doc: PRICES

  position_closed:
    title: |-
      About This Position
    intro: |-
      This account has repaid all its debt and withdrawn its supply. The panel above shows its lifetime peaks.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Highest recorded
        text: |-
          each market's peak is the highest of its running balance, replayed from the account's events.
      - bold: |-
          cTokens and the exchange rate
        text: |-
          a cToken balance times the market's exchange rate is the underlying claim, and the rate rises with interest.
      - bold: |-
          Coming back
        text: |-
          a new supply or borrow reopens this same account's timeline.
    links:
      - label: |-
          Compound v2 documentation
        doc: OVERVIEW
      - label: |-
          cTokens
        doc: CTOKENS

  position_liquidated:
    title: |-
      About This Position
    intro: |-
      This account was liquidated and has since closed: nothing remains supplied or borrowed. The panel above shows the highest supply and debt each market reached.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Partial by design
        text: |-
          each liquidation repays at most half the debt in one borrowed market, so a liquidated account often survives it.
      - bold: |-
          Account liquidity
        text: |-
          the Comptroller adds each entered market's value times its collateral factor, then subtracts the debt; a shortfall can be liquidated.
      - bold: |-
          Highest recorded
        text: |-
          each market's peak is the highest of its running balance, replayed from the account's events.
      - bold: |-
          Coming back
        text: |-
          a new supply or borrow reopens this same account's timeline.
    links:
      - label: |-
          Liquidate borrow
        doc: LIQUIDATE_BORROW
      - label: |-
          Comptroller
        doc: COMPTROLLER
