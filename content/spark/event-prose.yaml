# ── The "?" modals (zone Z4): the event modals, the position card's and the
# market page's. Each stops at the mechanism and hands it to a Quick Link; no
# figure of one account appears here. ──
L5:
  supply:
    title: |-
      How Supplying Works
    intro: |-
      Supplying deposits an asset into SparkLend's Pool and mints spTokens to the wallet. The balance earns the reserve's supply rate, paid by borrowers.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Collateral
        text: |-
          a supplied asset backs borrowing while its collateral switch is on; the owner can switch it off.
      - bold: |-
          spTokens
        text: |-
          the receipt for a supply, such as spWETH for WETH; its balance grows with interest and is needed to withdraw.
      - bold: |-
          One health factor
        text: |-
          all of a wallet's supply and debt on SparkLend is one account, so one health factor covers every asset.
    links:
      - label: |-
          Supplying assets
        doc: SUPPLYING
      - label: |-
          Opting out of collateral
        doc: SUPPLY_OPT_OUT
      - label: |-
          spTokens
        doc: SPTOKEN

  withdraw:
    title: |-
      How Withdrawing Works
    intro: |-
      Withdrawing burns spTokens and returns the asset, interest included, from SparkLend's Pool to the wallet.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Limit
        text: |-
          with debt outstanding, the Pool refuses a withdrawal that would take the health factor below 1.
      - bold: |-
          Liquidity
        text: |-
          a withdrawal needs that much of the asset sitting unborrowed in the Pool.
      - bold: |-
          WETH gateway
        text: |-
          a withdrawal as ETH goes through the Spark WETH gateway, which takes the spWETH, withdraws the WETH and sends ETH on in one transaction.
    links:
      - label: |-
          Supplying assets
        doc: SUPPLYING
      - label: |-
          WETH gateway
        doc: WETH_GATEWAY

  borrow:
    title: |-
      How Borrowing Works
    intro: |-
      Borrowing draws an asset from the Pool against the account's collateral and mints variable debt that grows with interest until repaid.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Borrow limit
        text: |-
          the account may borrow up to a maximum loan-to-value; liquidation starts at a higher liquidation threshold.
      - bold: |-
          E-mode
        text: |-
          an account can pick one category of price-correlated assets; borrowing assets of that category then has higher borrowing power.
      - bold: |-
          Borrow rate
        text: |-
          a variable rate follows the reserve's supply and demand, while a transparent rate holds steady until Sky governance changes it.
      - bold: |-
          Credit delegation
        text: |-
          an owner can let another account borrow against its collateral by approving it on the debt token.
    links:
      - label: |-
          Borrowing assets
        doc: BORROWING
      - label: |-
          Variable and transparent rates
        doc: BORROW_RATE
      - label: |-
          E-mode
        doc: EMODE
      - label: |-
          Credit delegation
        doc: CREDIT_DELEGATION

  repay:
    title: |-
      How Repaying Works
    intro: |-
      Repaying returns the borrowed asset to the Pool and burns the matching debt, interest included. Anyone may repay for an account.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Same asset
        text: |-
          a loan is repaid in the asset borrowed, plus the interest accrued.
      - bold: |-
          Health
        text: |-
          less debt against the same collateral raises the health factor and the room left to borrow.
      - bold: |-
          With spTokens
        text: |-
          a repay can burn the account's spTokens of the same asset instead of tokens from the wallet.
    links:
      - label: |-
          Repaying your loan
        doc: REPAYING
      - label: |-
          Which asset to repay
        doc: REPAY_ASSET
      - label: |-
          Repay with spTokens
        doc: REPAY_SPTOKENS

  liquidation:
    title: |-
      How Liquidations Work
    intro: |-
      A SparkLend account can be liquidated once its health factor falls below 1: its collateral no longer covers its debt at the oracle's prices. Anyone may liquidate it, and bots usually do.
    extraParagraphs:
      - |-
        A liquidator repays part of one debt asset and receives collateral worth that debt plus a bonus. SparkLend keeps a share of the bonus as a fee, paid to the Spark treasury.
      - |-
        One liquidation repays up to half of the debt at a health factor between 0.95 and 1, and all of it at 0.95 or below. After a partial one the account stays open.
    links:
      - label: |-
          What is a liquidation?
        doc: LIQUIDATIONS
      - label: |-
          Variable close factor
        doc: CLOSE_FACTOR
      - label: |-
          The liquidation penalty
        doc: PENALTY

  transfer:
    title: |-
      How spToken Transfers Work
    intro: |-
      Supplied balances on SparkLend are spTokens, ERC-20 tokens that can move between accounts. A transfer hands a supplied balance to another account without leaving the Pool.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Two that are not hand-overs
        text: |-
          a transfer to the Spark WETH gateway is a withdrawal as ETH, and one to the Spark treasury inside a liquidation is that liquidation's fee.
      - bold: |-
          Health still enforced
        text: |-
          the Pool refuses a transfer that would take the sender's health factor below 1.
      - bold: |-
          Interest rides along
        text: |-
          the balance grows with interest, and keeps growing in the receiving account.
    links:
      - label: |-
          spTokens
        doc: SPTOKEN
      - label: |-
          Can I transfer spTokens?
        doc: SPTOKEN_TRANSFER

  fallback:
    title: |-
      How SparkLend Positions Work
    intro: |-
      SparkLend, a lending market built by Spark on Aave V3's design, lets a wallet supply assets as collateral and borrow against them in one account.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Supply and collateral
        text: |-
          supplied assets earn interest and, while their collateral switch is on, back the account's borrowing.
      - bold: |-
          Borrowing and health factor
        text: |-
          borrowing draws against the pooled collateral, and the health factor measures how safely the debt is covered.
      - bold: |-
          One pooled account
        text: |-
          all of a wallet's supply and debt share one account and one health factor.
    links:
      - label: |-
          SparkLend overview
        doc: SPARKLEND
      - label: |-
          Lending and borrowing
        doc: FEATURES
      - label: |-
          How SparkLend relates to Aave V3
        doc: SECURITY

  position_open:
    title: |-
      About This Position
    intro: |-
      A SparkLend position is one wallet's account on the Pool: what it supplied, what it borrowed against that, and how safely the debt is covered.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One account per wallet
        text: |-
          all of a wallet's supply backs all of its borrowing, under one health factor.
      - bold: |-
          Health factor
        text: |-
          the collateral, each asset counted up to its liquidation threshold, divided by the debt; below 1 the account can be liquidated.
      - bold: |-
          Loan-to-value
        text: |-
          the debt as a share of the collateral's value; the account may borrow up to a maximum, and liquidation starts higher.
      - bold: |-
          E-mode
        text: |-
          an account can choose one category of price-correlated assets, inside which borrowing power is higher; the card says whether it does.
      - bold: |-
          Delegated operation
        text: |-
          anyone can supply or repay for an account, but borrowing against it needs credit the owner delegated.
    links:
      - label: |-
          The health factor
        doc: BORROW_HEALTH
      - label: |-
          E-mode
        doc: EMODE
      - label: |-
          Credit delegation
        doc: CREDIT_DELEGATION
      - label: |-
          Liquidations
        doc: LIQUIDATIONS

  position_supply:
    title: |-
      About This Position
    intro: |-
      A SparkLend position is one wallet's account on the SparkLend Pool. This one supplies assets and owes nothing, so it has no health factor and cannot be liquidated.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          One account per wallet
        text: |-
          all of a wallet's supply backs all of its borrowing, under one health factor once it borrows.
      - bold: |-
          spTokens
        text: |-
          the receipt for a supply, such as spWETH for WETH; its balance grows with interest and is needed to withdraw.
      - bold: |-
          Collateral
        text: |-
          a supplied asset backs borrowing while its collateral switch is on; the owner can switch it off.
    links:
      - label: |-
          Supplying assets
        doc: SUPPLYING
      - label: |-
          spTokens
        doc: SPTOKEN

  position_closed:
    title: |-
      About This Position
    intro: |-
      This account has repaid its debt and withdrawn its collateral. Its card shows the most each reserve ever held or owed.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Highest recorded
        text: |-
          each reserve's peak is the largest balance it reached at any event, interest to then included; peaks of different reserves need not coincide.
      - bold: |-
          One account per wallet
        text: |-
          a new supply by the same wallet reopens this account.
    links:
      - label: |-
          SparkLend overview
        doc: SPARKLEND
      - label: |-
          Supplying assets
        doc: SUPPLYING

  position_liquidated:
    title: |-
      About This Position
    intro: |-
      This account was liquidated at least once, when its health factor fell below 1, and holds nothing now. Its card shows the most each reserve ever held or owed.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Highest recorded
        text: |-
          each reserve's peak is the largest balance it reached at any event, interest to then included; peaks of different reserves need not coincide.
      - bold: |-
          Liquidated
        text: |-
          a liquidation repays part of the debt and takes collateral worth that plus a bonus, so an account often survives it and closes later.
      - bold: |-
          One account per wallet
        text: |-
          a new supply by the same wallet reopens this account.
    links:
      - label: |-
          What is a liquidation?
        doc: LIQUIDATIONS
      - label: |-
          Variable close factor
        doc: CLOSE_FACTOR

  market:
    title: |-
      How the market overview works
    intro: |-
      SparkLend is one Aave-V3-architecture Pool holding every reserve, with each wallet's supplied assets cross-collateralised under one health factor. This page reads each reserve's size, rates and risk parameters live from the Pool.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Reserve
        text: |-
          one listed asset in the Pool, with its supplied balance, its variable debt and the governance-set risk parameters.
      - bold: |-
          Utilisation and rates
        text: |-
          utilisation is borrowed ÷ supplied, the bar's blue fill, with the reserve's kink as a tick; rates rise with it, and Sky governance sets some.
      - bold: |-
          Limits
        text: |-
          loan-to-value caps what a wallet can borrow against a reserve, the liquidation threshold counts toward covering debt, and the bonus pays liquidators.
      - bold: |-
          Caps used
        text: |-
          how much of each side's cap is in use; Sky governance sets the caps and the Cap Automator scales them with market depth.
      - bold: |-
          Closed reserves
        text: |-
          a frozen reserve takes no new supply or borrowing while withdrawals and repayments continue; a deprecated one still works in full.
    links:
      - label: |-
          Active, deprecated and frozen markets
        doc: MARKETS
      - label: |-
          Oracles
        doc: ORACLES
      - label: |-
          Supply and borrow caps
        doc: SUPPLY_CAPS
      - label: |-
          Variable and transparent rates
        doc: BORROW_RATE
