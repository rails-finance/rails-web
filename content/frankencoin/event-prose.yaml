  book:
    title: |-
      What the minting book counts
    intro: |-
      The book is every position Frankencoin's two Minting Hubs have opened. Each count names what it is out of.
    detailsHeading: |-
      The counts:
    details:
      - bold: |-
          Positions ever
        text: |-
          every position opened, on Hub V1 from 2023 or Hub V2 from 2024.
      - bold: |-
          Originals and clones
        text: |-
          an original proposed its terms, paid the opening fee and faced a veto window, and a clone copied an accepted position's terms.
      - bold: |-
          Open at head
        text: |-
