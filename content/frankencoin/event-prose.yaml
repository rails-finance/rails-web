        doc: EXPIRY

  position_expired:
    title: |-
      About this position
    intro: |-
      This position passed its expiration with debt outstanding. It can no longer mint, and on Minting Hub V2 anyone can buy its collateral at a falling price.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Owner-set expiration
        text: |-
          the expiry is a term the owner chose at opening, and the position's mints paid interest up to it.
      - bold: |-
          Owner-declared price
        text: |-
          Frankencoin has no oracle, and the liquidation price is the owner's declaration, which challenges test.
    links:
