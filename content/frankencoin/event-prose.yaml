# ── The "?" modals (zone Z4): the event modals, the position card's and the
# system view's minting book. Each stops at the mechanism and hands it to a
# Quick Link; no figure of one position appears here. A concept with
# `only: <form>` is drawn for that form alone: `handover` on a creation
# handover, `forced` on a position a forced sale ended. ──
L5:
  minting:
    title: |-
      How minting and repaying work
    intro: |-
      A Frankencoin position mints new ZCHF against the collateral it holds. The debt is the gross amount minted, and the owner can mint, repay or move collateral within the position's limits.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Gross debt
        text: |-
          a mint adds its whole amount to the debt, and the wallet receives it less the reserve share and the interest.
      - bold: |-
          Interest up front
        text: |-
          the system base rate plus the position's risk premium, in force at the mint, is charged up front for the time left to expiry.
        text_v1: |-
          the position's rate, fixed when it opened, is charged up front to expiry, for at least 4 weeks (28 days of interest).
      - bold: |-
          Not returned
        text: |-
          the interest stays paid when the owner repays early and goes to the reserve as equity, in which FCS holders share.
      - bold: |-
          Reserve share
        text: |-
          a set share of each mint stays in the reserve and comes back on repayment while the reserve covers every position's share.
      - bold: |-
          The limit
        text: |-
          the debt may not exceed the collateral times the declared price, and an original and its clones share one minting limit.
    links:
      - label: |-
          Minting and repayment
        doc: ADJUST_MINT
      - label: |-
          Interest and minting capacity
        doc: OPEN_INTEREST
      - label: |-
          The reserve share
        doc: OPEN_RESERVE
      - label: |-
          Adding or withdrawing collateral
        doc: ADJUST_COLLATERAL

  price:
    title: |-
      How the declared price works
    intro: |-
      Frankencoin has no price oracle. Each position stores a liquidation price in ZCHF per unit of collateral, declared by its owner and tested by challenges.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          What it limits
        text: |-
          the collateral times the declared price is the most debt the position may carry.
      - bold: |-
          Lowering
        text: |-
          applies at once, as long as the debt still fits under the new price.
      - bold: |-
          Raising
        text: |-
          pauses minting and collateral withdrawals for three days, so the new price can be challenged before it backs new ZCHF.
      - bold: |-
          In one adjust
        text: |-
          the mint runs before the price change, so a raise cannot back a mint made in the same transaction.
      - bold: |-
          Challenges
        text: |-
          anyone who thinks the price too high can start an auction that tests it.
    links:
      - label: |-
          Setting the liquidation price
        doc: OPEN_PRICE
      - label: |-
          Lowering the price
        doc: ADJUST_LOWER
      - label: |-
          Raising the price
        doc: ADJUST_RAISE
      - label: |-
          Challenges and auctions
        doc: AUCTION

  creation:
    title: |-
      How a position is created
    intro: |-
      Every Frankencoin position is a contract with one owner, its collateral and its debt. It starts as a new original that proposes terms, or as a clone of an accepted position.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          The handover
        only: handover
        text: |-
          the creating transaction can pass ownership through the hub and a helper contract before it reaches the owner.
      - bold: |-
          Original
        text: |-
          proposes its collateral, price, rate and limits, pays a 1,000 ZCHF opening fee and waits a veto window of at least three days.
      - bold: |-
          Veto
        text: |-
          in that window, holders of more than 1% of the votes, which the FCS share token carries, can deny it for good.
      - bold: |-
          Clone
        text: |-
          copies an accepted position's terms and price, skips the veto window and shares its family's minting limit.
      - bold: |-
          Fixed terms
        text: |-
          the collateral token, reserve share, challenge period and expiry stay fixed, while the owner can change the price, collateral and debt.
    links:
      - label: |-
          Opening a new position
        doc: OPEN_TERMS
      - label: |-
          Cloning a position
        doc: CLONE
      - label: |-
          Who can veto
        doc: VETO
      - label: |-
          The share token FCS
        doc: FCS

  ownership:
    title: |-
      Position ownership
    intro: |-
      A position is a contract, and its owner is whoever holds it now. A new owner takes over the collateral, the debt and the right to adjust the position.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Only the owner adjusts
        text: |-
          minting, repaying, moving collateral and changing the declared price belong to the owner.
      - bold: |-
          Others can act
        text: |-
          a challenge, or a forced sale after expiry, runs with no action from the owner.
    links:
      - label: |-
          The position's owner
        doc: ADJUST_OWNER
      - label: |-
          Challenges and auctions
        doc: AUCTION

  challenge:
    title: |-
      How Frankencoin challenges work
    intro: |-
      A challenger who thinks a position's declared price is too high posts the same collateral and starts a two-phase auction. Each phase lasts the position's challenge period.
    stepsHeading: |-
      The two phases:
    steps:
      - |-
        Phase 1: anyone, the owner included, can buy the challenger's collateral at the declared price, which averts the challenge.
      - |-
        An averted challenge leaves the position's collateral and debt as they were, and pauses its minting for a day.
      - |-
        Phase 2: if nobody bought, the position's collateral is sold at a price falling from the declared price to zero.
      - |-
        From each phase-2 bid the challenger takes 2% and gets back its collateral; the rest repays the debt.
      - |-
        A shortfall comes from the position's reserve share, then equity; an excess goes to the reserve and the owner.
    extraParagraphs:
      - |-
        One challenge can settle in several slices: each phase-2 bid settles separately under the same challenge number.
    links:
      - label: |-
          Auction design
        doc: AUCTION
      - label: |-
          Starting a challenge
        doc: AUCTION_START
      - label: |-
          How a challenge settles
        doc: RESERVE_CHALLENGE
      - label: |-
          Who covers a loss
        doc: RESERVE_LOSSES

  forced_sale:
    title: |-
      How a forced sale works
    intro: |-
      Once a Minting Hub V2 position passes its expiration, anyone can buy its collateral through the hub at a price set by time since expiry. No challenge is involved.
    stepsHeading: |-
      The price and the money:
    steps:
      - |-
        First challenge period after expiry: the price falls evenly from 10× the declared price to 1×.
      - |-
        Second challenge period: the price falls from the declared price to zero, after which the collateral goes for nothing.
      - |-
        Anyone, the owner included, can buy any amount up to all the collateral at that moment's price.
      - |-
        When price and reserve share cover the debt, the share goes to the buyer and the owner gets the rest.
      - |-
        Otherwise the price repays what it can, and selling the last collateral leaves the reserve to pay the gap.
    links:
      - label: |-
          Expiry and the forced sale
        doc: EXPIRY
      - label: |-
          Who covers a loss
        doc: RESERVE_LOSSES

  lifecycle:
    title: |-
      A Frankencoin position's lifecycle
    intro: |-
      A position runs on clocks: a veto window before an original may mint, an expiration after which no position may, and pauses in between.
    detailsHeading: |-
      The lifecycle edges:
    details:
      - bold: |-
          Veto window
        text: |-
          a new original waits at least three days before its first mint, and a veto in that window disables minting for good.
      - bold: |-
          Pause
        text: |-
          raising the declared price pauses minting for three days, so the new price can be challenged first.
      - bold: |-
          Expiration
        text: |-
          past its expiration a position cannot mint, and on Minting Hub V2 anyone can buy its collateral at a falling price.
      - bold: |-
          Closing
        text: |-
          a position closes when its collateral and debt are both gone, and its last repayment releases its reserve share.
    links:
      - label: |-
          The veto window
        doc: OPEN_TERMS
      - label: |-
          The pause after a raise
        doc: ADJUST_RAISE
      - label: |-
          Expiry and the forced sale
        doc: EXPIRY
      - label: |-
          Withdrawing to close
        doc: ADJUST_COLLATERAL

  fallback:
    title: |-
      How Frankencoin works
    intro: |-
      Frankencoin (ZCHF) is a Swiss-franc stablecoin minted against collateral with no price oracle. Owners declare their positions' prices, challenges test them, and a reserve absorbs shortfalls.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Positions are contracts
        text: |-
          each borrower owns a position contract, whose address is its identity and whose ownership can change by transfer.
      - bold: |-
          Native units
        text: |-
          debt is in ZCHF, collateral in the position's token, and the one price is the owner's declared liquidation price.
      - bold: |-
          No health factor
        text: |-
          a position's risk is its challenges, its declared price, its expiry and any running pause.
    links:
      - label: |-
          Frankencoin's structure
        doc: STRUCTURE
      - label: |-
          Auctions in place of an oracle
        doc: NO_ORACLE

  position_open:
    title: |-
      About this position
    intro: |-
      The card reads the position contract now: its collateral, the ZCHF it owes, the liquidation price its owner declared and the terms it runs on.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Owner-declared price
        text: |-
          the owner sets the liquidation price, and the collateral times that price is the most debt the position may carry.
      - bold: |-
          Interest up front
        text: |-
          each mint pays the base rate plus the position's risk premium up front to expiry, and nothing accrues after.
        text_v1: |-
          each mint pays the rate fixed at opening up front, to expiry and for at least 4 weeks, and nothing accrues after.
      - bold: |-
          Reserve share
        text: |-
          part of every mint stays in the reserve and comes back on repayment while the reserve covers every position's share.
      - bold: |-
          Challenges
        text: |-
          anyone who thinks the declared price too high can post the same collateral and start a two-phase auction against the position.
      - bold: |-
          Expiry
        text: |-
          past its expiry the position cannot mint, and on Minting Hub V2 anyone may buy its collateral at a falling price.
        text_v1: |-
          past its expiry the position cannot mint.
    links:
      - label: |-
          The liquidation price
        doc: OPEN_PRICE
      - label: |-
          Interest and expiry
        doc: OPEN_INTEREST
      - label: |-
          The reserve share
        doc: OPEN_RESERVE
      - label: |-
          Challenges and auctions
        doc: AUCTION

  position_closed:
    title: |-
      About this position
    intro: |-
      This position is closed: it holds no collateral and owes no ZCHF. The card shows its lifetime peaks, the most collateral and debt it ever held.
    intro_forced: |-
      This position is closed: a forced sale after its expiration sold its collateral and cleared its debt. The card shows its lifetime peaks.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Interest up front
        text: |-
          each mint paid interest at once for the time left to expiry, so the debt never grew between mints.
        text_v1: |-
          each mint paid the rate fixed at opening at once, to expiry and for at least 4 weeks, so the debt never grew between mints.
      - bold: |-
          Reserve share
        text: |-
          part of every mint was held in the reserve and released as the position repaid, while the reserve covered every share.
      - bold: |-
          Forced sale
        only: forced
        text: |-
          after expiry anyone could buy the collateral at a falling price, the payment repaying the debt first.
    links:
      - label: |-
          Interest and expiry
        doc: OPEN_INTEREST
      - label: |-
          The reserve share
        doc: OPEN_RESERVE
      - label: |-
          Expiry and the forced sale
        doc: EXPIRY

  position_denied:
    title: |-
      About this position
    intro: |-
      This position was denied: holders of more than 1% of the governance votes vetoed it in its veto window, before it minted any ZCHF.
    detailsHeading: |-
      Key concepts:
    details:
      - bold: |-
          Veto window
        text: |-
          a new original waits at least three days, a period its owner chose, before its first mint, and a veto ends minting for good.
      - bold: |-
          Clones skip the wait
        text: |-
          only originals have a veto window, and a clone uses an accepted original's terms and can mint at once.
      - bold: |-
          Forced sale
        only: forced
        text: |-
          after expiry anyone could buy the collateral at a falling price, the payment repaying the debt first.
    links:
